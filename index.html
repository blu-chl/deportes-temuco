<body>

<script>
const SB_URL='https://vskhzbstwadaabzyhzwh.supabase.co'
const SB_KEY='sb_publishable_Xpm4vH8few7gjsDcIM_2qA_3rjYFHeu'
let AUTH_TOKEN=SB_KEY
// Worker de Cloudflare que dispara el scraper de GitHub Actions — el
// token de GitHub no puede vivir acá (sería público), así que este Worker
// lo guarda como secreto y solo lo usa si recibe una sesión de admin
// válida. Se completa después de desplegarlo (ver scraper-trigger/README.md).
const SCRAPER_TRIGGER_URL=''
async function dispararScraper(){
  if(!SCRAPER_TRIGGER_URL){toast('Falta desplegar el Worker — ver scraper-trigger/README.md',true);return}
  toast('Lanzando el scraper…')
  try{
    const r=await fetch(SCRAPER_TRIGGER_URL,{method:'POST',headers:{Authorization:'Bearer '+AUTH_TOKEN}})
    const d=await r.json()
    if(d.ok)toast('Scraper lanzado ✓ — tarda unos minutos, revisá GitHub Actions')
    else toast('Error: '+(d.error||'desconocido'),true)
  }catch(e){toast('No se pudo contactar al Worker',true)}
}
const hdrs=()=>({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+AUTH_TOKEN,'Prefer':'return=representation'})

async function sb(method,table,body,params=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}${params}`,{method,headers:hdrs(),body:body?JSON.stringify(body):undefined})
  const t=await r.text()
  try{const parsed=JSON.parse(t);if(!r.ok&&parsed&&parsed.code)return parsed;return parsed}catch(e){return[]}
}
const get=(t,p='')=>sb('GET',t,null,p)
const post=(t,b)=>sb('POST',t,b)
const patch=(t,b,p)=>sb('PATCH',t,b,p)
const del=(t,p)=>sb('DELETE',t,null,p)

function toast(msg,err=false){
  const el=document.getElementById('toast')
  el.textContent=msg;el.className='toast show'+(err?' err':'')
  setTimeout(()=>el.className='toast',2500)
}
function hoy(){return new Date().toISOString().split('T')[0]}

const ICONOS={Gol:'⚽',Asistencia:'🅰️',Amarilla:'🟡',Roja:'🔴','Sustitución':'🔄'}
// SUBTIPOS_GOL/SUBTIPOS_ASIST (declaradas más abajo) son la ÚNICA lista de
// tipos de gol/asistencia — antes existían dos listas separadas
// (TIPOS_GOL/TIPOS_ASIST acá y SUBTIPOS_GOL/SUBTIPOS_ASIST en Enriquecer)
// y agregar un tipo en Config no aparecía en Enriquecer porque eran
// variables distintas. Se unificaron en una sola.

// Posiciones específicas agrupadas por zona
const POS_GRUPOS={
  POR:['Portero'],
  DEF:['Central (DC)','Lateral Izquierdo (LI)','Lateral Derecho (LD)','Carrilero Izquierdo','Carrilero Derecho','Líbero'],
  MED:['Volante Defensivo (VD)','Volante Central (VC)','Interior Izquierdo (MI)','Interior Derecho (MD)','Mediocampista Ofensivo (MCO)','Extremo Izquierdo (EI)','Extremo Derecho (ED)','Enganche'],
  DEL:['Delantero Centro (DC)','Segunda Punta (SP)','Falso 9','Ariete']
}
// Zona general de cada posición específica (para formation slots)
const POS_ZONA={}
Object.entries(POS_GRUPOS).forEach(([zona,lista])=>lista.forEach(p=>POS_ZONA[p]=zona))

const FORMACIONES={
  // 4 defensas

function parseFormacion(str){
  const parts=str.trim().split('-').map(Number)
  if(parts.length<2||parts.some(isNaN)||parts.some(n=>n<1))return null
  if(parts.reduce((a,b)=>a+b,0)!==10)return null
  const lineas=[{pos:'POR',n:1}]
  parts.forEach((n,i)=>{
    if(i===0)lineas.push({pos:'DEF',n})
    else if(i===parts.length-1)lineas.push({pos:'DEL',n})
    else lineas.push({pos:'MED',n})
  })
  return lineas
}

function aplicarFormacionCustom(){
  const inp=document.getElementById('form-custom-inp');if(!inp)return
  const str=inp.value.trim().replace(/\s+/g,'')

  if(!parsed){toast('Debe sumar 10 (ej: 4-3-3, 3-4-1-2)',true);return}
  FORMACIONES[str]=parsed

  customs[str]=parsed
  localStorage.setItem('dt-formaciones',JSON.stringify(customs))
  render();toast(`Formación ${str} guardada ✓`)
  guardarTitularesAuto()
}

function calcMinutajeAuto(titularIds,evs,duracion=90){
  const mins={}
  const entradas={}  // minuto en que entró cada jugador
  titularIds.forEach(id=>{if(id){mins[id]=duracion;entradas[id]=0}})
  evs.filter(e=>e.tipo==='Sustitución').sort((a,b)=>a.minuto-b.minuto).forEach(sub=>{
    const min=sub.minuto||0
    // El que sale: minutos reales = minuto_salida - minuto_entrada
    if(sub.jugador_sale_id!=null&&mins[sub.jugador_sale_id]!==undefined)
      mins[sub.jugador_sale_id]=min-(entradas[sub.jugador_sale_id]??0)
    // El que entra: registrar su minuto de entrada y calcular minutos disponibles
    if(sub.jugador_id!=null){
      entradas[sub.jugador_id]=min
      mins[sub.jugador_id]=duracion-min
    }
  })
  return mins
}

function jugOpts(){
  let lista=[...S.jugadores]
  if(S.ordenJug==='apellido'){
    lista.sort((a,b)=>{
      const aa=a.nombre.split(' ').slice(1).join(' ')||a.nombre
      const bb=b.nombre.split(' ').slice(1).join(' ')||b.nombre
      return aa.localeCompare(bb)
    })
  }else{
    lista.sort((a,b)=>a.numero-b.numero)

  return lista.map(j=>{
    const ap=j.nombre.trim().split(' ').slice(1).join(' ')||j.nombre
    return`<option value="${j.id}">${j.numero} ${ap}</option>`
  }).join('')
}

async function cargarDatos(){
  const[jugs,parts,evs,less,nts,mins]=await Promise.all([
    get('jugadores','?activo=eq.true&order=numero'),
    get('partidos','?order=fecha'),
    get('eventos','?order=minuto'),
    get('lesiones','?or=(alta.is.false,alta.is.null)'),
    get('notas','?order=created_at.desc'),
    get('minutaje','?order=partido_id'),
  ])
  S.jugadores=Array.isArray(jugs)?jugs:[]
  S.partidos=Array.isArray(parts)?parts:[]
  S.eventos=Array.isArray(evs)?evs:[]
  S.lesiones=Array.isArray(less)?less:[]
  S.notas=Array.isArray(nts)?nts:[]
  S.minutaje=Array.isArray(mins)?mins:[]
  if(S.jugadores.length){
    S.ev.jugador_id=S.jugadores[0].id
    S.ev.jugador_sale_id=S.jugadores[0].id
    S.addLes.jugador_id=S.jugadores[0].id
  }
  render()
}

async function doLogin(){
  const email=document.getElementById('l-email').value.trim()
  const pass=document.getElementById('l-pass').value
  const btn=document.getElementById('l-btn'),err=document.getElementById('lerr')
  if(!email||!pass){err.textContent='Completa todos los campos';err.style.display='block';return}
  btn.textContent='Ingresando...';btn.disabled=true
  const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{
    method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},
    body:JSON.stringify({email,password:pass})
  })
  const d=await r.json()
  if(d.access_token){
    AUTH_TOKEN=d.access_token;S.isAdmin=true;S.pag='admin';S.adminSub='enriquecer'
    await cargarDatos()
    if(!S.enriq.loaded)cargarEnriquecimiento()
  }
  else{err.textContent='Correo o contraseña incorrectos';err.style.display='block';btn.textContent='Ingresar';btn.disabled=false}
}

  // Goles recibidos/90 solo para porteros

      {l:'GC totales',v:gcTotal,c:'var(--ro)'},{l:'GC/90',v:gc90,c:'var(--ro)'},
      {l:'Amarillas',v:amarillas,c:'var(--am)'},{l:'Rojas',v:rojas,c:'var(--ro)'},
    ]:[
      {l:'Goles',v:goles,c:'var(--vc)'},{l:'⚽/90',v:g90,c:'var(--vc)'},
      {l:'Asistencias',v:asist,c:'var(--az)'},{l:'🅰️/90',v:a90,c:'var(--az)'},
      {l:'Amarillas',v:amarillas,c:'var(--am)'},{l:'Rojas',v:rojas,c:'var(--ro)'},

  const mr=document.getElementById('modal-root')
  mr.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)cerrarModal()">

        </div>
        <div>
          <div style="font-size:18px;font-weight:800"><span title="${j.nacionalidad||'Chilena'}">${banderaNac(j.nacionalidad||'Chilena')}</span> ${j.nombre}</div>
          <div style="font-size:12px;color:var(--gris);margin-top:2px">#${j.numero} · <span class="pos-${j.posicion}">${j.posicion_especifica||j.posicion}</span></div>
          ${j.club_origen?`<div style="font-size:11px;color:var(--muted);margin-top:2px">Origen: ${j.club_origen}</div>`:''}
        </div>
        <button onclick="cerrarModal()" style="margin-left:auto;background:transparent;border:none;color:var(--gris);font-size:18px;cursor:pointer;align-self:flex-start">✕</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        ${stats.map(s=>`<div style="background:rgba(16,24,32,0.035);border-radius:7px;padding:10px 12px">
          <div style="font-size:10px;color:var(--gris);text-transform:uppercase;margin-bottom:3px">${s.l}</div>
          <div style="font-size:22px;font-weight:800;color:${s.c}">${s.v}</div>
        </div>`).join('')}
      </div>
      ${golesDetalle.length?`<div style="margin-top:12px">
        <div style="font-size:10px;color:var(--vc);text-transform:uppercase;font-weight:700;letter-spacing:.5px;margin-bottom:6px">⚽ Goles (${golesDetalle.length})</div>
        <div style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">
          ${golesDetalle.map(g=>`<div style="display:flex;align-items:center;justify-content:space-between;background:rgba(200,21,39,0.07);border:1px solid rgba(200,21,39,0.15);border-radius:6px;padding:6px 10px">
            <div>
              <div style="font-size:12px;font-weight:700">vs ${g.rival} <span style="font-size:10px;font-weight:400;color:var(--gris)">(${g.cond})</span></div>
              ${g.subtipo?`<div style="font-size:10px;color:var(--gris);margin-top:1px">${g.subtipo}</div>`:''}
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:10px">
              <div style="font-size:12px;color:var(--vc);font-weight:800">${g.minuto}'</div>
              <div style="font-size:10px;color:var(--muted)">${g.fecha}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>`:''}

      ${asistDetalle.length?`<div style="margin-top:12px">
        <div style="font-size:10px;color:var(--az);text-transform:uppercase;font-weight:700;letter-spacing:.5px;margin-bottom:6px">🅰️ Asistencias (${asistDetalle.length})</div>
        <div style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">
          ${asistDetalle.map(a=>`<div style="display:flex;align-items:center;justify-content:space-between;background:rgba(56,132,221,0.07);border:1px solid rgba(56,132,221,0.15);border-radius:6px;padding:6px 10px">
            <div>
              <div style="font-size:12px;font-weight:700">vs ${a.rival} <span style="font-size:10px;font-weight:400;color:var(--gris)">(${a.cond})</span></div>
              <div style="font-size:10px;color:var(--gris);margin-top:1px">${a.receptor?`→ gol de ${a.receptor.split(' ').pop()}`:''}${a.subtipo?` · ${a.subtipo}`:''}</div>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:10px">
              <div style="font-size:12px;color:var(--az);font-weight:800">${a.minuto}'</div>
              <div style="font-size:10px;color:var(--muted)">${a.fecha}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>`:''}

      ${lesHist.length?`<div style="margin-top:12px">
        <div style="font-size:10px;color:var(--gris);text-transform:uppercase;font-weight:700;letter-spacing:.5px;margin-bottom:6px">Lesiones</div>
        ${lesHist.map(l=>`<div style="font-size:11px;padding:5px 0;border-bottom:1px solid rgba(16,24,32,0.05);display:flex;justify-content:space-between">
          <span>${l.tipo}</span>
          <span style="color:var(--gris)">${l.fecha_inicio} · ${l.semanas_recuperacion} sem. ${l.alta?'<span style="color:var(--vc)">✓ Alta</span>':''}</span>
        </div>`).join('')}
      </div>`:''}
      ${j.notas?`<div style="margin-top:12px;font-size:11px;color:var(--gris);font-style:italic">${j.notas}</div>`:''}
    </div>
  </div>`
}

async function handleFotoUpload(jugId,input){
  const file=input.files[0];if(!file)return
  toast('Subiendo foto...')
  const ext=file.name.split('.').pop()
  const filename=`jugador_${jugId}_${Date.now()}.${ext}`
  try{
    const r=await fetch(`${SB_URL}/storage/v1/object/jugadores/${filename}`,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+AUTH_TOKEN,'Content-Type':file.type,'x-upsert':'true'},
      body:file
    })
    if(r.ok){
      const url=`${SB_URL}/storage/v1/object/public/jugadores/${filename}`
      await patch('jugadores',{foto_url:url},`?id=eq.${jugId}`)
      toast('Foto actualizada ✓');cerrarModal();await cargarDatos()
    }else toast('Error — verifica el bucket "jugadores" en Supabase',true)
  }catch(e){toast('Error de conexión',true)}
}

async function borrarPartido(id){
  await del('eventos',`?partido_id=eq.${id}`)
  await del('partidos',`?id=eq.${id}`)
  if(S.partidoActivo===id){S.partidoActivo=null;S.evPartido=[];S.titulares=[]}
  toast('Partido eliminado');cerrarModal();await cargarDatos()
}

async function borrarEvento(id){
  await del('eventos',`?id=eq.${id}`)
  S.evPartido=S.evPartido.filter(e=>e.id!==id)
  await recalcPartidoAuto()
  await cargarDatos()
  toast('Evento eliminado')
}

function renderPitch(){
  const form=FORMACIONES[S.formacion]||FORMACIONES['4-4-2']
  const slots=[]
  form.forEach((linea,li)=>{
    for(let i=0;i<linea.n;i++)slots.push({linea:li,pos:linea.pos,idx:slots.length})
  })
  const lineas=[]
  let cur=[],lastL=-1
  slots.forEach(s=>{
    if(s.linea!==lastL&&cur.length>0){lineas.push(cur);cur=[]}
    cur.push(s);lastL=s.linea
  })
  if(cur.length)lineas.push(cur)

  const jugOptsSlot=[...S.jugadores].sort((a,b)=>a.numero-b.numero).map(j=>{
    const ap=j.nombre.trim().split(' ').slice(1).join(' ')||j.nombre
    return`<option value="${j.id}">${j.numero} ${ap}${j.posicion_especifica?' · '+j.posicion_especifica:''}</option>`
  }).join('')

  const lineasHtml=[...lineas].reverse().map(linea=>`
    <div class="linea-pos">${linea.map(s=>{
      const jugId=S.titulares[s.idx]
      const j=S.jugadores.find(x=>x.id===jugId)
      const ap=j?(j.nombre.trim().split(' ').slice(1).join(' ')||j.nombre):''
      const posColor=s.pos==='POR'?'#e8b84b':s.pos==='DEF'?'#378ADD':s.pos==='DEL'?'#cc4444':'#2ea84f'
      // Buscar si hubo sustitución para este titular
      const subEv=j?S.evPartido.find(e=>e.tipo==='Sustitución'&&e.jugador_sale_id===jugId):null
      const subEntra=subEv?S.jugadores.find(x=>x.id===subEv.jugador_id):null
      const subAp=subEntra?(subEntra.nombre.trim().split(' ').slice(1).join(' ')||subEntra.nombre):''
      const numGoles=j?S.evPartido.filter(e=>e.tipo==='Gol'&&e.jugador_id===jugId).length:0
      const numAm=j?S.evPartido.filter(e=>e.tipo==='Amarilla'&&e.jugador_id===jugId).length:0
      const numAsist=j?S.evPartido.filter(e=>e.tipo==='Asistencia'&&e.jugador_id===jugId).length:0
      return`<div class="slot ${j?'filled':''}" onclick="selSlot(${s.idx})" title="${j?(S.partidoActivo?'📋 Clic para registrar evento':'Cambiar jugador'):'Asignar jugador'}">
        ${j?`<div style="position:absolute;top:3px;left:3px;font-size:8px;font-weight:900;color:#666;background:rgba(0,0,0,0.08);border-radius:3px;padding:0 3px;line-height:14px">${j.numero}</div>`:''}
        ${numAm>0?`<div style="position:absolute;top:3px;right:3px;font-size:11px;line-height:1" title="${numAm} amarilla(s)">🟡${numAm>1?`<span style="font-size:7px;font-weight:800;color:#333">${numAm}</span>`:''}</div>`:''}
        ${(numGoles>0||numAsist>0)?`<div style="position:absolute;bottom:2px;right:2px;display:flex;flex-direction:column;align-items:flex-end;gap:0;line-height:1.1">
          ${numGoles>0?`<span style="font-size:10px">⚽${numGoles>1?`<span style="font-size:6px;font-weight:800;color:#333">${numGoles}</span>`:''}</span>`:''}
          ${numAsist>0?`<span style="font-size:10px">🅰️${numAsist>1?`<span style="font-size:6px;font-weight:800;color:#333">${numAsist}</span>`:''}</span>`:''}
        </div>`:''}
        ${subEv?`<div style="position:absolute;bottom:2px;left:2px;font-size:11px;line-height:1" title="Sustituido min ${subEv.minuto}">🔄</div>`:''}
        ${j&&j.foto_url?`<img class="slot-avatar" src="${j.foto_url}">`:`<span class="slot-num">${j?j.numero:(s.idx+1)}</span>`}
        ${j?`<span class="slot-name">${ap}</span>`:''}
        <span class="slot-pos-badge" style="background:${posColor}22;color:${posColor}">${s.pos}</span>
      </div>`
    }).join('')}</div>`).join('')

  const titCount=S.titulares.filter(x=>x).length

  const subsEvts=S.evPartido.filter(e=>e.tipo==='Sustitución')

      <div style="flex:1;height:2px;background:rgba(16,24,32,0.14);border-radius:1px"></div>

        if(!jE)return''
        const ini=jE.nombre.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase()
        const apE=jugApellido(jE.id)
        const numGoles=S.evPartido.filter(ev=>ev.tipo==='Gol'&&ev.jugador_id===jE.id).length
        const numAm=S.evPartido.filter(ev=>ev.tipo==='Amarilla'&&ev.jugador_id===jE.id).length

            ${(numGoles>0||numAsist>0)?`<div style="position:absolute;bottom:-2px;right:-2px;display:flex;flex-direction:column;align-items:flex-end;gap:0;line-height:1.1">

        </div>`
      }).join(''):'<span style="font-size:10px;color:var(--muted)">Sin cambios registrados</span>'}
    </div>
  </div>`

  return`<div class="panel">

      <span class="pt">Formación y 11 inicial</span>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">

async function guardarEventoSlot(){
  const p=S.slotEvPanel
  if(!p||!S.partidoActivo)return
  // Para sustituciones desde un slot del 11 inicial: el jugador clickeado SALE,
  // el seleccionado en "Entra en su lugar" es quien ENTRA (jugador_id del evento).
  const isSubStarter=p.tipo==='Sustitución'&&p.slotIdx>=0
  const jugId=isSubStarter?(+p.jugador_sale_id||null):p.jugId
  const jugSale=isSubStarter?p.jugId:(p.tipo==='Sustitución'?(+p.jugador_sale_id||null):null)
  const r=await post('eventos',{
    partido_id:S.partidoActivo,jugador_id:jugId,tipo:p.tipo,minuto:+p.minuto,
    subtipo:['Gol','Asistencia'].includes(p.tipo)?p.subtipo:null,
    jugador_sale_id:jugSale,
  })
  if(Array.isArray(r)&&r[0]){
    let msg='Evento registrado ✓'
    if(p.tipo==='Gol'&&p.asistidor_id){
      await post('eventos',{partido_id:S.partidoActivo,jugador_id:+p.asistidor_id,tipo:'Asistencia',
        subtipo:p.asist_subtipo||'Pase',minuto:+p.minuto,jugador_sale_id:null})
      msg='Gol + Asistencia guardados ✓'
    }
    toast(msg)
    S.slotEvPanel=null
    document.getElementById('modal-root').innerHTML=''
    await cargarDatos();await selPartido(S.partidoActivo)
    await recalcPartidoAuto()
    await cargarDatos()
  }else toast('Error al guardar',true)
}

async function cargarEnriquecimiento(){
  if(!S.liga.loaded)await cargarLiga()
  const tid=S.liga.temucoId
  if(!tid){S.enriq.loaded=true;render();return}
  const[goles,jugadores]=await Promise.all([
    ligaGet('liga_goles',`?equipo_id=eq.${tid}&autogol=eq.false&select=id,minuto,minuto_extra,penal,subtipo,asistidor_id,asist_subtipo,jugador:liga_jugadores!liga_goles_jugador_id_fkey(id,nombre,apellido),partido:liga_partidos!liga_goles_partido_id_fkey(jornada,local:liga_equipos!liga_partidos_equipo_local_id_fkey(nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(nombre))&order=minuto.desc`),
    ligaGet('liga_jugadores',`?equipo_id=eq.${tid}&select=id,nombre,apellido,foto_url&order=apellido`),
  ])
  // Estas columnas son la migración scraper/sql/liga_enriquecimiento.sql —
  // si todavía no se corrió, PostgREST devuelve un error (no un array) y
  // hay que avisarlo en vez de mostrar la página vacía como si no hubiera datos.
  S.enriq.sqlPendiente=!Array.isArray(goles)||!Array.isArray(jugadores)
  S.enriq.goles=Array.isArray(goles)?goles:[]
  S.enriq.jugadores=Array.isArray(jugadores)?jugadores:[]
  S.enriq.golesSnapshot=null
  S.enriq.loaded=true
  render()
  if(!S.enriq.sqlPendiente)await sincronizarFotosLiga()
}

// Copia foto_url desde el plantel propio (Plantilla, donde ya se cargan
// fotos hace rato) hacia liga_jugadores, matcheando por nombre — así no
// hay que volver a pegar las mismas URLs a mano. Solo completa lo que
// esté vacío, nunca pisa una foto ya cargada acá.
async function sincronizarFotosLiga(manual){
  // En paralelo — antes era un await secuencial por jugador, que con ~30
  // jugadores hacía sentir lenta la primera entrada a Enriquecer (varios
  // segundos solo esperando escrituras una por una).
  const pendientes=S.enriq.jugadores.map(j=>{
    if(j.foto_url)return null
    const match=matchJugadorPropio(j.nombre,j.apellido)
    return match&&match.foto_url?{j,url:match.foto_url}:null
  }).filter(Boolean)
  if(!pendientes.length){if(manual)toast('Ya está todo sincronizado ✓');return}
  const resultados=await Promise.all(pendientes.map(({j,url})=>patch('liga_jugadores',{foto_url:url},`?id=eq.${j.id}`).then(r=>({j,url,ok:!(r&&r.code)}))))
  let sincronizadas=0
  resultados.forEach(({j,url,ok})=>{if(ok){j.foto_url=url;sincronizadas++}})
  if(sincronizadas>0){render();toast(`${sincronizadas} foto${sincronizadas>1?'s':''} sincronizada${sincronizadas>1?'s':''} desde Plantilla`)}
  else if(manual)toast('Error al sincronizar',true)
}

// Recupera goles/asistencias que ya estaban cargados a mano en el registro
// viejo (tablas "partidos"/"eventos", Primera B, hasta que se dejó de
// mantener) y los cruza con los datos scrapeados: mismo partido (por rival
// + fecha + condición), mismo jugador (por nombre), mismo minuto. Es
// conservador — si algo no calza con confianza, lo salta en vez de
// arriesgar un dato mal atribuido.
async function migrarDatosAntiguos(){
  const tid=S.liga.temucoId
  if(!tid){toast('Falta cargar la liga',true);return}
  toast('Buscando coincidencias con el registro antiguo…')
  const[partidosPropios,eventosPropios]=await Promise.all([
    get('partidos','?competencia=eq.Primera B&select=id,rival,fecha,condicion'),
    get('eventos','?tipo=in.(Gol,Asistencia)&select=id,tipo,partido_id,jugador_id,minuto,subtipo'),
  ])
  if(!Array.isArray(partidosPropios)||!Array.isArray(eventosPropios)){toast('Error leyendo el registro antiguo',true);return}
  if(!S.partidosLiga.loaded)await cargarPartidosLiga()
  const ligaPartidos=S.partidosLiga.partidos

  const nombreRivalParecido=(a,b)=>{
    const na=normalizarNombreCmp(a),nb=normalizarNombreCmp(b)
    return na.includes(nb)||nb.includes(na)||scoreNombreCmp(a,b)>=0.5
  }
  const mapaPartidos={}
  partidosPropios.forEach(pp=>{
    const candidato=ligaPartidos.find(lp=>lp.resultado&&lp.condicion===pp.condicion&&nombreRivalParecido(pp.rival,lp.rival)&&Math.abs(new Date(lp.fecha_hora)-new Date(pp.fecha+'T12:00:00'))<=1000*60*60*24*3)
    if(candidato)mapaPartidos[pp.id]=candidato
  })

  const ligaJugadores=S.enriq.jugadores.length?S.enriq.jugadores:await ligaGet('liga_jugadores',`?equipo_id=eq.${tid}&select=id,nombre,apellido`)
  const matchLiga=nombrePropio=>{
    let mejor=null,mejorScore=0
    ligaJugadores.forEach(lj=>{
      const s=scoreNombreCmp(nombrePropio,`${lj.nombre} ${lj.apellido}`)
      if(s>mejorScore){mejorScore=s;mejor=lj}
    })
    return mejorScore>=0.9?mejor:null
  }
  const jugPropioMap={};S.jugadores.forEach(j=>{jugPropioMap[j.id]=j})

  // El minuto del registro manual viejo casi nunca calza EXACTO con el
  // minuto oficial scrapeado (off-by-one es lo normal, y en descuento el
  // registro viejo anotaba el minuto real p.ej. 94' mientras ANFP lo separa
  // en minuto=90 + minuto_extra=4) — por eso se busca el gol del MISMO
  // jugador con el minuto efectivo (minuto+minuto_extra) más cercano,
  // dentro de una tolerancia, en vez de exigir coincidencia exacta.
  const TOLERANCIA_MIN=3
  let golesActualizados=0,asistActualizados=0
  for(const pp of partidosPropios){
    const lp=mapaPartidos[pp.id]
    if(!lp)continue
    const evsPartido=eventosPropios.filter(e=>e.partido_id===pp.id)
    const goles=evsPartido.filter(e=>e.tipo==='Gol')
    const asistencias=evsPartido.filter(e=>e.tipo==='Asistencia')
    if(!goles.length)continue
    const ligaGolesPartido=await ligaGet('liga_goles',`?partido_id=eq.${lp.id}&equipo_id=eq.${tid}&select=id,minuto,minuto_extra,jugador_id,subtipo,asistidor_id`)
    if(!Array.isArray(ligaGolesPartido))continue
    const usados=new Set()
    for(const g of goles){
      const propio=jugPropioMap[g.jugador_id]
      if(!propio)continue
      const ligaJ=matchLiga(propio.nombre)
      if(!ligaJ)continue
      let golLiga=null,mejorDist=Infinity
      ligaGolesPartido.forEach(lg=>{
        if(lg.jugador_id!==ligaJ.id||usados.has(lg.id))return
        const dist=Math.abs((lg.minuto+(lg.minuto_extra||0))-g.minuto)
        if(dist<=TOLERANCIA_MIN&&dist<mejorDist){mejorDist=dist;golLiga=lg}
      })
      if(!golLiga)continue
      usados.add(golLiga.id)
      const body={}
      if(!golLiga.subtipo&&g.subtipo&&SUBTIPOS_GOL.includes(g.subtipo))body.subtipo=g.subtipo
      const asist=asistencias.find(a=>a.minuto===g.minuto)
      if(!golLiga.asistidor_id&&asist){
        const propioAsist=jugPropioMap[asist.jugador_id]
        const ligaAsist=propioAsist?matchLiga(propioAsist.nombre):null
        if(ligaAsist){
          body.asistidor_id=ligaAsist.id
          if(asist.subtipo&&SUBTIPOS_ASIST.includes(asist.subtipo))body.asist_subtipo=asist.subtipo
        }
      }
      if(Object.keys(body).length){
        const r=await patch('liga_goles',body,`?id=eq.${golLiga.id}`)
        if(!(r&&r.code)){
          if(body.subtipo)golesActualizados++
          if(body.asistidor_id)asistActualizados++
        }
      }
    }
  }
  toast(`Listo: ${golesActualizados} goles con detalle, ${asistActualizados} asistencias recuperadas del registro antiguo`)
  await cargarEnriquecimiento()
}

const SUBTIPOS_GOL=['Pie Derecho','Pie Izquierdo','Cabeza','Tiro Libre','Penal','Otro']

        {id:'sinAsist',l:'Falta asistidor',n:sinAsist},
        {id:'todos',l:'Todos',n:E.goles.length},

      // La lista visible se congela al entrar a la sección o cambiar de
      // filtro — no se recalcula en cada guardado. Así, después de elegir
      // "Cómo fue el gol" el ítem no desaparece de golpe y da tiempo a
      // completar también el asistidor antes de que se vaya de la vista.
      if(!E.golesSnapshot){
        E.golesSnapshot=(filtro==='sinTipo'?E.goles.filter(g=>!g.subtipo):filtro==='sinAsist'?E.goles.filter(g=>!g.asistidor_id):E.goles).map(g=>g.id)

      const grupos=[]
      visibles.forEach(g=>{
        const jornada=g.partido?.jornada??'?'

        if(!grp||grp.jornada!==jornada){

        }
        grp.goles.push(g)
      })
      return`

        ${!visibles.length?`<div class="empty">${filtro==='todos'?'Sin goles registrados todavía.':'Nada pendiente en este filtro ✓'}</div>`:grupos.map(grp=>`
          <div style="font-size:11px;font-weight:800;color:var(--gris);margin:14px 0 6px">F${grp.jornada} · vs ${grp.rival}</div>

                ${g.penal?'<span class="badge bg" style="font-size:8px">Penal</span>':''}
                ${g.subtipo?'<span class="badge bv" style="font-size:8px">✓ tipo</span>':'<span class="badge ba" style="font-size:8px">falta tipo</span>'}
                ${g.asistidor_id?'<span class="badge bv" style="font-size:8px">✓ asistidor</span>':'<span class="badge ba" style="font-size:8px">falta asistidor</span>'}
              </div>
              <div class="fr2">
                <div class="fg" style="margin-bottom:0"><label>Cómo fue el gol</label>
                  <select onchange="guardarGolDetalle(${g.id},'subtipo',this.value)">
                    <option value="">Sin definir</option>
                    ${SUBTIPOS_GOL.map(t=>`<option value="${t}" ${g.subtipo===t?'selected':''}>${t}</option>`).join('')}
                  </select>
                </div>
                <div class="fg" style="margin-bottom:0"><label>Quién dio el pase</label>
                  <select onchange="guardarGolDetalle(${g.id},'asistidor_id',this.value?+this.value:'')">
                    <option value="">Sin asistencia</option>
                    ${otros.map(j=>`<option value="${j.id}" ${g.asistidor_id===j.id?'selected':''}>${nombreCompacto(j.nombre,j.apellido)}</option>`).join('')}
                  </select>
                </div>
              </div>
              ${g.asistidor_id?`<div class="fg" style="margin-top:8px;margin-bottom:0"><label>Cómo fue la asistencia</label>
                <select onchange="guardarGolDetalle(${g.id},'asist_subtipo',this.value)">

                </select>
              </div>`:''}
            </div>`
          }).join('')}
        `).join('')}
      `
    },'S.enriq.golesSnapshot=null;')}
  </div>`
}

      </div>
    `:`<div class="empty" style="padding:50px">← Selecciona un partido para comenzar</div>`}

async function selPartido(id){
  S.partidoActivo=id;S.slotSeleccionado=null
  const[evs,part]=await Promise.all([
    get('eventos',`?partido_id=eq.${id}&order=minuto`),
    get('partidos',`?id=eq.${id}`)
  ])
  S.evPartido=Array.isArray(evs)?evs:[]
  if(Array.isArray(part)&&part[0]){
    const p=part[0]
    if(p.formacion)S.formacion=p.formacion
    if(p.titulares){try{S.titulares=JSON.parse(p.titulares)||[]}catch(e){S.titulares=[]}}
  }
  render()
}

async function guardarPartido(){
  if(!S.np.rival.trim()){toast('Ingresa el rival',true);return}
  const r=await post('partidos',S.np)
  if(Array.isArray(r)&&r[0]){
    toast('Partido guardado')
    S.np={rival:'',competencia:'Primera B',condicion:'Local',fecha:hoy(),goles_favor:0,goles_contra:0}
    S.npShow=false;await cargarDatos();await selPartido(r[0].id)
  }else toast('Error al guardar',true)
}

async function agregarEvento(){
  if(!S.partidoActivo){toast('Selecciona un partido',true);return}
  const ev=S.ev
  const r=await post('eventos',{
    partido_id:S.partidoActivo,jugador_id:+ev.jugador_id,tipo:ev.tipo,
    subtipo:['Gol','Asistencia'].includes(ev.tipo)?ev.subtipo:null,
    minuto:+ev.minuto,jugador_sale_id:ev.tipo==='Sustitución'?+ev.jugador_sale_id:null,
  })
  if(Array.isArray(r)&&r[0]){
    let msg='Evento registrado'
    // Si es gol con asistidor, registrar asistencia automáticamente
    if(ev.tipo==='Gol'&&ev.asistidor_id){
      await post('eventos',{
        partido_id:S.partidoActivo,jugador_id:+ev.asistidor_id,tipo:'Asistencia',
        subtipo:ev.asist_subtipo||'Pase',minuto:+ev.minuto,jugador_sale_id:null,
      })
      msg='Gol + Asistencia guardados ✓'
    }
    toast(msg)
    await cargarDatos()
    await selPartido(S.partidoActivo)
    await recalcPartidoAuto()
    await cargarDatos()
  }else toast('Error',true)
}

async function guardarEdicionEvento(){
  if(!S.editEv)return
  const e=S.editEv
  await patch('eventos',{
    minuto:+e.minuto,tipo:e.tipo,
    subtipo:['Gol','Asistencia'].includes(e.tipo)?e.subtipo:null,
    jugador_id:+e.jugador_id,
    jugador_sale_id:e.tipo==='Sustitución'?(+e.jugador_sale_id||null):null,
  },`?id=eq.${e.id}`)
  S.editEv=null
  await cargarDatos()
  await selPartido(S.partidoActivo)
  await recalcPartidoAuto()
  await cargarDatos()
  toast('Evento actualizado ✓')
}

    const wantLes=S.filtEstadoPlantilla==='lesionado'
    lista=lista.filter(j=>wantLes?S.lesiones.some(l=>l.jugador_id===j.id):!S.lesiones.some(l=>l.jugador_id===j.id))

  const dir=S.ordenDir||'asc'
  const dm=dir==='asc'?1:-1
  if(S.ordenPlantilla==='apellido'){
    lista.sort((a,b)=>{const aa=a.nombre.split(' ').slice(1).join(' ')||a.nombre;const bb=b.nombre.split(' ').slice(1).join(' ')||b.nombre;return aa.localeCompare(bb)*dm})
  }else if(S.ordenPlantilla==='posicion'){
    lista.sort((a,b)=>(a.posicion_especifica||a.posicion).localeCompare(b.posicion_especifica||b.posicion)*dm)

  }else if(S.ordenPlantilla==='altura'){

  }else if(S.ordenPlantilla==='contrato'){

  }else if(S.ordenPlantilla==='pie'){

// ===== PARTIDOS =====
// ===== ESTADÍSTICAS =====
// Todo lo de acá sale de los datos scrapeados de la liga (liga_*), no de
// las tablas propias (partidos/eventos/minutaje) — esas quedaban
// desactualizadas y con errores de carga manual. Lo que no tiene
// equivalente en los datos scrapeados (asistencias, "sinergia" gol+asist,
// rendimiento por arquero, rendimiento por formación — el informe de
// ANFP no trae esa info) se dejó fuera por ahora en vez de mostrar datos
// viejos o inventados.
// Reconstruye el marcador minuto a minuto de cada partido de Temuco (con
// los goles de AMBOS equipos, PL.golesAmbos) para contar remontadas,
// partidos en que le dieron vuelta, y cómo llegaba/salía del descanso —
// guardando además el partido y el momento exacto del vuelco, para poder
// hacer clic y ver cuáles fueron y qué pasaba en ese momento.
function calcularRachas(partidos,golesAmbos,tid){
  const cats={remontadas:[],vueltas:[],ganoAbajoDescanso:[],perdioArribaDescanso:[]}
  partidos.forEach(p=>{
    if(!p.resultado)return
    const golesPartido=golesAmbos.filter(g=>g.partido_id===p.id)
      .slice().sort((a,b)=>(a.minuto+(a.minuto_extra||0)*0.01)-(b.minuto+(b.minuto_extra||0)*0.01))
    if(!golesPartido.length)return
    let favor=0,contra=0
    let peorDeficit=0,peorDeficitFavor=0,peorDeficitContra=0,peorDeficitMin=null
    let mejorVentaja=0,mejorVentajaFavor=0,mejorVentajaContra=0,mejorVentajaMin=null
    let descansoFavor=0,descansoContra=0,pasoDescanso=false
    golesPartido.forEach(g=>{
      if(!pasoDescanso&&g.minuto>45){descansoFavor=favor;descansoContra=contra;pasoDescanso=true}
      if(g.equipo_id===tid)favor++;else contra++
      if(contra-favor>peorDeficit){peorDeficit=contra-favor;peorDeficitFavor=favor;peorDeficitContra=contra;peorDeficitMin=g.minuto}
      if(favor-contra>mejorVentaja){mejorVentaja=favor-contra;mejorVentajaFavor=favor;mejorVentajaContra=contra;mejorVentajaMin=g.minuto}
    })
    if(!pasoDescanso){descansoFavor=favor;descansoContra=contra}
    const ganoFinal=p.resultado==='G',perdioFinal=p.resultado==='P'
    if(peorDeficit>0&&ganoFinal)cats.remontadas.push({p,texto:`Iba perdiendo ${peorDeficitFavor}-${peorDeficitContra} (min ${peorDeficitMin}') → terminó ganando ${p.gf}-${p.gc}`})
    if(mejorVentaja>0&&(perdioFinal||p.resultado==='E'))cats.vueltas.push({p,texto:`Iba ganando ${mejorVentajaFavor}-${mejorVentajaContra} (min ${mejorVentajaMin}') → terminó ${p.resultado==='E'?'empatando':'perdiendo'} ${p.gf}-${p.gc}`})
    if(descansoFavor<descansoContra&&ganoFinal)cats.ganoAbajoDescanso.push({p,texto:`Al descanso iba ${descansoFavor}-${descansoContra} → terminó ganando ${p.gf}-${p.gc}`})
    if(descansoFavor>descansoContra&&!ganoFinal)cats.perdioArribaDescanso.push({p,texto:`Al descanso iba ${descansoFavor}-${descansoContra} → terminó ${p.resultado==='E'?'empatando':'perdiendo'} ${p.gf}-${p.gc}`})
  })
  return cats
}
// Una franja de "Goles por período" — cuenta, % dentro de su mitad, y
// hasta 5 goleadores de esa franja con los minutos exactos.
function franjaCard(label,evs,color,totalMitad,inicialesJ,nombreJ){
  const n=evs.length
  const pct=Math.round(n/Math.max(1,totalMitad)*100)
  const gMap={}
  evs.forEach(g=>{const jid=g.jugador?.id;if(!jid)return;if(!gMap[jid])gMap[jid]={jugador:g.jugador,mins:[]};gMap[jid].mins.push(g.minuto)})
  const gList=Object.values(gMap).sort((a,b)=>b.mins.length-a.mins.length).slice(0,5).map(g=>
    `<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid rgba(16,24,32,0.05)">
      <div style="width:26px;height:26px;border-radius:50%;background:rgba(16,24,32,0.08);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0">${inicialesJ(g.jugador)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nombreJ(g.jugador)}</div><div style="font-size:10px;color:${color};font-weight:600">⚽ ${g.mins.map(m=>m+"'").join(' ')}</div></div>
    </div>`
  ).join('')
  return`<div style="text-align:center;padding:8px;background:rgba(0,0,0,.2);border-radius:6px">
    <div style="font-size:22px;font-weight:800;color:${color}">${n}</div>
    <div style="font-size:9px;color:var(--gris)">${label}</div>
    <div class="bar-w" style="margin-top:6px"><div class="bar-f" style="width:${pct}%;background:${color}"></div></div>
    <div style="font-size:9px;color:var(--muted);margin-top:2px">${pct}%</div>
    ${gList?`<div style="margin-top:5px;text-align:left">${gList}</div>`:''}
  </div>`
}

function agregarTipoGol(){

}

function eliminarTipoGol(i){
  const tipo=SUBTIPOS_GOL[i]
  if(S.eventos.some(e=>e.subtipo===tipo&&e.tipo==='Gol')){toast('No se puede eliminar — hay goles del registro antiguo con este tipo',true);return}
  if(S.enriq.goles.some(g=>g.subtipo===tipo)){toast('No se puede eliminar — hay goles de la liga con este tipo',true);return}
  SUBTIPOS_GOL.splice(i,1);render();toast('Tipo eliminado')
}

async function guardarLesion(){
  const l=S.addLes
  if(!l.jugador_id){toast('Selecciona jugador',true);return}
  const r=await post('lesiones',{...l,jugador_id:+l.jugador_id,semanas_recuperacion:+l.semanas_recuperacion})
  if(Array.isArray(r)&&r[0]){toast('Lesión registrada');S.lesShow=false;await cargarDatos()}
  else toast('Error',true)
}

async function darAlta(id){
  const r=await patch('lesiones',{alta:true},`?id=eq.${id}`)
  // Supabase devuelve el registro actualizado o un objeto de error
  if(r&&r.code){toast('Error Supabase: '+r.message,true);console.error('darAlta error:',r);return}
  if(!Array.isArray(r)||!r.length){
    // Fallback: intentar con POST upsert por si hay problema de RLS en PATCH
    console.warn('darAlta: PATCH no retornó filas, re-intentando fetch directo...',r)
    toast('Actualizando...', false)
  }
  await cargarDatos()
  const sigueActiva=S.lesiones.find(l=>l.id===id)
  if(sigueActiva){
    toast('⚠️ No se pudo dar el alta — revisa permisos UPDATE en tabla lesiones (Supabase)',true)
  } else {
    toast('Jugador dado de alta ✅')
  }
}

// ===== JUGADORES CLAVE (antes "Consultas") =====
// Reemplaza al viejo sistema de filtros de eventos propios (Gol/Asistencia/
// tipo/subtipo, etc): esa taxonomía rica solo existía en las tablas propias
// del club y no tiene equivalente en los datos scrapeados de la liga (ANFP
// no registra asistencias ni subtipo de gol). Esto es lo que realmente hace
// falta para scouting: quién mete goles y quién se indisciplina, de
// cualquier equipo de la liga, con la posición para poder filtrar.
async function cargarJugadoresClave(equipoId){
  S.jugClave={equipoId,loaded:false,jugadores:[],filtroPos:'todos'}
  render()
  let[goles,tarjetas,alineaciones,jugadores]=await Promise.all([
    ligaGet('liga_goles',`?equipo_id=eq.${equipoId}&autogol=eq.false&select=jugador_id,asistidor_id`),
    ligaGet('liga_tarjetas',`?equipo_id=eq.${equipoId}&select=jugador_id,tipo`),
    ligaGet('liga_alineaciones',`?equipo_id=eq.${equipoId}&select=jugador_id,minutos_jugados`),
    ligaGet('liga_jugadores',`?equipo_id=eq.${equipoId}&select=id,nombre,apellido,posicion,foto_url`),
  ])
  // posicion/foto_url/asistidor_id son columnas nuevas (ver scraper/sql/):
  // si todavía no se corrieron en Supabase, PostgREST devuelve un error en
  // vez de un array — reintentamos sin pedirlas en vez de mostrar la
  // página vacía.
  if(!Array.isArray(jugadores)){
    jugadores=await ligaGet('liga_jugadores',`?equipo_id=eq.${equipoId}&select=id,nombre,apellido`)
  }
  if(!Array.isArray(goles)){
    goles=await ligaGet('liga_goles',`?equipo_id=eq.${equipoId}&autogol=eq.false&select=jugador_id`)
  }
  const golMap={},asistMap={}
  ;(Array.isArray(goles)?goles:[]).forEach(g=>{
    golMap[g.jugador_id]=(golMap[g.jugador_id]||0)+1
    if(g.asistidor_id)asistMap[g.asistidor_id]=(asistMap[g.asistidor_id]||0)+1
  })
  const amMap={},roMap={}
  ;(Array.isArray(tarjetas)?tarjetas:[]).forEach(t=>{
    if(t.tipo==='amarilla')amMap[t.jugador_id]=(amMap[t.jugador_id]||0)+1
    else roMap[t.jugador_id]=(roMap[t.jugador_id]||0)+1
  })
  const minMap={};(Array.isArray(alineaciones)?alineaciones:[]).forEach(a=>{minMap[a.jugador_id]=(minMap[a.jugador_id]||0)+(a.minutos_jugados||0)})
  // La posición de los jugadores propios (Plantilla/Admin) manda si el
  // jugador está vinculado vía liga_jugador_id — hoy eso solo aplica a
  // Temuco. Para el resto de los equipos, se puede setear a mano acá.
  const posPropia={}
  S.jugadores.forEach(j=>{if(j.liga_jugador_id)posPropia[j.liga_jugador_id]=j.posicion})
  const lista=(Array.isArray(jugadores)?jugadores:[]).map(j=>({
    ...j,
    goles:golMap[j.id]||0,
    asistencias:asistMap[j.id]||0,
    amarillas:amMap[j.id]||0,
    rojas:roMap[j.id]||0,
    minutos:minMap[j.id]||0,
    posicion:posPropia[j.id]||j.posicion||null,
  })).filter(j=>j.goles>0||j.asistencias>0||j.amarillas>0||j.rojas>0||j.minutos>0)
    .sort((a,b)=>b.goles-a.goles||b.minutos-a.minutos)
  S.jugClave.jugadores=lista
  S.jugClave.loaded=true
  render()
}

async function guardarPosicionLiga(id,val){
  const r=await patch('liga_jugadores',{posicion:val||null},`?id=eq.${id}`)
  if(r&&r.code){toast('Error al guardar — ¿corriste sql/liga_jugadores_posicion.sql?',true);return}
  const j=S.jugClave.jugadores.find(x=>x.id===id)
  if(j)j.posicion=val||null
  render()
  toast('Posición actualizada')
}

// ---- Matcher por similitud de nombre (mismo criterio que el scraper en
// nameMatch.mjs) para cruzar jugadores propios (tabla "jugadores") contra
// liga_jugadores sin depender de liga_jugador_id — útil para sincronizar
// datos manuales (foto, asistencias del registro viejo) con lo scrapeado. ----
function normalizarNombreCmp(s){
  return(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()
}
function levenshteinCmp(a,b){
  if(a===b)return 0
  const m=a.length,n=b.length
  if(!m)return n
  if(!n)return m
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)])
  for(let j=0;j<=n;j++)dp[0][j]=j
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1])
  return dp[m][n]
}
function tokensParecidosCmp(a,b){
  if(a===b)return true
  if(Math.min(a.length,b.length)<4)return false
  return levenshteinCmp(a,b)<=1
}
function scoreNombreCmp(nombreCorto,candidatoCompleto){
  const docTokens=normalizarNombreCmp(nombreCorto).split(' ').filter(Boolean)
  const candTokens=normalizarNombreCmp(candidatoCompleto).split(' ').filter(Boolean)
  if(!docTokens.length||!candTokens.length)return 0
  let matches=0
  docTokens.forEach(dt=>{if(candTokens.some(ct=>tokensParecidosCmp(dt,ct)))matches++})
  return matches/docTokens.length
}
// Busca en S.jugadores (plantel propio) el que mejor calza con un nombre
// completo de liga_jugadores. Umbral alto: preferimos no matchear antes
// que matchear mal.
function matchJugadorPropio(nombreLiga,apellidoLiga){
  let mejor=null,mejorScore=0
  S.jugadores.forEach(j=>{
    const s=scoreNombreCmp(j.nombre,`${nombreLiga} ${apellidoLiga}`)
    if(s>mejorScore){mejorScore=s;mejor=j}
  })
  return mejorScore>=0.9?mejor:null
}

async function cargarLiga(){
  let[equipos,goles,jugadores,partidosAll,sanciones,alineacionesAll,estadios]=await Promise.all([
    ligaGet('liga_equipos','?select=id,nombre,sub21_minutos_contable&order=nombre'),
    ligaGet('liga_goles','?select=jugador_id,autogol&autogol=eq.false&limit=1000'),
    ligaGet('liga_jugadores','?select=id,apellido,nombre,equipo_id,sub21,minutos_oficial_temporada,fecha_nacimiento,numero&limit=1000'),
    ligaGetAll('liga_partidos','id,jornada,fecha_hora,estadio,equipo_local_id,equipo_visita_id,goles_local,goles_visita'),
    ligaGet('liga_sanciones','?select=id,equipo_id,puntos,motivo,fecha&order=fecha.desc'),
    ligaGetAll('liga_alineaciones','partido_id,equipo_id,jugador_id'),
    ligaGet('liga_estadios','?select=nombre,foto_url'),
  ])
  // liga_estadios es una tabla nueva (scraper/sql/liga_estadios.sql) — si
  // todavía no se corrió esa migración, queda como mapa vacío sin romper nada.
  S.liga.estadiosFoto={}
  if(Array.isArray(estadios))estadios.forEach(e=>{S.liga.estadiosFoto[e.nombre]=e.foto_url})
  // sub21_minutos_contable es una columna nueva (scraper/sql/liga_equipos_sub21_contable.sql)
  if(!Array.isArray(equipos))equipos=await ligaGet('liga_equipos','?select=id,nombre&order=nombre')
  // numero es una columna nueva (scraper/sql/liga_jugadores_numero.sql) — si
  // la migración no se corrió todavía, se reintenta sin ella.
  if(!Array.isArray(jugadores))jugadores=await ligaGet('liga_jugadores','?select=id,apellido,nombre,equipo_id,sub21,minutos_oficial_temporada,fecha_nacimiento&limit=1000')
  S.liga.equipos=Array.isArray(equipos)?equipos:[]
  const temuco=S.liga.equipos.find(e=>e.nombre==='Deportes Temuco')
  S.liga.temucoId=temuco?temuco.id:null
  S.liga.sanciones=Array.isArray(sanciones)?sanciones:[]
  S.liga.estadiosLista=[...new Set((Array.isArray(partidosAll)?partidosAll:[]).map(p=>p.estadio).filter(Boolean))].sort()

  const jugadas=(Array.isArray(partidosAll)?partidosAll:[]).filter(p=>p.goles_local!=null&&p.goles_visita!=null)
  // Partidos pospuestos sin fecha reagendada quedan con fecha_hora null y
  // pueden tener una jornada más baja que la actual — no cuentan como
  // "próximo partido" hasta que el fixture les asigne una fecha real.
  const programadasConFecha=(Array.isArray(partidosAll)?partidosAll:[])
    .filter(p=>p.goles_local==null&&p.fecha_hora)
    .sort((a,b)=>new Date(a.fecha_hora)-new Date(b.fecha_hora))
  const golesLiga=jugadas.reduce((a,p)=>a+p.goles_local+p.goles_visita,0)
  S.liga.infoGeneral={
    equipos:S.liga.equipos.length,
    partidosJugados:jugadas.length,
    jornadaActual:jugadas.length?Math.max(...jugadas.map(p=>p.jornada||0)):0,
    jornadaProxima:programadasConFecha.length?programadasConFecha[0].jornada:null,
    golesTotales:golesLiga,
    promedioGoles:jugadas.length?+(golesLiga/jugadas.length).toFixed(2):0,
  }

  const st={}
  S.liga.equipos.forEach(e=>{st[e.id]={id:e.id,nombre:e.nombre,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0,descuento:0}})
  jugadas.forEach(p=>{
    const l=st[p.equipo_local_id],v=st[p.equipo_visita_id]
    if(!l||!v)return
    l.pj++;v.pj++
    l.gf+=p.goles_local;l.gc+=p.goles_visita
    v.gf+=p.goles_visita;v.gc+=p.goles_local
    if(p.goles_local>p.goles_visita){l.pg++;l.pts+=3;v.pp++}
    else if(p.goles_local<p.goles_visita){v.pg++;v.pts+=3;l.pp++}
    else{l.pe++;v.pe++;l.pts++;v.pts++}
  })
  S.liga.sanciones.forEach(s=>{
    const e=st[s.equipo_id];if(!e)return
    e.descuento+=s.puntos;e.pts-=s.puntos
  })
  S.liga.tabla=Object.values(st).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc))

  const jugArr=Array.isArray(jugadores)?jugadores:[]
  const jugMap={};jugArr.forEach(j=>{jugMap[j.id]=j})
  const conteo={}
  ;(Array.isArray(goles)?goles:[]).forEach(g=>{conteo[g.jugador_id]=(conteo[g.jugador_id]||0)+1})
  S.liga.goleadores=Object.entries(conteo).map(([jid,n])=>{
    const j=jugMap[jid];const eq=j?S.liga.equipos.find(e=>e.id===j.equipo_id):null
    return{goles:n,nombre:j?nombreCompacto(j.nombre,j.apellido):'?',equipo:eq?eq.nombre:'?',crest:eq?crestUrl(eq.nombre):'',numero:j?j.numero:null}
  }).sort((a,b)=>b.goles-a.goles).slice(0,12)

  S.liga.sub21=jugArr.filter(j=>j.equipo_id===S.liga.temucoId&&j.sub21)
    .sort((a,b)=>(b.minutos_oficial_temporada||0)-(a.minutos_oficial_temporada||0))

  // Debuts recientes: primera vez que cada jugador aparece en una alineación
  // de SU equipo actual, filtrado al segundo semestre (jul en adelante). No
  // podemos distinguir fichaje real de juvenil recién promovido o jugador
  // que ya estaba pero recién sumó minutos — el dato de partidos no alcanza
  // para eso, por eso se etiqueta como "primera aparición", no "fichaje".
  {
    const partidoMap={};(Array.isArray(partidosAll)?partidosAll:[]).forEach(p=>{partidoMap[p.id]=p})
    const primera={}
    ;(Array.isArray(alineacionesAll)?alineacionesAll:[]).forEach(a=>{
      const p=partidoMap[a.partido_id]
      if(!p||!p.fecha_hora)return
      const key=`${a.equipo_id}_${a.jugador_id}`
      if(!primera[key]||p.fecha_hora<primera[key].fecha_hora){
        primera[key]={equipo_id:a.equipo_id,jugador_id:a.jugador_id,fecha_hora:p.fecha_hora,jornada:p.jornada}
      }
    })
    const CUTOFF='2026-07-01'
    const debuts=Object.values(primera).filter(d=>d.fecha_hora>=CUTOFF)
    const porEquipo={}
    debuts.forEach(d=>{
      const eq=S.liga.equipos.find(e=>e.id===d.equipo_id)
      const j=jugMap[d.jugador_id]
      if(!eq||!j)return
      if(!porEquipo[eq.id])porEquipo[eq.id]={equipoId:eq.id,equipo:eq.nombre,jugadores:[]}
      porEquipo[eq.id].jugadores.push({nombre:nombreCompacto(j.nombre,j.apellido),jornada:d.jornada,fecha_hora:d.fecha_hora})
    })
    Object.values(porEquipo).forEach(g=>g.jugadores.sort((a,b)=>b.fecha_hora.localeCompare(a.fecha_hora)))
    S.liga.debutsPorEquipo=Object.values(porEquipo).sort((a,b)=>
      a.equipoId===S.liga.temucoId?-1:b.equipoId===S.liga.temucoId?1:b.jugadores.length-a.jugadores.length)
  }

  if(S.liga.temucoId){
    const partidos=await ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${S.liga.temucoId},equipo_visita_id.eq.${S.liga.temucoId})&goles_local=not.is.null&select=id,jornada,fecha_hora,estadio,equipo_local_id,local:liga_equipos!liga_partidos_equipo_local_id_fkey(nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(nombre),goles_local,goles_visita&order=fecha_hora.desc&limit=1`)
    S.liga.ultimo=Array.isArray(partidos)&&partidos[0]?partidos[0]:null
  }
  S.liga.loaded=true
  if(S.pag==='inicio'||S.pag==='liga')render()
}

// Vista de un partido de liga_partidos desde la perspectiva de Temuco
// (gf/gc/rival/condición propios, en vez de local/visita genérico).
function partidoTemucoVista(p,tid){
  const esLocal=p.equipo_local_id===tid
  const gf=esLocal?p.goles_local:p.goles_visita
  const gc=esLocal?p.goles_visita:p.goles_local
  const rival=esLocal?p.visita.nombre:p.local.nombre
  const condicion=esLocal?'Local':'Visita'
  const resultado=gf==null?null:gf>gc?'G':gf===gc?'E':'P'
  return{...p,esLocal,gf,gc,rival,condicion,resultado}
}

// Carga los partidos/goles/tarjetas/cambios/minutaje de Temuco desde los
// datos scrapeados de la liga (liga_*) — reemplaza a las tablas propias
// (partidos/eventos/minutaje) como fuente para las pestañas públicas
// "Partidos" y "Estadísticas": esas se cargaban a mano y quedaban
// desactualizadas o con errores de tipeo (ver caso Curicó Unido), mientras
// que liga_* se actualiza solo con cada corrida del scraper.
async function cargarPartidosLiga(){
  if(!S.liga.loaded)await cargarLiga()
  const tid=S.liga.temucoId
  if(!tid){S.partidosLiga.loaded=true;render();return}
  let[partidos,goles,tarjetas,sustituciones,alineaciones]=await Promise.all([
    ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${tid},equipo_visita_id.eq.${tid})&select=id,jornada,fecha_hora,estadio,equipo_local_id,equipo_visita_id,goles_local,goles_visita,local:liga_equipos!liga_partidos_equipo_local_id_fkey(nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(nombre)&order=fecha_hora.asc`),
    ligaGet('liga_goles',`?equipo_id=eq.${tid}&select=partido_id,minuto,minuto_extra,penal,autogol,subtipo,asistidor_id,asist_subtipo,jugador:liga_jugadores!liga_goles_jugador_id_fkey(id,nombre,apellido,foto_url),asistidor:liga_jugadores!liga_goles_asistidor_id_fkey(id,nombre,apellido)`),
    ligaGet('liga_tarjetas',`?equipo_id=eq.${tid}&select=partido_id,tipo,minuto,jugador:liga_jugadores!liga_tarjetas_jugador_id_fkey(id,nombre,apellido)`),
    ligaGet('liga_sustituciones',`?equipo_id=eq.${tid}&select=partido_id,entra:liga_jugadores!liga_sustituciones_entra_jugador_id_fkey(id,nombre,apellido,posicion),sale:liga_jugadores!liga_sustituciones_sale_jugador_id_fkey(id,nombre,apellido,posicion)`),
    ligaGet('liga_alineaciones',`?equipo_id=eq.${tid}&select=partido_id,minutos_jugados,portero,titular,jugador:liga_jugadores!liga_alineaciones_jugador_id_fkey(id,nombre,apellido,sub21)`),
  ])
  // subtipo/asistidor_id/asist_subtipo/posicion son columnas nuevas — si el
  // SQL correspondiente todavía no se corrió en Supabase, la query con esos
  // campos falla entera (PostgREST no tiene la columna). Reintentamos sin
  // pedirlas en vez de dejar Partidos/Estadísticas sin datos.
  if(!Array.isArray(goles)){
    goles=await ligaGet('liga_goles',`?equipo_id=eq.${tid}&select=partido_id,minuto,minuto_extra,penal,autogol,jugador:liga_jugadores!liga_goles_jugador_id_fkey(id,nombre,apellido)`)
  }
  if(!Array.isArray(sustituciones)){
    sustituciones=await ligaGet('liga_sustituciones',`?equipo_id=eq.${tid}&select=partido_id,entra:liga_jugadores!liga_sustituciones_entra_jugador_id_fkey(id,nombre,apellido),sale:liga_jugadores!liga_sustituciones_sale_jugador_id_fkey(id,nombre,apellido)`)
  }
  S.partidosLiga.partidos=Array.isArray(partidos)?partidos.map(p=>partidoTemucoVista(p,tid)):[]
  S.partidosLiga.goles=Array.isArray(goles)?goles:[]
  S.partidosLiga.tarjetas=Array.isArray(tarjetas)?tarjetas:[]
  S.partidosLiga.sustituciones=Array.isArray(sustituciones)?sustituciones:[]
  S.partidosLiga.alineaciones=Array.isArray(alineaciones)?alineaciones:[]
  S.partidosLiga.loaded=true
  if(S.pag==='plantilla'||S.pag==='inicio')render()
  // Goles de AMBOS equipos (no solo Temuco) para los partidos de Temuco —
  // hace falta para reconstruir el marcador minuto a minuto (rachas y
  // curiosidades en Estadísticas). S.partidosLiga.goles de arriba viene
  // filtrado equipo_id=tid, no alcanza para saber cómo iba el rival.
  const idsPartidos=S.partidosLiga.partidos.map(p=>p.id)
  if(idsPartidos.length){
    const golesAmbos=await ligaGet('liga_goles',`?partido_id=in.(${idsPartidos.join(',')})&select=partido_id,equipo_id,minuto,minuto_extra,autogol,jugador:liga_jugadores!liga_goles_jugador_id_fkey(id,nombre,apellido)`)
    S.partidosLiga.golesAmbos=Array.isArray(golesAmbos)?golesAmbos:[]
    // Autogoles que metieron JUGADORES DE TEMUCO (no los que benefician a
    // Temuco por autogol rival) — equipo_id ya viene corregido al equipo
    // que se beneficia, así que "no es tid" = lo metió un jugador propio.
    S.partidosLiga.autogolesPropios=S.partidosLiga.golesAmbos.filter(g=>g.autogol&&g.equipo_id!==tid)
    if(S.pag==='plantilla')render()
  }
}

// Color/etiqueta de resultado (G/E/P) — compartido entre el gráfico de
// evolución (color de cada punto) y la "forma reciente" de Próximo Rival.

// ---- Evolución de puntos de 2+ equipos superpuesta, eje X = jornada ----
function svgRachaMultiple(series){
  // series: [{nombre,color,serie:[{jornada,acumulado}]}]
  const todas=series.flatMap(s=>s.serie)
  if(!todas.length)return`<div class="empty">Sin partidos jugados todavía.</div>`
  const pad={l:30,r:14,t:14,b:34},w=680,h=170
  const plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b
  const maxY=Math.max(1,...todas.map(p=>p.acumulado))
  const minJ=Math.min(...todas.map(p=>p.jornada||1)),maxJ=Math.max(...todas.map(p=>p.jornada||1))
  const spanJ=Math.max(1,maxJ-minJ)
  const x=j=>pad.l+((j-minJ)/spanJ)*plotW
  const y=v=>pad.t+plotH-(v/maxY)*plotH
  let svg=`<svg class="chart-svg" width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`
  for(let i=0;i<=3;i++){
    const gy=pad.t+plotH-plotH*i/3
    svg+=`<line x1="${pad.l}" y1="${gy}" x2="${pad.l+plotW}" y2="${gy}" class="chart-grid"/>`
    svg+=`<text x="${pad.l-6}" y="${gy+3}" text-anchor="end" class="chart-axis">${Math.round(maxY*i/3)}</text>`
  }
  const step=Math.max(1,Math.ceil(spanJ/9))
  for(let j=minJ;j<=maxJ;j++){
    if((j-minJ)%step!==0&&j!==maxJ)continue
    svg+=`<text x="${x(j)}" y="${h-6}" text-anchor="middle" class="chart-axis">F${j}</text>`
  }
  // El punto se colorea por el resultado de ESE partido (ganó/empató/perdió),
  // no por el color del equipo — así se lee de un vistazo la racha, mientras
  // la línea (color del equipo) sigue marcando de quién es cada serie.
  series.forEach(s=>{
    if(!s.serie.length)return
    const path=s.serie.map((p,i)=>`${i===0?'M':'L'}${x(p.jornada).toFixed(1)},${y(p.acumulado).toFixed(1)}`).join(' ')
    svg+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`
    s.serie.forEach(p=>{
      const dot=COLOR_RESULTADO[p.resultado]||s.color
      svg+=`<circle cx="${x(p.jornada)}" cy="${y(p.acumulado)}" r="3.5" fill="${dot}" stroke="#fff" stroke-width="1.5"><title>${s.nombre} · F${p.jornada}: ${p.acumulado} pts acumulados${p.resultado?` (${LABEL_RESULTADO[p.resultado]})`:''}</title></circle>`
    })
  })
  svg+=`</svg>`
  return svg
}

function renderFechasPasadasVista(){
  const PL=S.partidosLiga

  const pp=jugados.filter(p=>p.resultado==='P').length

  const gc=jugados.reduce((a,p)=>a+p.gc,0)
  const pz=jugados.filter(p=>p.gc===0).length
  const racha=jugados.slice(-5).map(p=>p.resultado)
  const cards=[...jugados].reverse().map(p=>{
    const bc=p.resultado==='G'?'var(--vc)':p.resultado==='E'?'var(--am)':'var(--ro)'

        <div style="font-size:15px;font-weight:900;color:${bc};white-space:nowrap;flex-shrink:0">${p.gf}—${p.gc}</div>
        <span class="badge ${p.condicion==='Local'?'baz':'bg'}" style="font-size:8px;flex-shrink:0">${p.condicion==='Local'?'L':'V'}</span>
        <span style="font-size:9px;color:var(--gris);white-space:nowrap;flex-shrink:0">F${p.jornada||'?'}</span>
      </div>
    </div>`
  }).join('')
  return`

      <div class="mc verde"><div class="mc-l">Puntos</div><div class="mc-v">${pg*3+pe}</div></div>
      <div class="mc"><div class="mc-l">G / E / P</div><div class="mc-v">${pg}-${pe}-${pp}</div></div>
      <div class="mc"><div class="mc-l">Goles F/C</div><div class="mc-v">${gf}/${gc}</div></div>
      <div class="mc verde"><div class="mc-l">Porterías 0</div><div class="mc-v">${pz}</div></div>
    </div>

// mandar a alguien que estaba viendo Fechas pasadas de vuelta a Próxima
// fecha por accidente.
function volverDePartido(){
  const[pag,sub]=(S.partidoLiga.volverA||'inicio').split(':')
  if(sub==='pasadas')S.inicioVista='pasadas'
  if(sub==='explorar')S.ligaVista='explorar'

// Stats simples (PJ/goles por partido/puntos por partido) de un equipo
// usando solo partidos ANTERIORES a una jornada dada — para el panel
// "cómo llegaban las estadísticas" en el detalle de un partido pasado.
function statsPrevioEquipo(partidos,equipoId){
  let pj=0,gf=0,gc=0,pts=0
  partidos.forEach(p=>{
    const esLocal=p.equipo_local_id===equipoId
    const f=esLocal?p.goles_local:p.goles_visita,c=esLocal?p.goles_visita:p.goles_local
    pj++;gf+=f;gc+=c;pts+=f>c?3:f===c?1:0
  })
  return{pj,gfPP:pj?+(gf/pj).toFixed(2):0,gcPP:pj?+(gc/pj).toFixed(2):0,ptsPP:pj?+(pts/pj).toFixed(2):0}
}
async function cargarPrevioPartido(id,jornada,equipoLocalId,equipoVisitaId){
  const[localPartidos,visitaPartidos]=await Promise.all([
    ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${equipoLocalId},equipo_visita_id.eq.${equipoLocalId})&goles_local=not.is.null&jornada=lt.${jornada}&select=equipo_local_id,equipo_visita_id,goles_local,goles_visita`),
    ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${equipoVisitaId},equipo_visita_id.eq.${equipoVisitaId})&goles_local=not.is.null&jornada=lt.${jornada}&select=equipo_local_id,equipo_visita_id,goles_local,goles_visita`),
  ])
  if(S.partidoLiga.id!==id)return // navegó a otro partido mientras cargaba
  if(!Array.isArray(localPartidos)||!Array.isArray(visitaPartidos)||!localPartidos.length||!visitaPartidos.length)return
  S.partidoLiga.previo={
    local:statsPrevioEquipo(localPartidos,equipoLocalId),
    visita:statsPrevioEquipo(visitaPartidos,equipoVisitaId),
  }
  render()
}
async function verPartidoLiga(id,volverA){
  if(!id)return
  S.partidoLiga={loaded:false,id,volverA:volverA||S.pag,data:null,eventos:[],previo:null}
  S.pag='partido'
  render()
  let[partidos,goles,tarjetas,sustituciones]=await Promise.all([
    ligaGet('liga_partidos',`?id=eq.${id}&select=id,jornada,fecha_hora,estadio,arbitro,resumen_youtube_url,equipo_local_id,equipo_visita_id,goles_local,goles_visita,local:liga_equipos!liga_partidos_equipo_local_id_fkey(id,nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(id,nombre)`),
    ligaGet('liga_goles',`?partido_id=eq.${id}&select=equipo_id,minuto,minuto_extra,penal,autogol,jugador:liga_jugadores!liga_goles_jugador_id_fkey(nombre,apellido)`),
    ligaGet('liga_tarjetas',`?partido_id=eq.${id}&select=equipo_id,tipo,minuto,minuto_extra,motivo,segunda_amarilla,jugador:liga_jugadores!liga_tarjetas_jugador_id_fkey(nombre,apellido)`),
    ligaGet('liga_sustituciones',`?partido_id=eq.${id}&select=equipo_id,minuto,minuto_extra,entra:liga_jugadores!liga_sustituciones_entra_jugador_id_fkey(nombre,apellido),sale:liga_jugadores!liga_sustituciones_sale_jugador_id_fkey(nombre,apellido)`),
  ])
  // resumen_youtube_url es una columna nueva (scraper/sql/liga_partidos_resumen_youtube.sql)
  if(!Array.isArray(partidos))partidos=await ligaGet('liga_partidos',`?id=eq.${id}&select=id,jornada,fecha_hora,estadio,arbitro,equipo_local_id,equipo_visita_id,goles_local,goles_visita,local:liga_equipos!liga_partidos_equipo_local_id_fkey(id,nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(id,nombre)`)
  if(S.partidoLiga.id!==id)return // el usuario ya navegó a otro partido
  S.partidoLiga.data=Array.isArray(partidos)&&partidos[0]?partidos[0]:null
  const evGoles=(Array.isArray(goles)?goles:[]).map(g=>({tipo:g.autogol?'autogol':'gol',minuto:g.minuto,minuto_extra:g.minuto_extra||0,equipo_id:g.equipo_id,jugador:g.jugador?nombreCompacto(g.jugador.nombre,g.jugador.apellido):'—',penal:g.penal}))
  const evTarjetas=(Array.isArray(tarjetas)?tarjetas:[]).map(t=>({tipo:t.tipo==='roja'?'roja':(t.segunda_amarilla?'segunda':'amarilla'),minuto:t.minuto,minuto_extra:t.minuto_extra||0,equipo_id:t.equipo_id,jugador:t.jugador?nombreCompacto(t.jugador.nombre,t.jugador.apellido):'—',motivo:t.motivo}))
  const evSubs=(Array.isArray(sustituciones)?sustituciones:[]).map(s=>({tipo:'cambio',minuto:s.minuto,minuto_extra:s.minuto_extra||0,equipo_id:s.equipo_id,entra:s.entra?nombreCompacto(s.entra.nombre,s.entra.apellido):'—',sale:s.sale?nombreCompacto(s.sale.nombre,s.sale.apellido):'—'}))
  S.partidoLiga.eventos=[...evGoles,...evTarjetas,...evSubs].sort((a,b)=>(a.minuto+a.minuto_extra*0.01)-(b.minuto+b.minuto_extra*0.01))
  S.partidoLiga.loaded=true
  if(S.pag==='partido')render()
  const d=S.partidoLiga.data
  if(d&&d.goles_local!=null&&d.jornada>1)cargarPrevioPartido(id,d.jornada,d.equipo_local_id,d.equipo_visita_id)
}
async function guardarResumenYoutube(id,url){
  const r=await patch('liga_partidos',{resumen_youtube_url:url||null},`?id=eq.${id}`)

  if(S.partidoLiga.data&&S.partidoLiga.data.id===id)S.partidoLiga.data.resumen_youtube_url=url||null
  render()
  toast('Link guardado')
}
// Acepta watch?v=, youtu.be/, /embed/ y le agrega el trailing slash que
// falte para armar el src del iframe.
function youtubeEmbedUrl(url){
  if(!url)return null
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/)
  return m?`https://www.youtube.com/embed/${m[1]}`:null
}

// ===== RIVALES (calendario + notas de scouting) =====
// Calcula un bloque de stats (gfPP/gcPP/amPP/rjPP/pctDescuento/ptsPP) para
// un subconjunto de partidos ya jugados — se usa tanto para "temporada
// completa" como para "últimos 5", pasando distintos sets de partido_id.
function statsBloque(partidosSet,equipoId,goles,tarjetas){
  const ids=new Set(partidosSet.map(p=>p.id))
  const s={pj:0,gf:0,gc:0,am:0,rj:0,pts:0,golesDescuento:0}
  partidosSet.forEach(p=>{
    const esLocal=p.equipo_local_id===equipoId
    s.pj++
    s.gf+=esLocal?p.goles_local:p.goles_visita
    s.gc+=esLocal?p.goles_visita:p.goles_local
    const gf=esLocal?p.goles_local:p.goles_visita,gc=esLocal?p.goles_visita:p.goles_local
    s.pts+=gf>gc?3:gf===gc?1:0
  })
  const golesSet=goles.filter(g=>ids.has(g.partido_id))
  golesSet.forEach(g=>{if(g.minuto_extra>0&&(g.minuto===45||g.minuto===90))s.golesDescuento++})
  tarjetas.filter(t=>ids.has(t.partido_id)).forEach(t=>{if(t.tipo==='amarilla')s.am++;else if(t.tipo==='roja')s.rj++})
  return{
    pj:s.pj,
    gfPP:s.pj?+(s.gf/s.pj).toFixed(2):0,
    gcPP:s.pj?+(s.gc/s.pj).toFixed(2):0,
    amPP:s.pj?+(s.am/s.pj).toFixed(2):0,
    rjPP:s.pj?+(s.rj/s.pj).toFixed(2):0,
    ptsPP:s.pj?+(s.pts/s.pj).toFixed(2):0,
    pctDescuento:golesSet.length?+((s.golesDescuento/golesSet.length)*100).toFixed(1):0,
  }
}

    ligaGet('liga_goles',`?equipo_id=eq.${equipoId}&autogol=eq.false&select=partido_id,minuto,minuto_extra`),

  const partidosArr=Array.isArray(partidos)?partidos:[]
  const golesArr=Array.isArray(goles)?goles:[]
  const tarjetasArr=Array.isArray(tarjetas)?tarjetas:[]

  partidosArr.forEach(p=>{
    const esLocal=p.equipo_local_id===equipoId
    s.pj++
    if(esLocal){s.pjLocal++;s.ptsLocal+=p.goles_local>p.goles_visita?3:p.goles_local===p.goles_visita?1:0}
    else{s.pjVisita++;s.ptsVisita+=p.goles_visita>p.goles_local?3:p.goles_local===p.goles_visita?1:0}
  })
  // Total oficial ANFP (tope por jornada, ver liga_equipos_sub21_contable.sql).
  const eq=S.liga.equipos.find(e=>e.id===equipoId)
  const sub21Min=eq?.sub21_minutos_contable??0
  const global=statsBloque(partidosArr,equipoId,golesArr,tarjetasArr)
  const u5=statsBloque(partidosArr.slice(-5),equipoId,golesArr,tarjetasArr)
  // Goles a favor/en contra por partido separados por condición — antes
  // solo se separaban los puntos (pppLocal/pppVisita).
  const statsLocal=statsBloque(partidosArr.filter(p=>p.equipo_local_id===equipoId),equipoId,golesArr,tarjetasArr)
  const statsVisita=statsBloque(partidosArr.filter(p=>p.equipo_visita_id===equipoId),equipoId,golesArr,tarjetasArr)
  // Serie de puntos acumulados partido a partido, para el gráfico de
  // evolución comparada con el rival.
  let acc=0
  const serie=partidosArr.map(p=>{
    const esLocal=p.equipo_local_id===equipoId
    const gf=esLocal?p.goles_local:p.goles_visita,gc=esLocal?p.goles_visita:p.goles_local
    const resultado=gf>gc?'G':gf===gc?'E':'P'
    acc+=resultado==='G'?3:resultado==='E'?1:0
    return{jornada:p.jornada,acumulado:acc,resultado}
  })
  return{
    ...global,
    pppLocal:s.pjLocal?+(s.ptsLocal/s.pjLocal).toFixed(2):0,
    pppVisita:s.pjVisita?+(s.ptsVisita/s.pjVisita).toFixed(2):0,
    gfPPLocal:statsLocal.gfPP,gcPPLocal:statsLocal.gcPP,
    gfPPVisita:statsVisita.gfPP,gcPPVisita:statsVisita.gcPP,
    sub21Min,
    u5,
    serie,
  }
}

async function cargarRivales(){
  if(!S.liga.loaded)await cargarLiga()
  const[notas,proximo]=await Promise.all([
    ligaGet('liga_notas_rivales','?select=id,equipo_id,texto,autor,created_at&order=created_at.desc&limit=500'),
    S.liga.temucoId?ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${S.liga.temucoId},equipo_visita_id.eq.${S.liga.temucoId})&goles_local=is.null&select=id,jornada,fecha_hora,estadio,equipo_local_id,local:liga_equipos!liga_partidos_equipo_local_id_fkey(id,nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(id,nombre)&order=fecha_hora.asc&limit=1`):Promise.resolve([]),
  ])
  S.rivales.notas=Array.isArray(notas)?notas:[]
  S.rivales.proximo=Array.isArray(proximo)&&proximo[0]?proximo[0]:null
  S.rivales.loaded=true
  render()
  if(S.rivales.proximo){
    const p=S.rivales.proximo
    const rivalId=p.equipo_local_id===S.liga.temucoId?p.visita.id:p.local.id
    const[statsTemuco,statsRival]=await Promise.all([statsEquipoLiga(S.liga.temucoId),statsEquipoLiga(rivalId)])
    S.rivales.comparacion={temuco:statsTemuco,rival:statsRival}
    render()
    const[susTemuco,susRival]=await Promise.all([calcularSuspendidosEquipo(S.liga.temucoId),calcularSuspendidosEquipo(rivalId)])
    S.rivales.suspendidos={temuco:susTemuco,rival:susRival}
    render()
    const[goleadorTemuco,goleadorRival]=await Promise.all([cargarGoleadorEquipo(S.liga.temucoId,true),cargarGoleadorEquipo(rivalId,false)])
    S.rivales.destacados={temuco:goleadorTemuco,rival:goleadorRival}
    if(S.pag==='inicio')render()

// Estimado, no dato oficial: ANFP no publica sanciones/suspensiones. Se
// infiere de la regla más común en el ascenso chileno (5 amarillas
// acumuladas = 1 fecha, roja directa = 1 fecha), confirmada contra nuestros
// propios datos: de los jugadores que llegaron a su 5ª amarilla acumulada,
// el 79% se ausentó del partido siguiente (vs. ~10% en la 3ª/4ª/6ª, que es
// ruido normal de rotación/lesiones) — y el 93% de las rojas se ausentó
// del partido siguiente. Puede fallar si ANFP resetea el conteo en algún
// punto de la temporada que no podemos ver desde acá.
async function calcularSuspendidosEquipo(equipoId){
  const[tarjetas,ultimo]=await Promise.all([
    ligaGet('liga_tarjetas',`?equipo_id=eq.${equipoId}&select=partido_id,tipo,jugador:liga_jugadores!liga_tarjetas_jugador_id_fkey(id,nombre,apellido)`),
    ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${equipoId},equipo_visita_id.eq.${equipoId})&goles_local=not.is.null&select=id&order=fecha_hora.desc&limit=1`),
  ])
  if(!Array.isArray(tarjetas)||!Array.isArray(ultimo)||!ultimo[0])return[]
  const ultimoPartidoId=ultimo[0].id
  const porJugador={}
  tarjetas.forEach(t=>{
    const jid=t.jugador?.id;if(!jid)return
    if(!porJugador[jid])porJugador[jid]={jugador:t.jugador,amarillas:0,rojaUltimo:false}
    if(t.tipo==='amarilla')porJugador[jid].amarillas++
    if(t.tipo==='roja'&&t.partido_id===ultimoPartidoId)porJugador[jid].rojaUltimo=true
  })
  return Object.values(porJugador).filter(j=>(j.amarillas>0&&j.amarillas%5===0)||j.rojaUltimo)
}

// Máximo goleador de un equipo (con minutos jugados y goles/90) y, si se
// pide, máximo asistidor — asistidor solo tiene sentido pedirlo para
// Temuco, porque es el único equipo del que cargamos ese dato a mano.
async function cargarGoleadorEquipo(equipoId,incluirAsistidor){
  const[goles,alineaciones,ultimo]=await Promise.all([
    ligaGet('liga_goles',`?equipo_id=eq.${equipoId}&autogol=eq.false&select=jugador_id,asistidor_id,partido:liga_partidos!liga_goles_partido_id_fkey(jornada),jugador:liga_jugadores!liga_goles_jugador_id_fkey(id,nombre,apellido),asistidor:liga_jugadores!liga_goles_asistidor_id_fkey(id,nombre,apellido)`),
    ligaGet('liga_alineaciones',`?equipo_id=eq.${equipoId}&select=jugador_id,minutos_jugados`),
    ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${equipoId},equipo_visita_id.eq.${equipoId})&goles_local=not.is.null&select=jornada&order=fecha_hora.desc&limit=1`),
  ])
  const golesArr=Array.isArray(goles)?goles:[]
  const jornadaActual=Array.isArray(ultimo)&&ultimo[0]?ultimo[0].jornada||0:0
  const minMap={}
  if(Array.isArray(alineaciones))alineaciones.forEach(a=>{minMap[a.jugador_id]=(minMap[a.jugador_id]||0)+(a.minutos_jugados||0)})
  const golMap={}
  golesArr.forEach(g=>{
    const jid=g.jugador_id;if(!jid)return
    if(!golMap[jid])golMap[jid]={jid,jugador:g.jugador,goles:0,ultimaJornada:0}
    golMap[jid].goles++
    const jr=g.partido?.jornada||0
    if(jr>golMap[jid].ultimaJornada)golMap[jid].ultimaJornada=jr
  })
  const rankingGoles=Object.values(golMap).sort((a,b)=>b.goles-a.goles)
  let goleador=null
  if(rankingGoles[0]){
    const top=rankingGoles[0]
    const minutos=minMap[top.jid]||0
    goleador={
      jugador:top.jugador,goles:top.goles,minutos,
      golesPor90:minutos?+(top.goles/(minutos/90)).toFixed(2):0,
      fechasSinMarcar:Math.max(0,jornadaActual-top.ultimaJornada),
    }
  }
  let asistidor=null
  if(incluirAsistidor){
    const asistMap={}
    golesArr.forEach(g=>{
      if(!g.asistidor_id)return
      const jid=g.asistidor_id
      if(!asistMap[jid])asistMap[jid]={jugador:g.asistidor,asist:0}
      asistMap[jid].asist++
    })
    const rankingAsist=Object.values(asistMap).sort((a,b)=>b.asist-a.asist)
    if(rankingAsist[0])asistidor=rankingAsist[0]
  }
  return{goleador,asistidor}
}

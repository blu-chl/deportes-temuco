          ${filaComparacion(esLocal?'Goles a favor / PJ (Local)':'Goles a favor / PJ (Visita)',esLocal?c.temuco.gfPPLocal:c.temuco.gfPPVisita,esLocal?c.rival.gfPPVisita:c.rival.gfPPLocal,v=>v.toFixed(2),true,c.temuco.u5.gfPP,c.rival.u5.gfPP)}
          ${filaComparacion(esLocal?'Goles en contra / PJ (Local)':'Goles en contra / PJ (Visita)',esLocal?c.temuco.gcPPLocal:c.temuco.gcPPVisita,esLocal?c.rival.gcPPVisita:c.rival.gcPPLocal,v=>v.toFixed(2),false,c.temuco.u5.gcPP,c.rival.u5.gcPP)}
          ${filaComparacion('Amarillas / PJ',c.temuco.amPP,c.rival.amPP,v=>v.toFixed(2),false,c.temuco.u5.amPP,c.rival.u5.amPP)}
          ${filaComparacion('Rojas / PJ',c.temuco.rjPP,c.rival.rjPP,v=>v.toFixed(2),false,c.temuco.u5.rjPP,c.rival.u5.rjPP)}
          ${filaComparacion(esLocal?'Pts/PJ Local':'Pts/PJ Visita',esLocal?c.temuco.pppLocal:c.temuco.pppVisita,esLocal?c.rival.pppVisita:c.rival.pppLocal,v=>v.toFixed(2),true,c.temuco.u5.ptsPP,c.rival.u5.ptsPP)}
          ${filaComparacion('% goles en descuento',c.temuco.pctDescuento,c.rival.pctDescuento,v=>v.toFixed(1)+'%',true,c.temuco.u5.pctDescuento,c.rival.u5.pctDescuento)}
          ${filaComparacion('Minutos sub-21',c.temuco.sub21Min,c.rival.sub21Min,v=>v.toLocaleString('es-CL'))}
        </div>`:`<div class="empty">Calculando comparación…</div>`}
      </div>
    </div>
  </div>`
}


// ===== ANÁLISIS (comparativa liga con gráficos) =====
async function cargarAnalisis(){
  let[equipos,partidos,goles,tarjetas]=await Promise.all([
    ligaGet('liga_equipos','?select=id,nombre,sub21_minutos_contable&order=nombre'),
    ligaGet('liga_partidos','?goles_local=not.is.null&select=id,jornada,fecha_hora,equipo_local_id,equipo_visita_id,goles_local,goles_visita&order=fecha_hora.asc&limit=1000'),
    ligaGetAll('liga_goles','equipo_id,autogol,minuto,minuto_extra'),
    ligaGetAll('liga_tarjetas','equipo_id,tipo'),
  ])
  // sub21_minutos_contable es una columna nueva, ver arriba en cargarLiga.
  if(!Array.isArray(equipos))equipos=await ligaGet('liga_equipos','?select=id,nombre&order=nombre')
  S.analisis.equipos=Array.isArray(equipos)?equipos:[]
  S.analisis.partidos=Array.isArray(partidos)?partidos:[]
  S.analisis.goles=Array.isArray(goles)?goles.filter(g=>!g.autogol):[]
  S.analisis.tarjetas=Array.isArray(tarjetas)?tarjetas:[]
  S.analisis.seleccion=new Set(S.analisis.equipos.map(e=>e.id))
  S.analisis.loaded=true
  if(S.pag==='analisis')render()
}

// El servidor limita a ~1000 filas por respuesta pase lo que pase con
// ?limit=, así que para tablas grandes (goles, tarjetas, alineaciones)
// paginamos con Range hasta agotarlas.
async function ligaGetAll(table,select){
  let all=[],offset=0
  const page=1000
  while(true){
    const r=await fetch(`${SB_URL}/rest/v1/${table}?select=${select}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+AUTH_TOKEN,Range:`${offset}-${offset+page-1}`}})
    const chunk=await r.json()
    if(!Array.isArray(chunk))break
    all=all.concat(chunk)
    if(chunk.length<page)break
    offset+=page
  }
  return all
}

function statsAnalisis(){
  const temuco=S.analisis.equipos.find(e=>e.nombre==='Deportes Temuco')
  const stat={}
  // sub21Min = total OFICIAL de ANFP (tope por jornada), no la suma de cada
  // jugador — esa sobrecuenta cuando hay más de un sub-21 en cancha a la vez.
  S.analisis.equipos.forEach(e=>{stat[e.id]={id:e.id,nombre:e.nombre,pj:0,gf:0,gc:0,am:0,rj:0,pjLocal:0,ptsLocal:0,pjVisita:0,ptsVisita:0,golesTotal:0,golesDescuento45:0,golesDescuento90:0,sub21Min:e.sub21_minutos_contable||0}})
  S.analisis.partidos.forEach(p=>{
    const l=stat[p.equipo_local_id],v=stat[p.equipo_visita_id]
    if(!l||!v)return
    l.pj++;v.pj++;l.gf+=p.goles_local;l.gc+=p.goles_visita;v.gf+=p.goles_visita;v.gc+=p.goles_local
    l.pjLocal++;v.pjVisita++
    const ptsL=p.goles_local>p.goles_visita?3:p.goles_local===p.goles_visita?1:0
    const ptsV=p.goles_visita>p.goles_local?3:p.goles_local===p.goles_visita?1:0
    l.ptsLocal+=ptsL;v.ptsVisita+=ptsV
  })
  S.analisis.tarjetas.forEach(t=>{
    const e=stat[t.equipo_id];if(!e)return
    if(t.tipo==='amarilla')e.am++;else if(t.tipo==='roja')e.rj++
  })
  S.analisis.goles.forEach(g=>{
    const e=stat[g.equipo_id];if(!e)return
    e.golesTotal++
    if(g.minuto_extra>0&&g.minuto===45)e.golesDescuento45++
    if(g.minuto_extra>0&&g.minuto===90)e.golesDescuento90++
  })
  return Object.values(stat).map(e=>({
    ...e,
    gfPP:e.pj?+(e.gf/e.pj).toFixed(2):0,
    gcPP:e.pj?+(e.gc/e.pj).toFixed(2):0,
    amPP:e.pj?+(e.am/e.pj).toFixed(2):0,
    rjPP:e.pj?+(e.rj/e.pj).toFixed(2):0,
    pppLocal:e.pjLocal?+(e.ptsLocal/e.pjLocal).toFixed(2):0,
    pppVisita:e.pjVisita?+(e.ptsVisita/e.pjVisita).toFixed(2):0,
    pctDescuento90:e.golesTotal?+((e.golesDescuento90/e.golesTotal)*100).toFixed(1):0,
    pctDescuento45:e.golesTotal?+((e.golesDescuento45/e.golesTotal)*100).toFixed(1):0,
    pctDescuentoAmbos:e.golesTotal?+(((e.golesDescuento90+e.golesDescuento45)/e.golesTotal)*100).toFixed(1):0,
    pts:e.ptsLocal+e.ptsVisita,
    ptsPP:e.pj?+((e.ptsLocal+e.ptsVisita)/e.pj).toFixed(2):0,
    isTemuco:temuco&&e.id===temuco.id,
  })).filter(e=>S.analisis.seleccion.has(e.id))
}

function toggleAnalisisEquipo(id){
  if(S.analisis.seleccion.has(id))S.analisis.seleccion.delete(id)
  else S.analisis.seleccion.add(id)
  render()
}

function nombreCorto(n){return n.length>16?n.slice(0,15)+'…':n}

// ---- Barra simple (una serie, Temuco resaltado) ----
function svgBarChart(rows,opts){
  const rowH=28,barH=18,labelW=140,rightPad=50,topPad=6,botPad=6
  const w=720,plotW=w-labelW-rightPad
  const h=rows.length*rowH+topPad+botPad
  if(!rows.length)return`<div class="empty">Selecciona al menos un equipo.</div>`
  const maxVal=Math.max(opts.maxHint||0.01,...rows.map(opts.val))
  const scale=v=>(v/maxVal)*plotW
  let svg=`<svg class="chart-svg" width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`
  const sorted=[...rows].sort((a,b)=>opts.val(b)-opts.val(a))
  sorted.forEach((r,i)=>{
    const y=topPad+i*rowH,cy=y+barH/2
    const val=opts.val(r)
    const bw=Math.max(scale(val),1)
    const color=r.isTemuco?'var(--v)':'var(--gris)'
    svg+=`<text x="${labelW-8}" y="${cy+4}" text-anchor="end" font-size="11" font-weight="${r.isTemuco?800:600}" fill="${r.isTemuco?'var(--v)':'var(--blanco)'}">${nombreCorto(r.nombre)}</text>`
    svg+=`<rect x="${labelW}" y="${cy-barH/2}" width="${bw}" height="${barH}" rx="4" fill="${color}" opacity="${r.isTemuco?1:.55}"><title>${r.nombre}: ${opts.fmt(val)}</title></rect>`
    svg+=`<text x="${labelW+bw+8}" y="${cy+4}" font-size="11" font-weight="700" class="chart-axis">${opts.fmt(val)}</text>`
  })
  svg+=`</svg>`
  return svg
}

// ---- Barra apilada (2 series, ej. amarillas+rojas) ----
function svgStackedChart(rows,segs,opts){
  const rowH=28,barH=18,labelW=140,rightPad=50,topPad=6,botPad=6
  const w=720,plotW=w-labelW-rightPad
  const h=rows.length*rowH+topPad+botPad
  if(!rows.length)return`<div class="empty">Selecciona al menos un equipo.</div>`
  const total=r=>segs.reduce((a,s)=>a+s.val(r),0)
  const maxVal=Math.max(opts.maxHint||0.01,...rows.map(total))
  const scale=v=>(v/maxVal)*plotW
  let svg=`<svg class="chart-svg" width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`
  const sorted=[...rows].sort((a,b)=>total(b)-total(a))
  sorted.forEach((r,i)=>{
    const y=topPad+i*rowH,cy=y+barH/2
    svg+=`<text x="${labelW-8}" y="${cy+4}" text-anchor="end" font-size="11" font-weight="${r.isTemuco?800:600}" fill="${r.isTemuco?'var(--v)':'var(--blanco)'}">${nombreCorto(r.nombre)}</text>`
    let acc=0
    segs.forEach((s,si)=>{
      const val=s.val(r)
      const bx=labelW+scale(acc)+(si>0?1.5:0)
      const bw=Math.max(scale(val)-(si>0?1.5:0),0)
      svg+=`<rect x="${bx}" y="${cy-barH/2}" width="${bw}" height="${barH}" rx="3" fill="${s.color}"><title>${r.nombre} · ${s.label}: ${val}</title></rect>`
      acc+=val
    })
    svg+=`<text x="${labelW+scale(acc)+8}" y="${cy+4}" font-size="11" font-weight="700" class="chart-axis">${total(r).toFixed(2)}</text>`
  })
  svg+=`</svg>`
  return svg
}

// ---- Barras agrupadas (2 series lado a lado, ej. local/visita) ----
function svgGroupedChart(rows,segs,opts){
  const rowH=44,barH=15,gap=2,labelW=140,rightPad=50,topPad=6,botPad=6
  const w=720,plotW=w-labelW-rightPad
  const h=rows.length*rowH+topPad+botPad
  if(!rows.length)return`<div class="empty">Selecciona al menos un equipo.</div>`
  const maxVal=Math.max(opts.maxHint||0.01,...rows.map(r=>Math.max(...segs.map(s=>s.val(r)))))
  const scale=v=>(v/maxVal)*plotW
  let svg=`<svg class="chart-svg" width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`
  const sorted=[...rows].sort((a,b)=>(segs[0].val(b)+segs[1].val(b))-(segs[0].val(a)+segs[1].val(a)))
  sorted.forEach((r,i)=>{
    const y=topPad+i*rowH
    svg+=`<text x="${labelW-8}" y="${y+rowH/2+4}" text-anchor="end" font-size="11" font-weight="${r.isTemuco?800:600}" fill="${r.isTemuco?'var(--v)':'var(--blanco)'}">${nombreCorto(r.nombre)}</text>`
    segs.forEach((s,si)=>{
      const val=s.val(r)
      const by=y+rowH/2-barH-gap/2+si*(barH+gap)
      const bw=Math.max(scale(val),1)
      svg+=`<rect x="${labelW}" y="${by}" width="${bw}" height="${barH}" rx="3" fill="${s.color}"><title>${r.nombre} · ${s.label}: ${val.toFixed(2)}</title></rect>`
      svg+=`<text x="${labelW+bw+6}" y="${by+barH-3}" font-size="10.5" font-weight="700" class="chart-axis">${val.toFixed(2)}</text>`
    })
  })
  svg+=`</svg>`
  return svg
}

// ---- Cuadrante ataque vs defensa (scatter) ----
// ---- Cuadrante genérico X/Y (scatter), puntos = escudo del equipo ----
let _scatterClipSeq=0
function svgScatterXY(rows,cfg){
  const pad={l:46,r:24,t:20,b:34},w=560,h=420
  const plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b
  if(!rows.length)return`<div class="empty">Selecciona al menos un equipo.</div>`
  const maxX=Math.max(cfg.xMaxHint||0.01,...rows.map(cfg.xFn))
  const maxY=Math.max(cfg.yMaxHint||0.01,...rows.map(cfg.yFn))
  const x=v=>pad.l+(v/maxX)*plotW
  const y=v=>pad.t+plotH-(v/maxY)*plotH
  const avgX=rows.reduce((a,r)=>a+cfg.xFn(r),0)/rows.length
  const avgY=rows.reduce((a,r)=>a+cfg.yFn(r),0)/rows.length
  const clipId=`sc-clip-${_scatterClipSeq++}`
  let svg=`<svg class="chart-svg" width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`
  svg+=`<defs><clipPath id="${clipId}"><rect x="${pad.l}" y="${pad.t}" width="${plotW}" height="${plotH}"/></clipPath></defs>`
  for(let i=0;i<=4;i++){
    const gx=pad.l+plotW*i/4
    svg+=`<line x1="${gx}" y1="${pad.t}" x2="${gx}" y2="${pad.t+plotH}" class="chart-grid"/>`
    svg+=`<text x="${gx}" y="${pad.t+plotH+16}" text-anchor="middle" class="chart-axis">${cfg.xFmt(maxX*i/4)}</text>`
    const gy=pad.t+plotH-plotH*i/4
    svg+=`<line x1="${pad.l}" y1="${gy}" x2="${pad.l+plotW}" y2="${gy}" class="chart-grid"/>`
    svg+=`<text x="${pad.l-6}" y="${gy+4}" text-anchor="end" class="chart-axis">${cfg.yFmt(maxY*i/4)}</text>`
  }
  svg+=`<text x="${pad.l+plotW/2}" y="${h-2}" text-anchor="middle" class="chart-axis">${cfg.xLabel} →</text>`
  svg+=`<text x="12" y="${pad.t+plotH/2}" text-anchor="middle" class="chart-axis" transform="rotate(-90 12 ${pad.t+plotH/2})">${cfg.yLabel} →</text>`
  svg+=`<line x1="${x(avgX)}" y1="${pad.t}" x2="${x(avgX)}" y2="${pad.t+plotH}" stroke="var(--borde2)" stroke-width="1.5" stroke-dasharray="3 3"/>`
  svg+=`<line x1="${pad.l}" y1="${y(avgY)}" x2="${pad.l+plotW}" y2="${y(avgY)}" stroke="var(--borde2)" stroke-width="1.5" stroke-dasharray="3 3"/>`
  // Diagonal desde el origen (0,0) hasta el punto máximo visible de cada
  // eje — referencia de proporción entre las dos variables (no una
  // regresión de los datos reales).
  if(cfg.showTrend&&rows.length>=2){
    svg+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(maxX)}" y2="${y(maxY)}" stroke="var(--v)" stroke-width="1.5" stroke-dasharray="7 4" opacity="0.5" clip-path="url(#${clipId})"><title>Diagonal desde el origen — referencia de proporción entre los dos ejes</title></line>`
  }
  rows.forEach(r=>{
    const cx=x(cfg.xFn(r)),cy=y(cfg.yFn(r))
    const rad=r.isTemuco?16:12
    const crest=crestUrl(r.nombre)
    const tip=`${r.nombre}\n${cfg.xLabel}: ${cfg.xFmt(cfg.xFn(r))}\n${cfg.yLabel}: ${cfg.yFmt(cfg.yFn(r))}`
    svg+=`<circle cx="${cx}" cy="${cy}" r="${rad+3}" fill="#fff" stroke="${r.isTemuco?'var(--v)':'var(--borde2)'}" stroke-width="${r.isTemuco?2.5:1.5}"/>`
    if(crest)svg+=`<image href="${crest}" x="${cx-rad}" y="${cy-rad}" width="${rad*2}" height="${rad*2}" preserveAspectRatio="xMidYMid meet"><title>${tip}</title></image>`
    else svg+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="var(--borde2)"><title>${tip}</title></circle>`
    if(r.isTemuco)svg+=`<text x="${cx}" y="${cy-rad-8}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--v)">${r.nombre}</text>`
  })
  svg+=`</svg>`
  return svg
}

// ---- Coeficiente de correlación de Pearson (dependencia estadística) ----
function pearsonR(rows,xFn,yFn){
  const n=rows.length
  if(n<2)return 0
  const xs=rows.map(xFn),ys=rows.map(yFn)
  const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n
  let sxy=0,sxx=0,syy=0
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy}
  const denom=Math.sqrt(sxx*syy)
  return denom?sxy/denom:0
}
function interpretaR(r){
  const a=Math.abs(r)
  const fuerza=a>=0.7?'fuerte':a>=0.4?'moderada':a>=0.2?'débil':'muy débil o nula'
  const signo=a<0.05?'':r>0?', positiva':', negativa'
  return`r = ${r.toFixed(2)} — correlación ${fuerza}${signo}`
}

// Paleta fija para distinguir equipos en el gráfico de evolución — Temuco
// siempre rojo (var(--v)), el resto un color distinto por posición en la
// lista para que no cambien de color al filtrar.
const COLORES_EQUIPO=['var(--az)','var(--am)','#8e44ad','#16a085','#e67e22','#2c3e50','#c0392b','#27ae60','#2980b9','#d35400','#7f8c8d','#f39c12','#1abc9c','#34495e','#9b59b6']

function renderAnalisis(){
  if(!S.analisis.loaded)return`<div class="pb"><div class="empty">Cargando comparativa…</div></div>`
  const rows=statsAnalisis()
  const cat=S.analisis.tab

  const contenido=
    cat==='evolucion'?(()=>{
      const temuco=S.analisis.equipos.find(e=>e.nombre==='Deportes Temuco')
      const porEquipo={}
      S.analisis.equipos.forEach(e=>{if(S.analisis.seleccion.has(e.id))porEquipo[e.id]={acc:0,serie:[]}})
      S.analisis.partidos.forEach(p=>{
        const l=porEquipo[p.equipo_local_id],v=porEquipo[p.equipo_visita_id]
        if(l){const r=p.goles_local>p.goles_visita?'G':p.goles_local===p.goles_visita?'E':'P';l.acc+=r==='G'?3:r==='E'?1:0;l.serie.push({jornada:p.jornada,acumulado:l.acc,resultado:r})}
        if(v){const r=p.goles_visita>p.goles_local?'G':p.goles_local===p.goles_visita?'E':'P';v.acc+=r==='G'?3:r==='E'?1:0;v.serie.push({jornada:p.jornada,acumulado:v.acc,resultado:r})}
      })
      // Filtro de rango — con las 22 fechas juntas el gráfico se ve como un
      // montón de puntos sin mucha claridad, así que por defecto se puede
      // acotar a las últimas N fechas.
      const maxJornada=Math.max(1,...S.analisis.partidos.map(p=>p.jornada||1))
      const RANGOS={5:5,10:10,todas:Infinity}
      const desdeJornada=maxJornada-RANGOS[S.analisis.evolucionRango]+1
      const series=S.analisis.equipos.filter(e=>S.analisis.seleccion.has(e.id)).map(e=>({
        nombre:e.nombre,color:colorEquipo(e.id,!!(temuco&&e.id===temuco.id)),
        serie:porEquipo[e.id].serie.filter(pt=>(pt.jornada||0)>=desdeJornada),
      }))
      return`
        <div style="color:var(--gris);font-size:12px;margin-bottom:12px">Puntos acumulados por jornada. Usa los filtros de equipos de arriba para elegir cuáles comparar — con muchos equipos a la vez se pone difícil de leer.</div>
        <div class="tabs" style="margin-bottom:10px">
          ${[['5','Últimas 5'],['10','Últimas 10'],['todas','Todas']].map(([id,l])=>`<button class="tab ${S.analisis.evolucionRango===id?'on':''}" onclick="S.analisis.evolucionRango='${id}';render()">${l}</button>`).join('')}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;font-size:11px;font-weight:700;color:var(--gris)">
          ${series.map(s=>`<span><span style="display:inline-block;width:9px;height:9px;background:${s.color};border-radius:2px;margin-right:4px"></span>${s.nombre}</span>`).join('')}
        </div>
        ${svgRachaMultiple(series)}
      `
    })():
    cat==='ataque'?`
      <div style="color:var(--gris);font-size:12px;margin-bottom:12px">Cada escudo es un equipo. Arriba a la izquierda = ataca mucho y recibe poco. Las líneas punteadas marcan el promedio de los equipos filtrados; la diagonal roja va desde el origen y marca la proporción 1:1 entre los dos ejes.</div>
      ${svgScatterXY(rows,{xFn:r=>r.gcPP,yFn:r=>r.gfPP,xFmt:v=>v.toFixed(1),yFmt:v=>v.toFixed(1),xLabel:'Goles en contra por partido',yLabel:'Goles a favor por partido',xMaxHint:2.2,yMaxHint:2.2,showTrend:true})}
    `:
    cat==='disciplina'?`
      <div style="color:var(--gris);font-size:12px;margin-bottom:12px">Tarjetas recibidas por partido jugado.</div>
      <div style="display:flex;gap:14px;margin-bottom:10px;font-size:11px;font-weight:700;color:var(--gris)">
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--am);border-radius:2px;margin-right:4px"></span>Amarillas</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--ro);border-radius:2px;margin-right:4px"></span>Rojas</span>
      </div>
      ${svgStackedChart(rows,[{val:r=>r.amPP,color:'var(--am)',label:'Amarillas'},{val:r=>r.rjPP,color:'var(--ro)',label:'Rojas'}],{maxHint:3.5})}
    `:
    cat==='rendimiento'?`
      <div style="color:var(--gris);font-size:12px;margin-bottom:12px">Puntos obtenidos por partido jugado, según condición.</div>
      <div style="display:flex;gap:14px;margin-bottom:10px;font-size:11px;font-weight:700;color:var(--gris)">
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--az);border-radius:2px;margin-right:4px"></span>Local</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--gold);border-radius:2px;margin-right:4px"></span>Visita</span>
      </div>
      ${svgGroupedChart(rows,[{val:r=>r.pppLocal,color:'var(--az)',label:'Local'},{val:r=>r.pppVisita,color:'var(--gold)',label:'Visita'}],{maxHint:3})}
    `:
    cat==='descuento'?(()=>{
      const campo=S.analisis.descuentoFiltro==='45'?'pctDescuento45':S.analisis.descuentoFiltro==='ambos'?'pctDescuentoAmbos':'pctDescuento90'
      return`
        <div style="color:var(--gris);font-size:12px;margin-bottom:12px">% de los goles del equipo marcados en tiempo de descuento.</div>
        <div class="tabs" style="margin-bottom:12px">
          ${[['90','Solo 90+'],['45','Solo 45+'],['ambos','Ambos']].map(([id,l])=>`<button class="tab ${S.analisis.descuentoFiltro===id?'on':''}" onclick="S.analisis.descuentoFiltro='${id}';render()">${l}</button>`).join('')}
        </div>
        ${svgBarChart(rows,{val:r=>r[campo],fmt:v=>v.toFixed(1)+'%',maxHint:20})}
      `
    })():
    cat==='sub21'?`
      <div style="color:var(--gris);font-size:12px;margin-bottom:12px">Suma de minutos oficiales de todos los jugadores sub-21 usados en la temporada (dato ANFP).</div>
      ${svgBarChart(rows,{val:r=>r.sub21Min,fmt:v=>v.toLocaleString('es-CL'),maxHint:1000})}
    `:
    (()=>{
      const rDisc=pearsonR(rows,r=>r.amPP+r.rjPP,r=>r.ptsPP)
      const rSub21=pearsonR(rows,r=>r.sub21Min,r=>r.ptsPP)
      const chip=r=>`<div style="display:inline-block;font-size:12.5px;font-weight:800;color:${Math.abs(r)>=0.4?'var(--v)':'var(--gris)'};background:rgba(16,24,32,.04);border:1px solid var(--borde);border-radius:999px;padding:4px 12px;margin-bottom:10px">${interpretaR(r)}</div>`
      return`
        <div style="color:var(--gris);font-size:12px;margin-bottom:18px">Análisis de dependencia estadística: qué tan relacionadas están dos variables entre los 16 equipos. El coeficiente de correlación de Pearson (r) va de -1 (relación inversa perfecta) a +1 (relación directa perfecta); cerca de 0 significa que no hay relación real entre ambas. La diagonal en cada gráfico va desde el origen y marca la proporción 1:1 entre los dos ejes.</div>
        <div class="pt disp" style="font-size:15px;margin-bottom:2px">Disciplina vs Rendimiento</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Tarjetas por partido (eje X) vs puntos por partido (eje Y)</div>
        ${chip(rDisc)}
        ${svgScatterXY(rows,{xFn:r=>r.amPP+r.rjPP,yFn:r=>r.ptsPP,xFmt:v=>v.toFixed(2),yFmt:v=>v.toFixed(2),xLabel:'Tarjetas por partido',yLabel:'Puntos por partido',xMaxHint:3.5,yMaxHint:2.5,showTrend:true})}
        <div class="pt disp" style="font-size:15px;margin:26px 0 2px">Minutos Sub-21 vs Rendimiento</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Minutos oficiales sub-21 en la temporada (eje X) vs puntos por partido (eje Y)</div>
        ${chip(rSub21)}
        ${svgScatterXY(rows,{xFn:r=>r.sub21Min,yFn:r=>r.ptsPP,xFmt:v=>Math.round(v).toLocaleString('es-CL'),yFmt:v=>v.toFixed(2),xLabel:'Minutos Sub-21',yLabel:'Puntos por partido',xMaxHint:1000,yMaxHint:2.5,showTrend:true})}
      `
    })()

  return`<div class="pb">
    <div class="pt disp" style="font-size:18px;margin-bottom:4px">Análisis de datos · Liga de Ascenso</div>
    <div style="color:var(--gris);font-size:12px;margin-bottom:14px">Comparación entre los 16 equipos. Filtra quiénes se muestran.</div>
    ${renderFiltroEquipos()}
    <div class="tabs">${ANALISIS_CATS.map(c=>`<button class="tab ${cat===c.id?'on':''}" onclick="S.analisis.tab='${c.id}';render()">${c.l}</button>`).join('')}</div>
    <div class="panel"><div class="pb">${contenido}</div></div>
  </div>`
}

async function guardarSancion(){
  const f=S.sancionForm
  if(!f.equipo_id||!f.puntos||f.puntos<=0||!f.motivo.trim()){toast('Completa equipo, puntos y motivo',true);return}
  const r=await post('liga_sanciones',{equipo_id:+f.equipo_id,puntos:+f.puntos,motivo:f.motivo.trim(),fecha:f.fecha})
  if(Array.isArray(r)&&r[0]){
    toast('Sanción registrada')
    S.sancionForm={equipo_id:'',puntos:1,motivo:'',fecha:hoy()}
    await cargarLiga()
  }else toast('Error al guardar (¿sesión admin activa?)',true)
}
async function borrarSancion(id){
  if(!confirm('¿Eliminar esta sanción? El equipo recupera los puntos.'))return
  await del('liga_sanciones',`?id=eq.${id}`)
  await cargarLiga()
  toast('Sanción eliminada')
}
function renderSanciones(){
  const equiposOrd=[...S.liga.equipos].sort((a,b)=>a.nombre.localeCompare(b.nombre))
  const f=S.sancionForm
  return`<div class="panel" style="margin-bottom:14px">
    <div class="ph"><span class="pt">Descontar puntos</span></div>
    <div class="pb">
      <div style="font-size:11.5px;color:var(--gris);margin-bottom:10px">Para sanciones administrativas ajenas al partido (incumplimientos, inhabilitaciones, etc). El descuento se aplica de inmediato en la tabla de posiciones, para cualquier equipo de la liga.</div>
      <div class="fr2">
        <div class="fg"><label>Equipo</label>
          <select onchange="S.sancionForm.equipo_id=this.value">
            <option value="">Selecciona…</option>
            ${equiposOrd.map(e=>`<option value="${e.id}" ${f.equipo_id==e.id?'selected':''}>${e.nombre}</option>`).join('')}
          </select>
        </div>
        <div class="fg"><label>Puntos a descontar</label><input type="number" min="1" value="${f.puntos}" oninput="S.sancionForm.puntos=this.value"></div>
      </div>
      <div class="fg"><label>Motivo</label><input type="text" placeholder="Ej: Incumplimiento reglamento ANFP art. X" value="${f.motivo}" oninput="S.sancionForm.motivo=this.value"></div>
      <div class="fg" style="margin-bottom:0"><label>Fecha</label><input type="date" value="${f.fecha}" oninput="S.sancionForm.fecha=this.value"></div>
      <button class="btn" style="margin-top:12px" onclick="guardarSancion()">Registrar sanción</button>
    </div>
  </div>
  <div class="ph" style="background:none;border:none;padding:0 0 8px"><span class="pt">Sanciones registradas</span></div>
  ${S.liga.sanciones.length?S.liga.sanciones.map(s=>{
    const eq=S.liga.equipos.find(e=>e.id===s.equipo_id)
    return`<div class="pcard" style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <img src="${eq?crestUrl(eq.nombre):''}" style="width:26px;height:26px;object-fit:contain;flex-shrink:0">
      <div style="flex:1">
        <div style="font-weight:700;font-size:12.5px">${eq?eq.nombre:'?'} <span style="color:var(--ro);font-weight:800">-${s.puntos} pts</span></div>
        <div style="font-size:11px;color:var(--gris)">${s.motivo}</div>
        <div style="font-size:10px;color:var(--muted)">${s.fecha}</div>
      </div>
      <button class="bsm" onclick="borrarSancion(${s.id})">Eliminar</button>
    </div>`
  }).join(''):'<div class="empty">Sin sanciones registradas.</div>'}`
}

// Agrupado por frecuencia de uso real: primero lo que se usa cada fecha
// (Enriquecer, Sanciones — datos de la Liga scrapeada), después lo que es
// por jugador y cambia poco (Registro viejo de Primera B, Médico), al
// final lo técnico (Config). Debug se sacó — era una herramienta de
// diagnóstico del minutaje viejo que ya no se usa.
function renderAdmin(){
  if(!S.isAdmin)return renderLogin()
  const subs=[
    {id:'enriquecer',l:'✏️ Enriquecer'},{id:'sanciones',l:'⚖ Sanciones'},
    {sep:true},
    {id:'registro',l:'📝 Registro (Primera B)'},{id:'medico',l:'🩹 Médico'},
    {sep:true},
    {id:'config',l:'⚙ Config'},
  ]
  return`<div class="tabs">${subs.map(t=>t.sep?`<span class="tab-sep"></span>`:`<button class="tab ${S.adminSub===t.id?'on':''}" onclick="S.adminSub='${t.id}';${t.id==='enriquecer'?'if(!S.enriq.loaded)cargarEnriquecimiento();':''}render()">${t.l}</button>`).join('')}</div>
  ${
    S.adminSub==='registro'?renderRegistro():
    S.adminSub==='enriquecer'?renderEnriquecer():
    S.adminSub==='medico'?renderMedico():
    S.adminSub==='sanciones'?renderSanciones():
    renderConfig()
  }`
}

function render(){
  const root=document.getElementById('root')
  root.innerHTML=`<div id="app"><div class="hdrwrap">${renderHdr()}${renderNav()}</div>${
    S.pag==='inicio'?renderInicio():
    S.pag==='plantilla'?renderDeportesTemuco():
    S.pag==='liga'?renderLiga():
    S.pag==='partido'?renderPartidoLiga():
    S.pag==='analisis'?renderAnalisis():
    S.pag==='notas'?renderNotas():
    S.pag==='admin'?renderAdmin():
    renderInicio()
  }</div>`
  // Scroll automático al partido activo en Registro
  if(S.pag==='admin'&&S.adminSub==='registro'){
    const el=document.getElementById('partido-activo')
    if(el)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})
  }
}

// Limpieza del fondo de pantalla personalizado (feature retirada — no
// combina con la estética clara actual). Por si quedó guardado en el
// navegador de alguien de una versión anterior.
localStorage.removeItem('dt-bg')

if(S.tema==='verde')document.documentElement.dataset.tema='verde'
render()
cargarDatos()
cargarLiga()
cargarPartidosLiga()
cargarRivales()
</script>

function parseFormacion(str){
  const parts=str.trim().split('-').map(Number)
  if(parts.length<2||parts.some(isNaN)||parts.some(n=>n<1))return null
  if(parts.reduce((a,b)=>a+b,0)!==10)return null
  const lineas=[{pos:'POR',n:1}]
  parts.forEach((n,i)=>{
    if(i===0)lineas.push({pos:'DEF',n})
    else if(i===parts.length-1)lineas.push({pos:'DEL',n})
    else lineas.push({pos:'MED',n})
  })
  return lineas
}

function calcMinutajeAuto(titularIds,evs,duracion=90){
  const mins={}
  const entradas={}  // minuto en que entró cada jugador
  titularIds.forEach(id=>{if(id){mins[id]=duracion;entradas[id]=0}})
  evs.filter(e=>e.tipo==='Sustitución').sort((a,b)=>a.minuto-b.minuto).forEach(sub=>{
    const min=sub.minuto||0
    // El que sale: minutos reales = minuto_salida - minuto_entrada
    if(sub.jugador_sale_id!=null&&mins[sub.jugador_sale_id]!==undefined)
      mins[sub.jugador_sale_id]=min-(entradas[sub.jugador_sale_id]??0)
    // El que entra: registrar su minuto de entrada y calcular minutos disponibles
    if(sub.jugador_id!=null){
      entradas[sub.jugador_id]=min
      mins[sub.jugador_id]=duracion-min
    }
  })
  return mins
}

async function cargarDatos(){
  const[jugs,parts,evs,less,nts,mins]=await Promise.all([
    get('jugadores','?activo=eq.true&order=numero'),
    get('partidos','?order=fecha'),
    get('eventos','?order=minuto'),
    get('lesiones','?or=(alta.is.false,alta.is.null)'),
    get('notas','?order=created_at.desc'),
    get('minutaje','?order=partido_id'),
  ])
  S.jugadores=Array.isArray(jugs)?jugs:[]
  S.partidos=Array.isArray(parts)?parts:[]
  S.eventos=Array.isArray(evs)?evs:[]
  S.lesiones=Array.isArray(less)?less:[]
  S.notas=Array.isArray(nts)?nts:[]
  S.minutaje=Array.isArray(mins)?mins:[]

    S.ev.jugador_id=S.jugadores[0].id
    S.ev.jugador_sale_id=S.jugadores[0].id
    S.addLes.jugador_id=S.jugadores[0].id

  applyBg();render()
}

function calcHdr(){
  const p=S.partidos
  const pg=p.filter(x=>x.goles_favor>x.goles_contra).length

  return{pg,pe,pp,pts:pg*3+pe,gf:p.reduce((a,x)=>a+x.goles_favor,0),gc:p.reduce((a,x)=>a+x.goles_contra,0)}
}

  if(!email||!pass){err.textContent='Completa todos los campos';err.style.display='block';return}
  btn.textContent='Ingresando...';btn.disabled=true
  const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{
    method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},

async function handleFotoUpload(jugId,input){
  const file=input.files[0];if(!file)return
  toast('Subiendo foto...')
  const ext=file.name.split('.').pop()
  const filename=`jugador_${jugId}_${Date.now()}.${ext}`
  try{
    const r=await fetch(`${SB_URL}/storage/v1/object/jugadores/${filename}`,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+AUTH_TOKEN,'Content-Type':file.type,'x-upsert':'true'},
      body:file
    })
    if(r.ok){
      const url=`${SB_URL}/storage/v1/object/public/jugadores/${filename}`
      await patch('jugadores',{foto_url:url},`?id=eq.${jugId}`)
      toast('Foto actualizada ✓');cerrarModal();await cargarDatos()
    }else toast('Error — verifica el bucket "jugadores" en Supabase',true)
  }catch(e){toast('Error de conexión',true)}
}

  })
  const lineas=[]
  let cur=[],lastL=-1
  slots.forEach(s=>{
    if(s.linea!==lastL&&cur.length>0){lineas.push(cur);cur=[]}
    cur.push(s);lastL=s.linea

  if(cur.length)lineas.push(cur)

  const jugOptsSlot=[...S.jugadores].sort((a,b)=>a.numero-b.numero).map(j=>{

      const numGoles=j?S.evPartido.filter(e=>e.tipo==='Gol'&&e.jugador_id===jugId).length:0
      const numAm=j?S.evPartido.filter(e=>e.tipo==='Amarilla'&&e.jugador_id===jugId).length:0
      const numAsist=j?S.evPartido.filter(e=>e.tipo==='Asistencia'&&e.jugador_id===jugId).length:0
      return`<div class="slot ${j?'filled':''}" onclick="selSlot(${s.idx})" title="${j?(S.partidoActivo?'📋 Clic para registrar evento':'Cambiar jugador'):'Asignar jugador'}">

        const apE=jugApellido(jE.id)

            </div>
            ${numAm>0?`<div style="position:absolute;top:-2px;right:-2px;font-size:12px;line-height:1">🟡${numAm>1?`<span style="font-size:7px;font-weight:800;color:#333">${numAm}</span>`:''}</div>`:''}
            ${(numGoles>0||numAsist>0)?`<div style="position:absolute;bottom:-2px;right:-2px;display:flex;flex-direction:column;align-items:flex-end;gap:0;line-height:1.1">

              ${numAsist>0?`<span style="font-size:12px;line-height:1">🅰️${numAsist>1?`<span style="font-size:7px;font-weight:800;color:#333">${numAsist}</span>`:''}</span>`:''}
            </div>`:''}
            ${subSalida?`<div style="position:absolute;bottom:-2px;left:-2px;font-size:12px;line-height:1" title="Sustituido min ${subSalida.minuto}">🔄</div>`:''}

function selSlot(idx){
  const jugId=S.titulares[idx]
  if(jugId&&S.partidoActivo){
    abrirEventoSlot(idx,jugId)
  }else{
    abrirAsignarSlot(idx)
  }
}

function asignarSlot(){
  const sel=document.getElementById('sel-slot-jug');if(!sel)return
  S.titulares[S.slotSeleccionado]=+sel.value||null
  S.slotSeleccionado=null;render()
  guardarTitularesAuto()
}

  const titIds=new Set(S.titulares.filter(x=>x))

      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700">${j.numero} ${ap}</div>
        <div style="font-size:10px;color:var(--gris)">${j.posicion_especifica||j.posicion}${enForm?' · ya en formación':''}</div>

      ${enForm?`<span style="font-size:10px;color:var(--vc)">✓</span>`:''}

async function asignarSlotDirecto(idx,jugId){
  if(idx>=0)S.titulares[idx]=jugId||null
  S.slotSeleccionado=null
  document.getElementById('modal-root').innerHTML=''
  render()
  await guardarTitularesAuto()
  // Auto-recalcular minutaje silenciosamente
  if(S.partidoActivo){
    const titIds=S.titulares.filter(x=>x)
    if(titIds.length>0){
      const mins=calcMinutajeAuto(titIds,S.evPartido,S.duracion)
      await Promise.all(Object.entries(mins).filter(([,v])=>v>0).map(([jid,minutos])=>
        fetch(`${SB_URL}/rest/v1/minutaje`,{
          method:'POST',
          headers:{...hdrs(),'Prefer':'resolution=merge-duplicates,return=representation'},
          body:JSON.stringify({partido_id:S.partidoActivo,jugador_id:+jid,minutos})
        })
      ))
    }
  }
}

function abrirEventoSlot(idx,jugId){
  S.slotEvPanel={jugId,slotIdx:idx,tipo:'Amarilla',minuto:1,subtipo:TIPOS_GOL[0],asistidor_id:'',asist_subtipo:'Pase',jugador_sale_id:''}
  renderEventoSlotModal()
}

function renderEventoSlotModal(){

    {t:'Gol',ico:'⚽',c:'var(--vc)'},
    {t:'Amarilla',ico:'🟡',c:'var(--am)'},
    {t:'Roja',ico:'🔴',c:'var(--ro)'},
    {t:'Asistencia',ico:'🅰️',c:'var(--az)'},
    {t:'Sustitución',ico:'🔄',c:'var(--gris)'},

    const isOn=p.tipo===t.t
    const sub=t.t==='Gol'?`'${TIPOS_GOL[0]}'`:t.t==='Asistencia'?`'${TIPOS_ASIST[0]}'`:`''`
    return`<button onclick="S.slotEvPanel.tipo='${t.t}';S.slotEvPanel.subtipo=${sub};renderEventoSlotModal()"
      style="padding:10px 4px;border-radius:8px;border:2px solid ${isOn?t.c:'var(--borde2)'};background:${isOn?t.c+'33':'rgba(0,0,0,.3)'};color:${isOn?t.c:'var(--gris)'};font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s;width:100%">
      <span style="font-size:20px">${t.ico}</span><span>${t.t}</span>

    const aap=jj.nombre.trim().split(' ').slice(1).join(' ')||jj.nombre

      ${TIPOS_GOL.map(st=>`<option ${p.subtipo===st?'selected':''}>${st}</option>`).join('')}</select></div>
    <div class="fg"><label>Asistidor (opcional)</label><select onchange="S.slotEvPanel.asistidor_id=this.value;renderEventoSlotModal()" style="${inputStyle}">
      <option value="">— Sin asistencia —</option>${optsFor(p.asistidor_id)}</select></div>
    ${p.asistidor_id?`<div class="fg"><label>Tipo de asistencia</label><select onchange="S.slotEvPanel.asist_subtipo=this.value" style="${inputStyle}">
      ${TIPOS_ASIST.map(t=>`<option ${p.asist_subtipo===t?'selected':''}>${t}</option>`).join('')}</select></div>`:''}`
  }else if(p.tipo==='Asistencia'){
    extra=`<div class="fg"><label>Tipo de asistencia</label><select onchange="S.slotEvPanel.subtipo=this.value" style="${inputStyle}">
      ${TIPOS_ASIST.map(st=>`<option ${p.subtipo===st?'selected':''}>${st}</option>`).join('')}</select></div>`
  }else if(p.tipo==='Sustitución'){
    extra=`<div class="fg"><label>Entra en su lugar</label><select onchange="S.slotEvPanel.jugador_sale_id=this.value" style="${inputStyle}">
      <option value="">— Seleccionar —</option>${opts}</select></div>`

  document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this){S.slotEvPanel=null;document.getElementById('modal-root').innerHTML=''}">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">

async function guardarEventoSlot(){
  const p=S.slotEvPanel
  if(!p||!S.partidoActivo)return
  // Para sustituciones desde un slot del 11 inicial: el jugador clickeado SALE,
  // el seleccionado en "Entra en su lugar" es quien ENTRA (jugador_id del evento).
  const isSubStarter=p.tipo==='Sustitución'&&p.slotIdx>=0
  const jugId=isSubStarter?(+p.jugador_sale_id||null):p.jugId
  const jugSale=isSubStarter?p.jugId:(p.tipo==='Sustitución'?(+p.jugador_sale_id||null):null)
  const r=await post('eventos',{
    partido_id:S.partidoActivo,jugador_id:jugId,tipo:p.tipo,minuto:+p.minuto,
    subtipo:['Gol','Asistencia'].includes(p.tipo)?p.subtipo:null,
    jugador_sale_id:jugSale,
  })
  if(Array.isArray(r)&&r[0]){
    let msg='Evento registrado ✓'
    if(p.tipo==='Gol'&&p.asistidor_id){
      await post('eventos',{partido_id:S.partidoActivo,jugador_id:+p.asistidor_id,tipo:'Asistencia',
        subtipo:p.asist_subtipo||'Pase',minuto:+p.minuto,jugador_sale_id:null})
      msg='Gol + Asistencia guardados ✓'
    }
    toast(msg)
    S.slotEvPanel=null
    document.getElementById('modal-root').innerHTML=''
    await cargarDatos();await selPartido(S.partidoActivo)
    await recalcPartidoAuto()
    await cargarDatos()
  }else toast('Error al guardar',true)
}

async function guardarFormacionPartido(){
  if(!S.partidoActivo)return
  await patch('partidos',{formacion:S.formacion,titulares:JSON.stringify(S.titulares)},`?id=eq.${S.partidoActivo}`)
  // Auto-calc and save minutaje silently
  const titIds=S.titulares.filter(x=>x)
  if(titIds.length>0){
    const mins=calcMinutajeAuto(titIds,S.evPartido,S.duracion)
    await Promise.all(Object.entries(mins).filter(([,v])=>v>0).map(([jid,minutos])=>
      fetch(`${SB_URL}/rest/v1/minutaje`,{
        method:'POST',
        headers:{...hdrs(),'Prefer':'resolution=merge-duplicates,return=representation'},
        body:JSON.stringify({partido_id:S.partidoActivo,jugador_id:+jid,minutos})
      })
    ))
  }
  toast('Formación y minutaje guardados ✓');await cargarDatos()
}

// Recalcula marcador y minutaje del partido activo en base a los eventos actuales
async function recalcPartidoAuto(){
  if(!S.partidoActivo)return
  // Marcador: contar eventos Gol del partido
  const gf=S.evPartido.filter(e=>e.tipo==='Gol').length
  // Goles contra: los marcamos manualmente solo si el partido los tiene ya; no los sobreescribimos automáticamente
  // ya que no registramos goles del rival como eventos propios
  await patch('partidos',{goles_favor:gf},`?id=eq.${S.partidoActivo}`)
  // Minutaje
  const titIds=S.titulares.filter(x=>x)
  if(titIds.length>0){
    const mins=calcMinutajeAuto(titIds,S.evPartido,S.duracion)
    await Promise.all(Object.entries(mins).filter(([,v])=>v>0).map(([jid,minutos])=>
      fetch(`${SB_URL}/rest/v1/minutaje`,{
        method:'POST',
        headers:{...hdrs(),'Prefer':'resolution=merge-duplicates,return=representation'},
        body:JSON.stringify({partido_id:S.partidoActivo,jugador_id:+jid,minutos})
      })
    ))
  }
}

async function recalcManual(){
  if(!S.partidoActivo){toast('Selecciona un partido primero',true);return}
  toast('Recalculando...')
  await recalcPartidoAuto()
  await cargarDatos()
  toast('Minutaje y marcador recalculados ✓')
}

async function guardarTitularesAuto(){
  if(!S.partidoActivo)return
  await patch('partidos',{formacion:S.formacion,titulares:JSON.stringify(S.titulares)},`?id=eq.${S.partidoActivo}`)
}

async function selPartido(id){
  S.partidoActivo=id;S.slotSeleccionado=null
  const[evs,part]=await Promise.all([
    get('eventos',`?partido_id=eq.${id}&order=minuto`),
    get('partidos',`?id=eq.${id}`)
  ])
  S.evPartido=Array.isArray(evs)?evs:[]
  if(Array.isArray(part)&&part[0]){
    const p=part[0]
    if(p.formacion)S.formacion=p.formacion
    if(p.titulares){try{S.titulares=JSON.parse(p.titulares)||[]}catch(e){S.titulares=[]}}
  }
  render()
}

async function guardarPartido(){
  if(!S.np.rival.trim()){toast('Ingresa el rival',true);return}
  const r=await post('partidos',S.np)
  if(Array.isArray(r)&&r[0]){
    toast('Partido guardado')
    S.np={rival:'',competencia:'Primera B',condicion:'Local',fecha:hoy(),goles_favor:0,goles_contra:0}
    S.npShow=false;await cargarDatos();await selPartido(r[0].id)
  }else toast('Error al guardar',true)
}

async function agregarEvento(){
  if(!S.partidoActivo){toast('Selecciona un partido',true);return}
  const ev=S.ev
  const r=await post('eventos',{
    partido_id:S.partidoActivo,jugador_id:+ev.jugador_id,tipo:ev.tipo,
    subtipo:['Gol','Asistencia'].includes(ev.tipo)?ev.subtipo:null,
    minuto:+ev.minuto,jugador_sale_id:ev.tipo==='Sustitución'?+ev.jugador_sale_id:null,
  })
  if(Array.isArray(r)&&r[0]){
    let msg='Evento registrado'
    // Si es gol con asistidor, registrar asistencia automáticamente
    if(ev.tipo==='Gol'&&ev.asistidor_id){
      await post('eventos',{
        partido_id:S.partidoActivo,jugador_id:+ev.asistidor_id,tipo:'Asistencia',
        subtipo:ev.asist_subtipo||'Pase',minuto:+ev.minuto,jugador_sale_id:null,
      })
      msg='Gol + Asistencia guardados ✓'
    }
    toast(msg)
    await cargarDatos()
    await selPartido(S.partidoActivo)
    await recalcPartidoAuto()
    await cargarDatos()
  }else toast('Error',true)
}

async function guardarEdicionEvento(){
  if(!S.editEv)return
  const e=S.editEv
  await patch('eventos',{
    minuto:+e.minuto,tipo:e.tipo,
    subtipo:['Gol','Asistencia'].includes(e.tipo)?e.subtipo:null,
    jugador_id:+e.jugador_id,
    jugador_sale_id:e.tipo==='Sustitución'?(+e.jugador_sale_id||null):null,
  },`?id=eq.${e.id}`)
  S.editEv=null
  await cargarDatos()
  await selPartido(S.partidoActivo)
  await recalcPartidoAuto()
  await cargarDatos()
  toast('Evento actualizado ✓')
}

// NOTE: Add to Supabase jugadores table: valor (numeric), nacionalidad (text), notas (text)
function renderPlantilla(){
  let lista=S.filtPos==='todos'?[...S.jugadores]:S.jugadores.filter(j=>j.posicion===S.filtPos)
  if(S.filtEstadoPlantilla!=='todos'){
    const wantLes=S.filtEstadoPlantilla==='lesionado'
    lista=lista.filter(j=>wantLes?S.lesiones.some(l=>l.jugador_id===j.id):!S.lesiones.some(l=>l.jugador_id===j.id))
  }
  const dir=S.ordenDir||'asc'
  const dm=dir==='asc'?1:-1
  if(S.ordenPlantilla==='apellido'){
    lista.sort((a,b)=>{const aa=a.nombre.split(' ').slice(1).join(' ')||a.nombre;const bb=b.nombre.split(' ').slice(1).join(' ')||b.nombre;return aa.localeCompare(bb)*dm})
  }else if(S.ordenPlantilla==='posicion'){
    lista.sort((a,b)=>(a.posicion_especifica||a.posicion).localeCompare(b.posicion_especifica||b.posicion)*dm)
  }else if(S.ordenPlantilla==='zona'){
    const zOrd={POR:0,DEF:1,MED:2,DEL:3}
    lista.sort((a,b)=>((zOrd[a.posicion]||0)-(zOrd[b.posicion]||0))*dm)
  }else if(S.ordenPlantilla==='edad'){
    lista.sort((a,b)=>((a.edad||0)-(b.edad||0))*dm)
  }else if(S.ordenPlantilla==='altura'){
    lista.sort((a,b)=>((a.altura||0)-(b.altura||0))*dm)
  }else if(S.ordenPlantilla==='valor'){
    lista.sort((a,b)=>((a.valor||0)-(b.valor||0))*dm)
  }else if(S.ordenPlantilla==='contrato'){
    lista.sort((a,b)=>(a.contrato_hasta||'9999').localeCompare(b.contrato_hasta||'9999')*dm)
  }else if(S.ordenPlantilla==='pie'){
    lista.sort((a,b)=>(a.pie||'').localeCompare(b.pie||'')*dm)
  }else if(S.ordenPlantilla==='nac'){
    lista.sort((a,b)=>(a.nacionalidad||'').localeCompare(b.nacionalidad||'')*dm)
  }else{
    lista.sort((a,b)=>(a.numero-b.numero)*dm)
  }

  // Stats generales de toda la plantilla
  const tp=S.jugadores
  const conEdad=tp.filter(j=>j.edad)
  const conAlt=tp.filter(j=>j.altura)
  const edadProm=conEdad.length?(tp.reduce((a,j)=>a+(j.edad||0),0)/conEdad.length).toFixed(1):'-'
  const altProm=conAlt.length?Math.round(tp.reduce((a,j)=>a+(j.altura||0),0)/conAlt.length):'-'
  const valorTotal=tp.reduce((a,j)=>a+(j.valor||0),0)
  const nPOR=tp.filter(j=>j.posicion==='POR').length
  const nDEF=tp.filter(j=>j.posicion==='DEF').length
  const nMED=tp.filter(j=>j.posicion==='MED').length
  const nDEL=tp.filter(j=>j.posicion==='DEL').length
  const nDiestros=tp.filter(j=>j.pie==='Derecho').length

  const nAmbi=tp.filter(j=>j.pie==='Ambidiestro').length

  const posEspOpts=Object.entries(POS_GRUPOS).map(([g,lst])=>
    `<optgroup label="${g==='POR'?'Portería':g==='DEF'?'Defensa':g==='MED'?'Mediocampo':'Delantera'}">`+
    lst.map(p=>`<option value="${p}">${p}</option>`).join('')+`</optgroup>`

  const addForm=S.addJugShow?`<div class="panel" style="margin-bottom:12px">

      <div class="fr2">

async function guardarJugador(){
  const j=S.addJug
  if(!j.nombre.trim()||!j.numero){toast('Completa nombre y número',true);return}
  const r=await post('jugadores',{
    nombre:j.nombre.trim(),numero:+j.numero,edad:+j.edad,posicion:j.posicion,
    posicion_especifica:j.posicion_especifica||null,
    pie:j.pie,altura:+j.altura||null,
    club_origen:j.club_origen||null,
    contrato_hasta:j.contrato_hasta||null,
    valor:+j.valor||null,
    nacionalidad:j.nacionalidad||'Chilena',
    notas:j.notas||null,
  })
  if(Array.isArray(r)&&r[0]){
    toast('Jugador agregado')
    S.addJugShow=false
    S.addJug={numero:'',nombre:'',posicion:'MED',posicion_especifica:'',edad:22,pie:'Derecho',altura:'',club_origen:'',contrato_hasta:'',valor:'',nacionalidad:'Chilena',notas:''}
    await cargarDatos()
  }else toast('Error',true)
}

// ===== PARTIDOS =====
function renderPartidos(){
  const fc=S.filtComp
  const lista=fc==='todos'?S.partidos:S.partidos.filter(p=>p.competencia===fc)
  const pg=lista.filter(p=>p.goles_favor>p.goles_contra).length
  const pe=lista.filter(p=>p.goles_favor===p.goles_contra).length
  const pp=lista.filter(p=>p.goles_favor<p.goles_contra).length
  const gf=lista.reduce((a,p)=>a+p.goles_favor,0)
  const gc=lista.reduce((a,p)=>a+p.goles_contra,0)
  const pz=lista.filter(p=>p.goles_contra===0).length
  const racha=[...lista].slice(-5).map(p=>p.goles_favor>p.goles_contra?'W':p.goles_favor===p.goles_contra?'D':'L')

  const cards=[...lista].reverse().map(p=>{
    const res=p.goles_favor>p.goles_contra?'W':p.goles_favor===p.goles_contra?'D':'L'
    const rb=res==='W'?'bv':res==='D'?'ba':'br'
    const rl=res==='W'?'V':res==='D'?'E':'D'
    const borderColor=res==='W'?'var(--vc)':res==='D'?'var(--am)':'var(--ro)'
    const pts=res==='W'?3:res==='D'?1:0
    const goles=S.eventos.filter(e=>e.partido_id===p.id&&e.tipo==='Gol')
    const golesHtml=goles.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(16,24,32,0.06)">
      ${goles.map(e=>{
        const jj=S.jugadores.find(x=>x.id===e.jugador_id)
        const ini=(jj?.nombre||'?').split(' ').map(w=>w[0]).join('').slice(0,2)
        return`<div style="display:flex;align-items:center;gap:3px;background:rgba(16,24,32,0.035);border-radius:5px;padding:2px 6px">
          <div style="width:16px;height:16px;border-radius:50%;overflow:hidden;background:rgba(16,24,32,0.08);display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:800;flex-shrink:0">
            ${jj?.foto_url?`<img src="${jj.foto_url}" style="width:100%;height:100%;object-fit:cover">`:ini}
          </div>
          <span style="font-size:10px;color:var(--blanco)">⚽ ${jugApellido(e.jugador_id)}</span>
          <span style="font-size:9px;color:var(--gris)">${e.minuto}'</span>
        </div>`
      }).join('')}
    </div>`:''
    return`<div class="pcard" style="cursor:default;border-left:3px solid ${borderColor};padding:7px 12px">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="badge ${rb}" style="font-size:11px;font-weight:900;min-width:20px;text-align:center;flex-shrink:0">${rl}</span>
        <div style="font-size:12px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.rival}</div>
        <div style="font-size:15px;font-weight:900;color:${borderColor};white-space:nowrap;flex-shrink:0">${p.goles_favor}—${p.goles_contra}</div>
        <span class="badge ${p.condicion==='Local'?'baz':'bg'}" style="font-size:8px;flex-shrink:0">${p.condicion==='Local'?'L':'V'}</span>
        <span class="badge bg" style="font-size:8px;flex-shrink:0">${p.competencia==='Primera B'?'1B':'CC'}</span>
        <span style="font-size:9px;color:var(--gris);white-space:nowrap;flex-shrink:0">${p.fecha}</span>
        ${S.isAdmin?`<button class="bsm" style="padding:2px 6px;font-size:9px;flex-shrink:0" onclick="abrirEditarPartido(${p.id})">✏️</button>`:''}
      </div>
      ${golesHtml}
    </div>`
  }).join('')

  return`<div class="content">
    ${pageHero('PARTIDOS')}
    <div class="tabs">${['todos','Primera B','Copa Chile'].map(c=>`<button class="tab ${fc===c?'on':''}" onclick="S.filtComp='${c}';render()">${c==='todos'?'Todos':c}</button>`).join('')}</div>
    <div class="g4">
      <div class="mc verde"><div class="mc-l">Puntos</div><div class="mc-v">${pg*3+pe}</div></div>
      <div class="mc"><div class="mc-l">P / E / D</div><div class="mc-v">${pg}-${pe}-${pp}</div></div>
      <div class="mc"><div class="mc-l">Goles F/C</div><div class="mc-v">${gf}/${gc}</div></div>
      <div class="mc verde"><div class="mc-l">Porterías 0</div><div class="mc-v">${pz}</div></div>
    </div>
    <div class="panel" style="margin-bottom:12px">
      <div class="ph"><span class="pt">Últimos 5 partidos</span></div>
      <div class="pb" style="display:flex;gap:4px;align-items:center">
        ${racha.length?racha.map(r=>`<span class="form-dot ${r}">${r}</span>`).join(''):'<span style="color:var(--gris);font-size:11px">Sin partidos</span>'}
      </div>
    </div>
    ${lista.length?cards:'<div class="empty">Sin partidos registrados</div>'}
  </div>`
}

// ===== ESTADÍSTICAS =====
function renderEstadisticas(){
  const fc=S.filtCompEst
  const partsFilt=fc==='todos'?S.partidos:S.partidos.filter(p=>p.competencia===fc)
  const pidsFilt=new Set(partsFilt.map(p=>p.id))
  const evsFilt=S.eventos.filter(e=>pidsFilt.has(e.partido_id))

  const statsJug=S.jugadores.map(j=>{
    const evJ=evsFilt.filter(e=>e.jugador_id===j.id)
    const goles=evJ.filter(e=>e.tipo==='Gol').length
    const asist=evJ.filter(e=>e.tipo==='Asistencia').length

function agregarTipoGol(){
  const val=S.nuevoTipoGol.trim()
  if(!val){toast('Escribe un nombre',true);return}
  if(TIPOS_GOL.includes(val)){toast('Ese tipo ya existe',true);return}
  TIPOS_GOL.push(val);S.nuevoTipoGol='';render();toast('Tipo "'+val+'" agregado')
}

function eliminarTipoGol(i){
  const tipo=TIPOS_GOL[i]
  if(S.eventos.some(e=>e.subtipo===tipo&&e.tipo==='Gol')){toast('No se puede eliminar — hay goles con este tipo',true);return}
  TIPOS_GOL.splice(i,1);render();toast('Tipo eliminado')
}

async function guardarLesion(){
  const l=S.addLes
  if(!l.jugador_id){toast('Selecciona jugador',true);return}
  const r=await post('lesiones',{...l,jugador_id:+l.jugador_id,semanas_recuperacion:+l.semanas_recuperacion})
  if(Array.isArray(r)&&r[0]){toast('Lesión registrada');S.lesShow=false;await cargarDatos()}
  else toast('Error',true)
}

async function darAlta(id){
  const r=await patch('lesiones',{alta:true},`?id=eq.${id}`)
  // Supabase devuelve el registro actualizado o un objeto de error
  if(r&&r.code){toast('Error Supabase: '+r.message,true);console.error('darAlta error:',r);return}
  if(!Array.isArray(r)||!r.length){
    // Fallback: intentar con POST upsert por si hay problema de RLS en PATCH
    console.warn('darAlta: PATCH no retornó filas, re-intentando fetch directo...',r)
    toast('Actualizando...', false)
  }
  await cargarDatos()
  const sigueActiva=S.lesiones.find(l=>l.id===id)
  if(sigueActiva){
    toast('⚠️ No se pudo dar el alta — revisa permisos UPDATE en tabla lesiones (Supabase)',true)
  } else {
    toast('Jugador dado de alta ✅')
  }
}

function aplicarPreset(i){Object.assign(S.consulta,PRESETS_CONSULTA[i].f);render()}
function limpiarConsulta(){S.consulta={tipoEv:'todos',posicion:'todos',posEsp:'todos',condicion:'todos',competencia:'todos',resultado:'todos',periodo:'todos'};render()}

function renderConsultas(){
  const c=S.consulta
  const selStyle='background:rgba(16,24,32,0.035);border:1px solid var(--borde2);border-radius:6px;padding:6px 10px;color:var(--blanco);font-size:11px;font-family:var(--font);cursor:pointer'

  // Opciones dinámicas
  const posEspUnicas=[...new Set(S.jugadores.map(j=>j.posicion_especifica).filter(Boolean))].sort()
  const compUnicas=[...new Set(S.partidos.map(p=>p.competencia).filter(Boolean))].sort()

  // Filtros: todos los eventos con su contexto de partido
  let evsFiltrados=S.eventos.map(ev=>{
    const partido=S.partidos.find(p=>p.id===ev.partido_id)
    const jugador=S.jugadores.find(j=>j.id===ev.jugador_id)
    return{...ev,partido,jugador}
  }).filter(ev=>ev.partido&&ev.jugador)

  // Aplicar filtros AND
  if(c.tipoEv!=='todos')evsFiltrados=evsFiltrados.filter(ev=>ev.tipo===c.tipoEv)
  if(c.posicion!=='todos')evsFiltrados=evsFiltrados.filter(ev=>ev.jugador.posicion===c.posicion)
  if(c.posEsp!=='todos')evsFiltrados=evsFiltrados.filter(ev=>ev.jugador.posicion_especifica===c.posEsp)
  if(c.condicion!=='todos')evsFiltrados=evsFiltrados.filter(ev=>ev.partido.condicion===c.condicion)
  if(c.competencia!=='todos')evsFiltrados=evsFiltrados.filter(ev=>ev.partido.competencia===c.competencia)
  if(c.resultado!=='todos'){
    evsFiltrados=evsFiltrados.filter(ev=>{
      const p=ev.partido
      const res=p.goles_favor>p.goles_contra?'V':p.goles_favor===p.goles_contra?'E':'D'
      return res===c.resultado
    })
  }
  if(c.periodo!=='todos'){
    evsFiltrados=evsFiltrados.filter(ev=>{
      const min=ev.minuto||0
      if(c.periodo==='0-30')return min<=30
      if(c.periodo==='31-60')return min>30&&min<=60
      if(c.periodo==='61+')return min>60
      return true
    })
  }

  // Filtro especial para preset "Goles de cabeza" — si tipoEv=Gol y no hay otro filtro especial, chequeamos subtipo si el preset lo indica
  // (El preset de cabeza setea tipoEv=Gol sin filtro especial extra, pero podemos filtrar por subtipo si se detecta)

  // Resumen
  const totalEvs=evsFiltrados.length
  const jugInvolucrados=new Set(evsFiltrados.map(ev=>ev.jugador_id)).size
  const partsInvolucrados=new Set(evsFiltrados.map(ev=>ev.partido_id)).size

  // Ranking por jugador
  const jugMap={}
  evsFiltrados.forEach(ev=>{
    if(!jugMap[ev.jugador_id])jugMap[ev.jugador_id]={jugador:ev.jugador,evs:[]}
    jugMap[ev.jugador_id].evs.push(ev)
  })
  const ranking=Object.values(jugMap).sort((a,b)=>b.evs.length-a.evs.length)

  // Color por tipo de evento
  function evColor(tipo){
    if(tipo==='Gol')return'var(--vc)'
    if(tipo==='Asistencia')return'var(--az)'
    if(tipo==='Amarilla')return'var(--am)'
    if(tipo==='Roja')return'var(--ro)'
    return'var(--gris)'
  }

  // Presets rápidos
  const presetsHtml=PRESETS_CONSULTA.map((p,i)=>`<button onclick="aplicarPreset(${i})"
    style="padding:4px 12px;border-radius:20px;border:1px solid var(--borde2);background:rgba(16,24,32,0.035);color:var(--gris);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;transition:all .15s"
    onmouseover="this.style.borderColor='var(--vc)';this.style.color='var(--vc)'"
    onmouseout="this.style.borderColor='var(--borde2)';this.style.color='var(--gris)'">${p.l}</button>`).join('')

  // Ranking HTML
  const rankingHtml=ranking.length?ranking.map(({jugador:j,evs})=>{
    const ini=j.nombre.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase()
    const color=evColor(evs[0]?.tipo||'todos')
    const evsList=evs.sort((a,b)=>a.partido?.fecha?.localeCompare(b.partido?.fecha||'')||0).map(ev=>{
      const p=ev.partido
      const condLabel=p.condicion==='Local'?'Local':'Visita'
      const fecha=p.fecha||''
      return`<div style="font-size:10px;color:var(--gris);padding:2px 0 2px 52px;border-bottom:1px solid rgba(200,21,39,0.05)">
        ${ICONOS[ev.tipo]||'•'} vs <strong style="color:var(--blanco)">${p.rival}</strong>
        <span style="color:var(--muted)">(${condLabel})</span>
        <span style="color:var(--am);font-weight:700"> ${ev.minuto}'</span>
        <span style="color:var(--muted);margin-left:4px">${fecha}</span>
        ${ev.subtipo?`<span style="font-size:9px;color:var(--muted)"> · ${ev.subtipo}</span>`:''}
      </div>`
    }).join('')
    return`<div style="background:rgba(16,24,32,0.028);border:1px solid var(--borde);border-radius:8px;margin-bottom:8px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 14px">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--vo);border:2px solid var(--v);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--goldbr);flex-shrink:0;overflow:hidden">
          ${j.foto_url?`<img src="${j.foto_url}" style="width:100%;height:100%;object-fit:cover">`:ini}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:800;color:var(--blanco)">${j.numero} ${j.nombre.trim().split(' ').slice(1).join(' ')||j.nombre}</div>
          <span class="pos-${j.posicion}" style="font-size:10px">${j.posicion_especifica?.split(' ')[0]||j.posicion}</span>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:28px;font-weight:900;color:${color};line-height:1">${evs.length}</div>
          <div style="font-size:9px;color:var(--gris)">${evs.length===1?'evento':'eventos'}</div>
        </div>
      </div>
      ${evsList}
    </div>`
  }).join(''):`<div class="empty" style="padding:40px">Sin datos para estos filtros</div>`

  return`<div class="content">
    <div class="panel" style="margin-bottom:12px">
      <div class="ph"><span class="pt">Filtros de consulta</span>
        <button class="bsm" onclick="limpiarConsulta()">Limpiar filtros</button>
      </div>
      <div class="pb">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px">
          <div class="fg" style="margin-bottom:0">
            <label>Evento</label>
            <select style="${selStyle};width:100%" onchange="S.consulta.tipoEv=this.value;render()">
              <option value="todos" ${c.tipoEv==='todos'?'selected':''}>Todos</option>
              ${['Gol','Asistencia','Amarilla','Roja','Sustitución'].map(t=>`<option value="${t}" ${c.tipoEv===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div class="fg" style="margin-bottom:0">
            <label>Posición</label>
            <select style="${selStyle};width:100%" onchange="S.consulta.posicion=this.value;S.consulta.posEsp='todos';render()">
              <option value="todos" ${c.posicion==='todos'?'selected':''}>Todos</option>
              ${['POR','DEF','MED','DEL'].map(p=>`<option value="${p}" ${c.posicion===p?'selected':''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="fg" style="margin-bottom:0">
            <label>Pos. específica</label>
            <select style="${selStyle};width:100%" onchange="S.consulta.posEsp=this.value;render()">
              <option value="todos" ${c.posEsp==='todos'?'selected':''}>Todas</option>
              ${(c.posicion==='todos'?posEspUnicas:(POS_GRUPOS[c.posicion]||[])).map(p=>`<option value="${p}" ${c.posEsp===p?'selected':''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="fg" style="margin-bottom:0">
            <label>Condición</label>
            <select style="${selStyle};width:100%" onchange="S.consulta.condicion=this.value;render()">
              <option value="todos" ${c.condicion==='todos'?'selected':''}>Todos</option>
              ${['Local','Visita'].map(v=>`<option value="${v}" ${c.condicion===v?'selected':''}>${v}</option>`).join('')}
            </select>
          </div>
          <div class="fg" style="margin-bottom:0">
            <label>Competencia</label>
            <select style="${selStyle};width:100%" onchange="S.consulta.competencia=this.value;render()">
              <option value="todos" ${c.competencia==='todos'?'selected':''}>Todas</option>
              ${compUnicas.map(comp=>`<option value="${comp}" ${c.competencia===comp?'selected':''}>${comp}</option>`).join('')}
            </select>
          </div>
          <div class="fg" style="margin-bottom:0">
            <label>Resultado</label>
            <select style="${selStyle};width:100%" onchange="S.consulta.resultado=this.value;render()">
              <option value="todos" ${c.resultado==='todos'?'selected':''}>Todos</option>
              <option value="V" ${c.resultado==='V'?'selected':''}>Victoria (V)</option>
              <option value="E" ${c.resultado==='E'?'selected':''}>Empate (E)</option>
              <option value="D" ${c.resultado==='D'?'selected':''}>Derrota (D)</option>
            </select>
          </div>
          <div class="fg" style="margin-bottom:0">
            <label>Período</label>
            <select style="${selStyle};width:100%" onchange="S.consulta.periodo=this.value;render()">
              <option value="todos" ${c.periodo==='todos'?'selected':''}>Todos</option>
              <option value="0-30" ${c.periodo==='0-30'?'selected':''}>0-30 min</option>
              <option value="31-60" ${c.periodo==='31-60'?'selected':''}>31-60 min</option>
              <option value="61+" ${c.periodo==='61+'?'selected':''}>61+ min</option>
            </select>
          </div>
        </div>
        <div style="margin-top:4px">
          <div style="font-size:10px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:700">Presets rápidos:</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${presetsHtml}</div>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-bottom:12px">
      <div class="ph">
        <span class="pt">Resultados</span>
        <span style="font-size:11px;color:var(--gris)">${totalEvs} evento${totalEvs!==1?'s':''} encontrado${totalEvs!==1?'s':''}</span>
      </div>
      <div class="pb">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
          <div class="mc"><div class="mc-l">Eventos</div><div class="mc-v" style="color:var(--vc)">${totalEvs}</div></div>
          <div class="mc"><div class="mc-l">Jugadores</div><div class="mc-v">${jugInvolucrados}</div></div>
          <div class="mc"><div class="mc-l">Partidos</div><div class="mc-v">${partsInvolucrados}</div></div>
        </div>
        ${rankingHtml}
      </div>
    </div>
  </div>`
}

async function ligaGet(table,params){return get(table,params)}

async function cargarLiga(){
  const[equipos,goles,jugadores,partidosAll,sanciones]=await Promise.all([
    ligaGet('liga_equipos','?select=id,nombre&order=nombre'),
    ligaGet('liga_goles','?select=jugador_id,autogol&autogol=eq.false&limit=1000'),
    ligaGet('liga_jugadores','?select=id,apellido,nombre,equipo_id,sub21,minutos_oficial_temporada,fecha_nacimiento&limit=1000'),
    ligaGetAll('liga_partidos','id,jornada,fecha_hora,equipo_local_id,equipo_visita_id,goles_local,goles_visita'),
    ligaGet('liga_sanciones','?select=id,equipo_id,puntos,motivo,fecha&order=fecha.desc'),
  ])
  S.liga.equipos=Array.isArray(equipos)?equipos:[]
  const temuco=S.liga.equipos.find(e=>e.nombre==='Deportes Temuco')
  S.liga.temucoId=temuco?temuco.id:null
  S.liga.sanciones=Array.isArray(sanciones)?sanciones:[]

  const jugadas=(Array.isArray(partidosAll)?partidosAll:[]).filter(p=>p.goles_local!=null&&p.goles_visita!=null)
  // Partidos pospuestos sin fecha reagendada quedan con fecha_hora null y
  // pueden tener una jornada más baja que la actual — no cuentan como
  // "próximo partido" hasta que el fixture les asigne una fecha real.
  const programadasConFecha=(Array.isArray(partidosAll)?partidosAll:[])
    .filter(p=>p.goles_local==null&&p.fecha_hora)
    .sort((a,b)=>new Date(a.fecha_hora)-new Date(b.fecha_hora))
  const golesLiga=jugadas.reduce((a,p)=>a+p.goles_local+p.goles_visita,0)
  S.liga.infoGeneral={
    equipos:S.liga.equipos.length,
    partidosJugados:jugadas.length,
    jornadaActual:jugadas.length?Math.max(...jugadas.map(p=>p.jornada||0)):0,
    jornadaProxima:programadasConFecha.length?programadasConFecha[0].jornada:null,
    golesTotales:golesLiga,
    promedioGoles:jugadas.length?+(golesLiga/jugadas.length).toFixed(2):0,
  }

  const st={}
  S.liga.equipos.forEach(e=>{st[e.id]={id:e.id,nombre:e.nombre,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0,descuento:0}})
  jugadas.forEach(p=>{
    const l=st[p.equipo_local_id],v=st[p.equipo_visita_id]
    if(!l||!v)return
    l.pj++;v.pj++
    l.gf+=p.goles_local;l.gc+=p.goles_visita
    v.gf+=p.goles_visita;v.gc+=p.goles_local
    if(p.goles_local>p.goles_visita){l.pg++;l.pts+=3;v.pp++}
    else if(p.goles_local<p.goles_visita){v.pg++;v.pts+=3;l.pp++}
    else{l.pe++;v.pe++;l.pts++;v.pts++}
  })
  S.liga.sanciones.forEach(s=>{
    const e=st[s.equipo_id];if(!e)return
    e.descuento+=s.puntos;e.pts-=s.puntos
  })
  S.liga.tabla=Object.values(st).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc))

  const jugArr=Array.isArray(jugadores)?jugadores:[]
  const jugMap={};jugArr.forEach(j=>{jugMap[j.id]=j})
  const conteo={}
  ;(Array.isArray(goles)?goles:[]).forEach(g=>{conteo[g.jugador_id]=(conteo[g.jugador_id]||0)+1})
  S.liga.goleadores=Object.entries(conteo).map(([jid,n])=>{
    const j=jugMap[jid];const eq=j?S.liga.equipos.find(e=>e.id===j.equipo_id):null
    return{goles:n,nombre:j?`${j.nombre} ${j.apellido}`:'?',equipo:eq?eq.nombre:'?',crest:eq?crestUrl(eq.nombre):''}
  }).sort((a,b)=>b.goles-a.goles).slice(0,12)

  S.liga.sub21=jugArr.filter(j=>j.equipo_id===S.liga.temucoId&&j.sub21)
    .sort((a,b)=>(b.minutos_oficial_temporada||0)-(a.minutos_oficial_temporada||0))

  if(S.liga.temucoId){
    const partidos=await ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${S.liga.temucoId},equipo_visita_id.eq.${S.liga.temucoId})&goles_local=not.is.null&select=id,jornada,fecha_hora,estadio,equipo_local_id,local:liga_equipos!liga_partidos_equipo_local_id_fkey(nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(nombre),goles_local,goles_visita&order=fecha_hora.desc&limit=1`)
    S.liga.ultimo=Array.isArray(partidos)&&partidos[0]?partidos[0]:null
  }
  S.liga.loaded=true
  if(S.pag==='inicio'||S.pag==='tabla')render()
}

  </div>`

async function verRival(id){
  if(S.liga.rivalSel===id){S.liga.rivalSel=null;render();return}
  S.liga.rivalSel=id;S.liga.rivalPartidos=null;render()

async function verPartidoLiga(id,volverA){
  if(!id)return
  S.partidoLiga={loaded:false,id,volverA:volverA||S.pag,data:null,eventos:[]}
  S.pag='partido'
  render()
  const[partidos,goles,tarjetas,sustituciones]=await Promise.all([
    ligaGet('liga_partidos',`?id=eq.${id}&select=id,jornada,fecha_hora,estadio,arbitro,equipo_local_id,equipo_visita_id,goles_local,goles_visita,local:liga_equipos!liga_partidos_equipo_local_id_fkey(id,nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(id,nombre)`),
    ligaGet('liga_goles',`?partido_id=eq.${id}&select=equipo_id,minuto,minuto_extra,penal,autogol,jugador:liga_jugadores!liga_goles_jugador_id_fkey(nombre,apellido)`),
    ligaGet('liga_tarjetas',`?partido_id=eq.${id}&select=equipo_id,tipo,minuto,minuto_extra,motivo,segunda_amarilla,jugador:liga_jugadores!liga_tarjetas_jugador_id_fkey(nombre,apellido)`),
    ligaGet('liga_sustituciones',`?partido_id=eq.${id}&select=equipo_id,minuto,minuto_extra,entra:liga_jugadores!liga_sustituciones_entra_jugador_id_fkey(nombre,apellido),sale:liga_jugadores!liga_sustituciones_sale_jugador_id_fkey(nombre,apellido)`),
  ])
  if(S.partidoLiga.id!==id)return // el usuario ya navegó a otro partido
  S.partidoLiga.data=Array.isArray(partidos)&&partidos[0]?partidos[0]:null
  const evGoles=(Array.isArray(goles)?goles:[]).map(g=>({tipo:g.autogol?'autogol':'gol',minuto:g.minuto,minuto_extra:g.minuto_extra||0,equipo_id:g.equipo_id,jugador:g.jugador?`${g.jugador.nombre} ${g.jugador.apellido}`:'—',penal:g.penal}))
  const evTarjetas=(Array.isArray(tarjetas)?tarjetas:[]).map(t=>({tipo:t.tipo==='roja'?'roja':(t.segunda_amarilla?'segunda':'amarilla'),minuto:t.minuto,minuto_extra:t.minuto_extra||0,equipo_id:t.equipo_id,jugador:t.jugador?`${t.jugador.nombre} ${t.jugador.apellido}`:'—',motivo:t.motivo}))
  const evSubs=(Array.isArray(sustituciones)?sustituciones:[]).map(s=>({tipo:'cambio',minuto:s.minuto,minuto_extra:s.minuto_extra||0,equipo_id:s.equipo_id,entra:s.entra?`${s.entra.nombre} ${s.entra.apellido}`:'—',sale:s.sale?`${s.sale.nombre} ${s.sale.apellido}`:'—'}))
  S.partidoLiga.eventos=[...evGoles,...evTarjetas,...evSubs].sort((a,b)=>(a.minuto+a.minuto_extra*0.01)-(b.minuto+b.minuto_extra*0.01))
  S.partidoLiga.loaded=true
  if(S.pag==='partido')render()
}

// ===== RIVALES (calendario + notas de scouting) =====
async function statsEquipoLiga(equipoId){
  const[partidos,goles,tarjetas,jugadores]=await Promise.all([
    ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${equipoId},equipo_visita_id.eq.${equipoId})&select=equipo_local_id,equipo_visita_id,goles_local,goles_visita&goles_local=not.is.null`),
    ligaGet('liga_goles',`?equipo_id=eq.${equipoId}&autogol=eq.false&select=minuto,minuto_extra`),
    ligaGet('liga_tarjetas',`?equipo_id=eq.${equipoId}&select=tipo`),
    ligaGet('liga_jugadores',`?equipo_id=eq.${equipoId}&sub21=eq.true&select=minutos_oficial_temporada`),
  ])
  const s={pj:0,gf:0,gc:0,am:0,rj:0,pjLocal:0,ptsLocal:0,pjVisita:0,ptsVisita:0,golesDescuento:0}
  ;(Array.isArray(partidos)?partidos:[]).forEach(p=>{
    const esLocal=p.equipo_local_id===equipoId
    s.pj++
    s.gf+=esLocal?p.goles_local:p.goles_visita
    s.gc+=esLocal?p.goles_visita:p.goles_local
    if(esLocal){s.pjLocal++;s.ptsLocal+=p.goles_local>p.goles_visita?3:p.goles_local===p.goles_visita?1:0}
    else{s.pjVisita++;s.ptsVisita+=p.goles_visita>p.goles_local?3:p.goles_local===p.goles_visita?1:0}
  })
  ;(Array.isArray(goles)?goles:[]).forEach(g=>{if(g.minuto_extra>0&&(g.minuto===45||g.minuto===90))s.golesDescuento++})
  const golesTotal=Array.isArray(goles)?goles.length:0
  ;(Array.isArray(tarjetas)?tarjetas:[]).forEach(t=>{if(t.tipo==='amarilla')s.am++;else if(t.tipo==='roja')s.rj++})
  const sub21Min=(Array.isArray(jugadores)?jugadores:[]).reduce((a,j)=>a+(j.minutos_oficial_temporada||0),0)
  return{
    pj:s.pj,
    gfPP:s.pj?+(s.gf/s.pj).toFixed(2):0,
    gcPP:s.pj?+(s.gc/s.pj).toFixed(2):0,
    amPP:s.pj?+(s.am/s.pj).toFixed(2):0,
    rjPP:s.pj?+(s.rj/s.pj).toFixed(2):0,
    pppLocal:s.pjLocal?+(s.ptsLocal/s.pjLocal).toFixed(2):0,
    pppVisita:s.pjVisita?+(s.ptsVisita/s.pjVisita).toFixed(2):0,
    pctDescuento:golesTotal?+((s.golesDescuento/golesTotal)*100).toFixed(1):0,
    sub21Min,
  }
}

async function cargarRivales(){
  if(!S.liga.loaded)await cargarLiga()
  const[notas,proximo]=await Promise.all([
    ligaGet('liga_notas_rivales','?select=id,equipo_id,texto,autor,created_at&order=created_at.desc&limit=500'),
    S.liga.temucoId?ligaGet('liga_partidos',`?or=(equipo_local_id.eq.${S.liga.temucoId},equipo_visita_id.eq.${S.liga.temucoId})&goles_local=is.null&select=id,jornada,fecha_hora,estadio,equipo_local_id,local:liga_equipos!liga_partidos_equipo_local_id_fkey(id,nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(id,nombre)&order=fecha_hora.asc&limit=1`):Promise.resolve([]),
  ])
  S.rivales.notas=Array.isArray(notas)?notas:[]
  S.rivales.proximo=Array.isArray(proximo)&&proximo[0]?proximo[0]:null
  S.rivales.loaded=true
  render()
  if(S.rivales.proximo){
    const p=S.rivales.proximo
    const rivalId=p.equipo_local_id===S.liga.temucoId?p.visita.id:p.local.id
    const[statsTemuco,statsRival]=await Promise.all([statsEquipoLiga(S.liga.temucoId),statsEquipoLiga(rivalId)])
    S.rivales.comparacion={temuco:statsTemuco,rival:statsRival}
    if(S.pag==='rivales')render()
  }
}

function filaComparacion(label,vT,vR,fmt,masEsMejor=true){
  fmt=fmt||(v=>v)
  const mejor=vT===vR?null:(masEsMejor?(vT>vR?'t':'r'):(vT<vR?'t':'r'))
  const total=Math.max(vT+vR,0.01)
  return`<div style="display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--borde)">
    <div style="text-align:right;font-weight:800;font-size:13px;color:${mejor==='t'?'var(--v)':'var(--blanco)'}">${fmt(vT)}</div>
    <div>
      <div style="font-size:9.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-bottom:3px">${label}</div>
      <div style="display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--borde)">
        <div style="width:${(vT/total)*100}%;background:${mejor==='t'?'var(--v)':'var(--borde2)'}"></div>
        <div style="width:${(vR/total)*100}%;background:${mejor==='r'?'var(--az)':'var(--borde2)'}"></div>
      </div>
    </div>
    <div style="text-align:left;font-weight:800;font-size:13px;color:${mejor==='r'?'var(--az)':'var(--blanco)'}">${fmt(vR)}</div>
  </div>`
}

// ===== ANÁLISIS (comparativa liga con gráficos) =====
async function cargarAnalisis(){
  const[equipos,partidos,goles,tarjetas,jugadores]=await Promise.all([
    ligaGet('liga_equipos','?select=id,nombre&order=nombre'),
    ligaGet('liga_partidos','?goles_local=not.is.null&select=id,equipo_local_id,equipo_visita_id,goles_local,goles_visita&limit=1000'),
    ligaGetAll('liga_goles','equipo_id,autogol,minuto,minuto_extra'),
    ligaGetAll('liga_tarjetas','equipo_id,tipo'),
    ligaGetAll('liga_jugadores','equipo_id,sub21,minutos_oficial_temporada'),
  ])
  S.analisis.equipos=Array.isArray(equipos)?equipos:[]
  S.analisis.partidos=Array.isArray(partidos)?partidos:[]
  S.analisis.goles=Array.isArray(goles)?goles.filter(g=>!g.autogol):[]
  S.analisis.tarjetas=Array.isArray(tarjetas)?tarjetas:[]
  S.analisis.jugadores=Array.isArray(jugadores)?jugadores:[]
  S.analisis.seleccion=new Set(S.analisis.equipos.map(e=>e.id))
  S.analisis.loaded=true
  if(S.pag==='analisis')render()
}

// El servidor limita a ~1000 filas por respuesta pase lo que pase con
// ?limit=, así que para tablas grandes (goles, tarjetas, alineaciones)
// paginamos con Range hasta agotarlas.
async function ligaGetAll(table,select){
  let all=[],offset=0
  const page=1000
  while(true){
    const r=await fetch(`${SB_URL}/rest/v1/${table}?select=${select}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+AUTH_TOKEN,Range:`${offset}-${offset+page-1}`}})
    const chunk=await r.json()
    if(!Array.isArray(chunk))break
    all=all.concat(chunk)
    if(chunk.length<page)break
    offset+=page
  }
  return all
}

function statsAnalisis(){
  const temuco=S.analisis.equipos.find(e=>e.nombre==='Deportes Temuco')
  const stat={}
  S.analisis.equipos.forEach(e=>{stat[e.id]={id:e.id,nombre:e.nombre,pj:0,gf:0,gc:0,am:0,rj:0,pjLocal:0,ptsLocal:0,pjVisita:0,ptsVisita:0,golesTotal:0,golesDescuento:0,sub21Min:0}})
  S.analisis.partidos.forEach(p=>{
    const l=stat[p.equipo_local_id],v=stat[p.equipo_visita_id]
    if(!l||!v)return
    l.pj++;v.pj++;l.gf+=p.goles_local;l.gc+=p.goles_visita;v.gf+=p.goles_visita;v.gc+=p.goles_local
    l.pjLocal++;v.pjVisita++
    const ptsL=p.goles_local>p.goles_visita?3:p.goles_local===p.goles_visita?1:0
    const ptsV=p.goles_visita>p.goles_local?3:p.goles_local===p.goles_visita?1:0
    l.ptsLocal+=ptsL;v.ptsVisita+=ptsV
  })
  S.analisis.tarjetas.forEach(t=>{
    const e=stat[t.equipo_id];if(!e)return
    if(t.tipo==='amarilla')e.am++;else if(t.tipo==='roja')e.rj++
  })
  S.analisis.goles.forEach(g=>{
    const e=stat[g.equipo_id];if(!e)return
    e.golesTotal++
    if(g.minuto_extra>0&&(g.minuto===45||g.minuto===90))e.golesDescuento++
  })
  S.analisis.jugadores.forEach(j=>{
    const e=stat[j.equipo_id];if(!e||!j.sub21)return
    e.sub21Min+=j.minutos_oficial_temporada||0
  })
  return Object.values(stat).map(e=>({
    ...e,
    gfPP:e.pj?+(e.gf/e.pj).toFixed(2):0,
    gcPP:e.pj?+(e.gc/e.pj).toFixed(2):0,
    amPP:e.pj?+(e.am/e.pj).toFixed(2):0,
    rjPP:e.pj?+(e.rj/e.pj).toFixed(2):0,
    pppLocal:e.pjLocal?+(e.ptsLocal/e.pjLocal).toFixed(2):0,
    pppVisita:e.pjVisita?+(e.ptsVisita/e.pjVisita).toFixed(2):0,
    pctDescuento:e.golesTotal?+((e.golesDescuento/e.golesTotal)*100).toFixed(1):0,
    pts:e.ptsLocal+e.ptsVisita,
    ptsPP:e.pj?+((e.ptsLocal+e.ptsVisita)/e.pj).toFixed(2):0,
    isTemuco:temuco&&e.id===temuco.id,
  })).filter(e=>S.analisis.seleccion.has(e.id))
}

function toggleAnalisisEquipo(id){
  if(S.analisis.seleccion.has(id))S.analisis.seleccion.delete(id)
  else S.analisis.seleccion.add(id)
  render()
}

function nombreCorto(n){return n.length>16?n.slice(0,15)+'…':n}

// ---- Barra simple (una serie, Temuco resaltado) ----
function svgBarChart(rows,opts){
  const rowH=28,barH=18,labelW=140,rightPad=50,topPad=6,botPad=6
  const w=720,plotW=w-labelW-rightPad
  const h=rows.length*rowH+topPad+botPad
  if(!rows.length)return`<div class="empty">Selecciona al menos un equipo.</div>`
  const maxVal=Math.max(opts.maxHint||0.01,...rows.map(opts.val))
  const scale=v=>(v/maxVal)*plotW
  let svg=`<svg class="chart-svg" width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`
  const sorted=[...rows].sort((a,b)=>opts.val(b)-opts.val(a))
  sorted.forEach((r,i)=>{
    const y=topPad+i*rowH,cy=y+barH/2
    const val=opts.val(r)
    const bw=Math.max(scale(val),1)
    const color=r.isTemuco?'var(--v)':'var(--gris)'
    svg+=`<text x="${labelW-8}" y="${cy+4}" text-anchor="end" font-size="11" font-weight="${r.isTemuco?800:600}" fill="${r.isTemuco?'var(--v)':'var(--blanco)'}">${nombreCorto(r.nombre)}</text>`
    svg+=`<rect x="${labelW}" y="${cy-barH/2}" width="${bw}" height="${barH}" rx="4" fill="${color}" opacity="${r.isTemuco?1:.55}"><title>${r.nombre}: ${opts.fmt(val)}</title></rect>`
    svg+=`<text x="${labelW+bw+8}" y="${cy+4}" font-size="11" font-weight="700" class="chart-axis">${opts.fmt(val)}</text>`
  })
  svg+=`</svg>`
  return svg
}

// ---- Barra apilada (2 series, ej. amarillas+rojas) ----
function svgStackedChart(rows,segs,opts){
  const rowH=28,barH=18,labelW=140,rightPad=50,topPad=6,botPad=6
  const w=720,plotW=w-labelW-rightPad
  const h=rows.length*rowH+topPad+botPad
  if(!rows.length)return`<div class="empty">Selecciona al menos un equipo.</div>`
  const total=r=>segs.reduce((a,s)=>a+s.val(r),0)
  const maxVal=Math.max(opts.maxHint||0.01,...rows.map(total))
  const scale=v=>(v/maxVal)*plotW
  let svg=`<svg class="chart-svg" width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`
  const sorted=[...rows].sort((a,b)=>total(b)-total(a))
  sorted.forEach((r,i)=>{
    const y=topPad+i*rowH,cy=y+barH/2
    svg+=`<text x="${labelW-8}" y="${cy+4}" text-anchor="end" font-size="11" font-weight="${r.isTemuco?800:600}" fill="${r.isTemuco?'var(--v)':'var(--blanco)'}">${nombreCorto(r.nombre)}</text>`
    let acc=0
    segs.forEach((s,si)=>{
      const val=s.val(r)
      const bx=labelW+scale(acc)+(si>0?1.5:0)
      const bw=Math.max(scale(val)-(si>0?1.5:0),0)
      svg+=`<rect x="${bx}" y="${cy-barH/2}" width="${bw}" height="${barH}" rx="3" fill="${s.color}"><title>${r.nombre} · ${s.label}: ${val}</title></rect>`
      acc+=val
    })
    svg+=`<text x="${labelW+scale(acc)+8}" y="${cy+4}" font-size="11" font-weight="700" class="chart-axis">${total(r).toFixed(2)}</text>`
  })
  svg+=`</svg>`
  return svg
}

// ---- Barras agrupadas (2 series lado a lado, ej. local/visita) ----
function svgGroupedChart(rows,segs,opts){
  const rowH=44,barH=15,gap=2,labelW=140,rightPad=50,topPad=6,botPad=6
  const w=720,plotW=w-labelW-rightPad
  const h=rows.length*rowH+topPad+botPad
  if(!rows.length)return`<div class="empty">Selecciona al menos un equipo.</div>`
  const maxVal=Math.max(opts.maxHint||0.01,...rows.map(r=>Math.max(...segs.map(s=>s.val(r)))))
  const scale=v=>(v/maxVal)*plotW
  let svg=`<svg class="chart-svg" width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`
  const sorted=[...rows].sort((a,b)=>(segs[0].val(b)+segs[1].val(b))-(segs[0].val(a)+segs[1].val(a)))
  sorted.forEach((r,i)=>{
    const y=topPad+i*rowH
    svg+=`<text x="${labelW-8}" y="${y+rowH/2+4}" text-anchor="end" font-size="11" font-weight="${r.isTemuco?800:600}" fill="${r.isTemuco?'var(--v)':'var(--blanco)'}">${nombreCorto(r.nombre)}</text>`
    segs.forEach((s,si)=>{
      const val=s.val(r)
      const by=y+rowH/2-barH-gap/2+si*(barH+gap)
      const bw=Math.max(scale(val),1)
      svg+=`<rect x="${labelW}" y="${by}" width="${bw}" height="${barH}" rx="3" fill="${s.color}"><title>${r.nombre} · ${s.label}: ${val.toFixed(2)}</title></rect>`
      svg+=`<text x="${labelW+bw+6}" y="${by+barH-3}" font-size="10.5" font-weight="700" class="chart-axis">${val.toFixed(2)}</text>`
    })
  })
  svg+=`</svg>`
  return svg
}

// ---- Cuadrante ataque vs defensa (scatter) ----
// ---- Cuadrante genérico X/Y (scatter), puntos = escudo del equipo ----
function svgScatterXY(rows,cfg){
  const pad={l:46,r:24,t:20,b:34},w=560,h=420
  const plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b
  if(!rows.length)return`<div class="empty">Selecciona al menos un equipo.</div>`
  const maxX=Math.max(cfg.xMaxHint||0.01,...rows.map(cfg.xFn))
  const maxY=Math.max(cfg.yMaxHint||0.01,...rows.map(cfg.yFn))
  const x=v=>pad.l+(v/maxX)*plotW
  const y=v=>pad.t+plotH-(v/maxY)*plotH
  const avgX=rows.reduce((a,r)=>a+cfg.xFn(r),0)/rows.length
  const avgY=rows.reduce((a,r)=>a+cfg.yFn(r),0)/rows.length
  let svg=`<svg class="chart-svg" width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`
  for(let i=0;i<=4;i++){
    const gx=pad.l+plotW*i/4
    svg+=`<line x1="${gx}" y1="${pad.t}" x2="${gx}" y2="${pad.t+plotH}" class="chart-grid"/>`
    svg+=`<text x="${gx}" y="${pad.t+plotH+16}" text-anchor="middle" class="chart-axis">${cfg.xFmt(maxX*i/4)}</text>`
    const gy=pad.t+plotH-plotH*i/4
    svg+=`<line x1="${pad.l}" y1="${gy}" x2="${pad.l+plotW}" y2="${gy}" class="chart-grid"/>`
    svg+=`<text x="${pad.l-6}" y="${gy+4}" text-anchor="end" class="chart-axis">${cfg.yFmt(maxY*i/4)}</text>`
  }
  svg+=`<text x="${pad.l+plotW/2}" y="${h-2}" text-anchor="middle" class="chart-axis">${cfg.xLabel} →</text>`
  svg+=`<text x="12" y="${pad.t+plotH/2}" text-anchor="middle" class="chart-axis" transform="rotate(-90 12 ${pad.t+plotH/2})">${cfg.yLabel} →</text>`
  svg+=`<line x1="${x(avgX)}" y1="${pad.t}" x2="${x(avgX)}" y2="${pad.t+plotH}" stroke="var(--borde2)" stroke-width="1.5" stroke-dasharray="3 3"/>`
  svg+=`<line x1="${pad.l}" y1="${y(avgY)}" x2="${pad.l+plotW}" y2="${y(avgY)}" stroke="var(--borde2)" stroke-width="1.5" stroke-dasharray="3 3"/>`
  rows.forEach(r=>{
    const cx=x(cfg.xFn(r)),cy=y(cfg.yFn(r))
    const rad=r.isTemuco?16:12
    const crest=crestUrl(r.nombre)
    const tip=`${r.nombre}\n${cfg.xLabel}: ${cfg.xFmt(cfg.xFn(r))}\n${cfg.yLabel}: ${cfg.yFmt(cfg.yFn(r))}`
    svg+=`<circle cx="${cx}" cy="${cy}" r="${rad+3}" fill="#fff" stroke="${r.isTemuco?'var(--v)':'var(--borde2)'}" stroke-width="${r.isTemuco?2.5:1.5}"/>`
    if(crest)svg+=`<image href="${crest}" x="${cx-rad}" y="${cy-rad}" width="${rad*2}" height="${rad*2}" preserveAspectRatio="xMidYMid meet"><title>${tip}</title></image>`
    else svg+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="var(--borde2)"><title>${tip}</title></circle>`
    if(r.isTemuco)svg+=`<text x="${cx}" y="${cy-rad-8}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--v)">${r.nombre}</text>`
  })
  svg+=`</svg>`
  return svg
}

// ---- Coeficiente de correlación de Pearson (dependencia estadística) ----
function pearsonR(rows,xFn,yFn){
  const n=rows.length
  if(n<2)return 0
  const xs=rows.map(xFn),ys=rows.map(yFn)
  const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n
  let sxy=0,sxx=0,syy=0
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy}
  const denom=Math.sqrt(sxx*syy)
  return denom?sxy/denom:0
}
function interpretaR(r){
  const a=Math.abs(r)
  const fuerza=a>=0.7?'fuerte':a>=0.4?'moderada':a>=0.2?'débil':'muy débil o nula'
  const signo=a<0.05?'':r>0?', positiva':', negativa'
  return`r = ${r.toFixed(2)} — correlación ${fuerza}${signo}`
}

  if(!S.analisis.loaded)return`<div class="pb"><div class="empty">Cargando comparativa…</div></div>`
  const rows=statsAnalisis()
  const cat=S.analisis.tab

  const contenido=
    cat==='ataque'?`
      <div style="color:var(--gris);font-size:12px;margin-bottom:12px">Cada escudo es un equipo. Arriba a la izquierda = ataca mucho y recibe poco. Las líneas punteadas marcan el promedio de los equipos filtrados.</div>

    `:

      <div style="display:flex;gap:14px;margin-bottom:10px;font-size:11px;font-weight:700;color:var(--gris)">

    `:
    cat==='rendimiento'?`
      <div style="color:var(--gris);font-size:12px;margin-bottom:12px">Puntos obtenidos por partido jugado, según condición.</div>
      <div style="display:flex;gap:14px;margin-bottom:10px;font-size:11px;font-weight:700;color:var(--gris)">

      const rDisc=pearsonR(rows,r=>r.amPP+r.rjPP,r=>r.ptsPP)
      const rSub21=pearsonR(rows,r=>r.sub21Min,r=>r.ptsPP)
      const chip=r=>`<div style="display:inline-block;font-size:12.5px;font-weight:800;color:${Math.abs(r)>=0.4?'var(--v)':'var(--gris)'};background:rgba(16,24,32,.04);border:1px solid var(--borde);border-radius:999px;padding:4px 12px;margin-bottom:10px">${interpretaR(r)}</div>`
      return`
        <div style="color:var(--gris);font-size:12px;margin-bottom:18px">Análisis de dependencia estadística: qué tan relacionadas están dos variables entre los 16 equipos. El coeficiente de correlación de Pearson (r) va de -1 (relación inversa perfecta) a +1 (relación directa perfecta); cerca de 0 significa que no hay relación real entre ambas.</div>
        <div class="pt disp" style="font-size:15px;margin-bottom:2px">Disciplina vs Rendimiento</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Tarjetas por partido (eje X) vs puntos por partido (eje Y)</div>
        ${chip(rDisc)}
        ${svgScatterXY(rows,{xFn:r=>r.amPP+r.rjPP,yFn:r=>r.ptsPP,xFmt:v=>v.toFixed(2),yFmt:v=>v.toFixed(2),xLabel:'Tarjetas por partido',yLabel:'Puntos por partido',xMaxHint:3.5,yMaxHint:2.5})}
        <div class="pt disp" style="font-size:15px;margin:26px 0 2px">Minutos Sub-21 vs Rendimiento</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Minutos oficiales sub-21 en la temporada (eje X) vs puntos por partido (eje Y)</div>
        ${chip(rSub21)}
        ${svgScatterXY(rows,{xFn:r=>r.sub21Min,yFn:r=>r.ptsPP,xFmt:v=>Math.round(v).toLocaleString('es-CL'),yFmt:v=>v.toFixed(2),xLabel:'Minutos Sub-21',yLabel:'Puntos por partido',xMaxHint:1000,yMaxHint:2.5})}
      `
    })()

  return`<div class="pb">
    <div class="pt disp" style="font-size:18px;margin-bottom:4px">Análisis de datos · Liga de Ascenso</div>
    <div style="color:var(--gris);font-size:12px;margin-bottom:14px">Comparación entre los 16 equipos. Filtra quiénes se muestran.</div>
    ${renderFiltroEquipos()}
    <div class="tabs">${ANALISIS_CATS.map(c=>`<button class="tab ${cat===c.id?'on':''}" onclick="S.analisis.tab='${c.id}';render()">${c.l}</button>`).join('')}</div>
    <div class="panel"><div class="pb">${contenido}</div></div>
  </div>`
}

async function guardarSancion(){
  const f=S.sancionForm
  if(!f.equipo_id||!f.puntos||f.puntos<=0||!f.motivo.trim()){toast('Completa equipo, puntos y motivo',true);return}
  const r=await post('liga_sanciones',{equipo_id:+f.equipo_id,puntos:+f.puntos,motivo:f.motivo.trim(),fecha:f.fecha})
  if(Array.isArray(r)&&r[0]){
    toast('Sanción registrada')
    S.sancionForm={equipo_id:'',puntos:1,motivo:'',fecha:hoy()}
    await cargarLiga()
  }else toast('Error al guardar (¿sesión admin activa?)',true)
}
async function borrarSancion(id){
  if(!confirm('¿Eliminar esta sanción? El equipo recupera los puntos.'))return
  await del('liga_sanciones',`?id=eq.${id}`)
  await cargarLiga()
  toast('Sanción eliminada')
}
function renderSanciones(){
  const equiposOrd=[...S.liga.equipos].sort((a,b)=>a.nombre.localeCompare(b.nombre))
  const f=S.sancionForm
  return`<div class="panel" style="margin-bottom:14px">
    <div class="ph"><span class="pt">Descontar puntos</span></div>
    <div class="pb">
      <div style="font-size:11.5px;color:var(--gris);margin-bottom:10px">Para sanciones administrativas ajenas al partido (incumplimientos, inhabilitaciones, etc). El descuento se aplica de inmediato en la tabla de posiciones, para cualquier equipo de la liga.</div>
      <div class="fr2">
        <div class="fg"><label>Equipo</label>
          <select onchange="S.sancionForm.equipo_id=this.value">
            <option value="">Selecciona…</option>
            ${equiposOrd.map(e=>`<option value="${e.id}" ${f.equipo_id==e.id?'selected':''}>${e.nombre}</option>`).join('')}
          </select>
        </div>
        <div class="fg"><label>Puntos a descontar</label><input type="number" min="1" value="${f.puntos}" oninput="S.sancionForm.puntos=this.value"></div>
      </div>
      <div class="fg"><label>Motivo</label><input type="text" placeholder="Ej: Incumplimiento reglamento ANFP art. X" value="${f.motivo}" oninput="S.sancionForm.motivo=this.value"></div>
      <div class="fg" style="margin-bottom:0"><label>Fecha</label><input type="date" value="${f.fecha}" oninput="S.sancionForm.fecha=this.value"></div>
      <button class="btn" style="margin-top:12px" onclick="guardarSancion()">Registrar sanción</button>
    </div>
  </div>
  <div class="ph" style="background:none;border:none;padding:0 0 8px"><span class="pt">Sanciones registradas</span></div>
  ${S.liga.sanciones.length?S.liga.sanciones.map(s=>{
    const eq=S.liga.equipos.find(e=>e.id===s.equipo_id)
    return`<div class="pcard" style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <img src="${eq?crestUrl(eq.nombre):''}" style="width:26px;height:26px;object-fit:contain;flex-shrink:0">
      <div style="flex:1">
        <div style="font-weight:700;font-size:12.5px">${eq?eq.nombre:'?'} <span style="color:var(--ro);font-weight:800">-${s.puntos} pts</span></div>
        <div style="font-size:11px;color:var(--gris)">${s.motivo}</div>
        <div style="font-size:10px;color:var(--muted)">${s.fecha}</div>
      </div>
      <button class="bsm" onclick="borrarSancion(${s.id})">Eliminar</button>
    </div>`
  }).join(''):'<div class="empty">Sin sanciones registradas.</div>'}`
}

function renderAdmin(){
  if(!S.isAdmin)return renderLogin()
  const subs=[{id:'registro',l:'Registro'},{id:'medico',l:'Médico'},{id:'sanciones',l:'⚖ Sanciones'},{id:'config',l:'⚙ Config'},{id:'debug',l:'🛠 Debug'}]
  return`<div class="tabs">${subs.map(t=>`<button class="tab ${S.adminSub===t.id?'on':''}" onclick="S.adminSub='${t.id}';render()">${t.l}</button>`).join('')}</div>
  ${
    S.adminSub==='registro'?renderRegistro():
    S.adminSub==='medico'?renderMedico():
    S.adminSub==='sanciones'?renderSanciones():
    S.adminSub==='config'?renderConfig():
    renderDebug()
  }`
}

function render(){
  const root=document.getElementById('root')
  root.innerHTML=`<div id="app"><div class="hdrwrap">${renderHdr()}${renderNav()}</div>${
    S.pag==='inicio'?renderInicio():
    S.pag==='plantilla'?renderPlantilla():
    S.pag==='partidos'?renderPartidos():
    S.pag==='estadisticas'?renderEstadisticas():
    S.pag==='consultas'?renderConsultas():
    S.pag==='rivales'?renderRivales():
    S.pag==='tabla'?renderTablaGeneral():
    S.pag==='partido'?renderPartidoLiga():
    S.pag==='analisis'?renderAnalisis():
    S.pag==='notas'?renderNotas():
    S.pag==='admin'?renderAdmin():
    renderInicio()
  }</div>`
  // Scroll automático al partido activo en Registro
  if(S.pag==='admin'&&S.adminSub==='registro'){
    const el=document.getElementById('partido-activo')
    if(el)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})
  }
}

render()
cargarDatos()
cargarLiga()
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deportes Temuco · Liga de Ascenso 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --red:#ed1b2d; --red-dark:#c81527; --navy:#16324a; --navy2:#1e4468;
    --gold:#f3d031; --green:#3bcc79; --bg:#f7f7f5; --ink:#16202b;
    --muted:#6b7785; --card:#ffffff; --line:#e7e9ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Manrope',system-ui,sans-serif;color:var(--ink)}
  a{color:var(--red);text-decoration:none} a:hover{color:var(--red-dark)}
  .disp{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:800;letter-spacing:.01em}
  .eyebrow{font-family:'Manrope';font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .wrap{max-width:1320px;margin:0 auto;padding:0 24px 60px}
  img{max-width:100%}

  .nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
  .nav-links{display:flex;gap:30px;align-items:center}
  .nav-links a{font-weight:700;font-size:13px;color:var(--muted)}
  .nav-links a:hover{color:var(--ink)}
  .nav-links .on{font-weight:800;color:var(--red);border-bottom:2px solid var(--red);padding-bottom:3px}
  .nav-links .classic{font-size:11px;color:var(--muted);opacity:.7;font-weight:600;border-bottom:none}

  .hero{position:relative;border-radius:22px;overflow:hidden;background:var(--navy);min-height:340px}
  .hero-split{position:absolute;inset:0;background:linear-gradient(115deg, var(--red) 0%, var(--red) 42%, var(--navy) 43%, var(--navy) 100%)}
  .hero-stripes{position:absolute;inset:0;opacity:.10;background:repeating-linear-gradient(115deg, #fff 0 2px, transparent 2px 40px)}
  .hero-inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:32px 36px 36px}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
  .hero-fecha{color:#fff;font-size:32px;line-height:1;margin-top:6px}
  .hero-mid{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap}
  .hero-team{display:flex;flex-direction:column;align-items:center;gap:12px;width:150px}
  .hero-crest{width:84px;height:84px;background:#fff;border-radius:50%;padding:11px;box-shadow:0 12px 30px rgba(0,0,0,.25);object-fit:contain}
  .hero-team-name{color:#fff;font-size:17px;text-align:center;line-height:1.15}
  .hero-score{color:#fff;font-size:76px;line-height:1}
  .hero-meta{background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:12.5px;padding:9px 22px;border-radius:999px;text-align:center}

  .section{padding:48px 0 8px}
  .section-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
  .section-title{font-size:26px}
  .section-link{font-size:13px;font-weight:700;color:var(--red);cursor:pointer;background:none;border:none;font-family:inherit}
  .section-link:hover{color:var(--red-dark)}

  .goleadores-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
  @media(max-width:900px){.goleadores-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .gcard{background:var(--card);border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:9px;border:1px solid var(--line)}
  .gcard-rank{font-size:14px;color:var(--muted)}
  .gcard-av{width:60px;height:60px;border-radius:50%;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
  .gcard-crest{width:22px;height:22px;object-fit:contain}
  .gcard-name{font-weight:800;font-size:13px;text-align:center;line-height:1.2}
  .gcard-team{color:var(--muted);font-size:10.5px;margin-top:1px;text-align:center}
  .gcard-goles{font-size:32px;color:var(--red);margin-top:2px}
  .gcard-lbl{color:var(--muted);font-size:9px}

  .sub21{margin:44px 0 0;background:var(--navy);border-radius:22px;padding:32px 36px;display:flex;align-items:center;gap:48px;flex-wrap:wrap}
  .sub21-num{color:#fff;font-size:56px;line-height:1;margin-top:8px}
  .sub21-num small{font-size:20px;color:#8fb3cc;font-family:'Manrope';font-weight:700}
  .sub21-bar{height:8px;width:260px;border-radius:999px;background:rgba(255,255,255,.15);margin-top:14px;overflow:hidden}
  .sub21-bar-f{height:100%;background:var(--green);border-radius:999px}
  .sub21-pct{color:#8fb3cc;font-size:12px;font-weight:600;margin-top:8px}
  .sub21-list{flex:1;min-width:260px;display:flex;flex-direction:column;gap:10px}
  .sub21-cards{display:flex;gap:12px;flex-wrap:wrap}
  .sub21-card{background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;flex:1;min-width:120px}
  .sub21-card-n{color:#fff;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub21-card-b{color:#8fb3cc;font-size:10.5px;margin-top:2px}
  .sub21-card-m{color:var(--gold);font-size:22px;margin-top:6px}

  .teams-row{display:flex;flex-wrap:wrap;gap:8px}
  .team-chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer;font-size:12px;font-weight:700}
  .team-chip img{width:20px;height:20px;object-fit:contain}
  .team-chip:hover{border-color:var(--red)}
  .team-chip.on{border-color:var(--red);background:#fdeceb;color:var(--red)}
  .team-chip.temuco{border-color:var(--red)}

  .rival-panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-top:16px}
  .rival-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
  .rival-row:first-child{border-top:none}
  .rival-score{font-family:var(--font-disp,inherit);font-weight:800;font-size:15px;width:48px;text-align:center}

  .foot{text-align:center;color:var(--muted);font-size:11px;padding:50px 0 20px}
  .loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">

  <div class="nav">
    <div style="display:flex;align-items:center;gap:12px">
      <img src="https://www.campeonatochileno.cl/wp-content/uploads/2025/01/Temuco-1.svg" style="width:32px;height:32px">
      <div class="disp" style="font-size:18px">DEPORTES TEMUCO</div>
    </div>
    <div class="nav-links">
      <a href="index-clasica.html">Plantilla</a>
      <a href="index-clasica.html">Partidos</a>
      <a href="index-clasica.html">Estadísticas</a>
      <a href="#" class="on">Liga Ascenso</a>
      <a href="index-clasica.html" class="classic">Versión clásica ↗</a>
    </div>
  </div>

  <div id="content"><div class="loading">Cargando datos de la liga…</div></div>

  <div class="foot">Datos oficiales ANFP / COMET vía campeonatochileno.cl · actualizado automáticamente</div>
</div>

<script>
const SB_URL='https://vskhzbstwadaabzyhzwh.supabase.co'
const SB_KEY='sb_publishable_Xpm4vH8few7gjsDcIM_2qA_3rjYFHeu'
async function get(table,params=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}${params}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}})
  const t=await r.text()
  try{return JSON.parse(t)}catch(e){return[]}
}

const CREST_BASE='https://www.campeonatochileno.cl/wp-content/uploads/'
const CRESTS={
  'Deportes Antofagasta':CREST_BASE+'2025/01/Antofagasta.svg',
  'Cobreloa':CREST_BASE+'2025/01/cobreloa.png',
  'Deportes Copiapó':CREST_BASE+'2025/01/Club_de_Deportes_Copiap_-_Chile.png',
  'Curicó Unido':CREST_BASE+'2025/01/Curico-Unido.svg',
  'Deportes Iquique':CREST_BASE+'2025/01/deportesiqui.png',
  'Magallanes':CREST_BASE+'2025/01/Magallanes.svg',
  'Deportes Puerto Montt':CREST_BASE+'2025/02/D.-Puerto-Montt.png',
  'Rangers de Talca':CREST_BASE+'2025/01/Rangers.svg',
  'Deportes Recoleta':CREST_BASE+'2025/01/Recoleta.svg',
  'Unión San Felipe':CREST_BASE+'2025/01/sanfelipe.png',
  'San Luis':CREST_BASE+'2025/01/San-Luis.svg',
  'San Marcos de Arica':CREST_BASE+'2025/01/San-Marcos-Arica.svg',
  'Club Deportes Santa Cruz':CREST_BASE+'2025/01/D.-Santa-Cruz.svg',
  'Deportes Temuco':CREST_BASE+'2025/01/Temuco-1.svg',
  'Unión Española':CREST_BASE+'2025/01/union-espanola.png',
  'Santiago Wanderers':CREST_BASE+'2025/01/Santiago-Wanderers-2.svg',
}
function crestUrl(n){return CRESTS[n]||''}
function iniciales(n){return n.trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase()}
function fmtFecha(iso){
  if(!iso)return''
  return new Date(iso).toLocaleDateString('es-CL',{day:'numeric',month:'long'})
}

let DATA={equipos:[],temucoId:null,ultimo:null,goleadores:[],sub21:[],rivalSel:null,rivalPartidos:[],golExpand:false}

async function boot(){
  const[equipos,goles,jugadores]=await Promise.all([
    get('liga_equipos','?select=id,nombre&order=nombre'),
    get('liga_goles','?select=jugador_id,autogol&autogol=eq.false&limit=1000'),
    get('liga_jugadores','?select=id,apellido,nombre,equipo_id,sub21,minutos_oficial_temporada,fecha_nacimiento&limit=1000'),
  ])
  DATA.equipos=Array.isArray(equipos)?equipos:[]
  const temuco=DATA.equipos.find(e=>e.nombre==='Deportes Temuco')
  DATA.temucoId=temuco?temuco.id:null

  const jugArr=Array.isArray(jugadores)?jugadores:[]
  const jugMap={};jugArr.forEach(j=>{jugMap[j.id]=j})
  const conteo={}
  ;(Array.isArray(goles)?goles:[]).forEach(g=>{conteo[g.jugador_id]=(conteo[g.jugador_id]||0)+1})
  DATA.goleadores=Object.entries(conteo).map(([jid,n])=>{
    const j=jugMap[jid];const eq=j?DATA.equipos.find(e=>e.id===j.equipo_id):null
    return{goles:n,nombre:j?`${j.nombre} ${j.apellido}`:'?',equipo:eq?eq.nombre:'?',crest:eq?crestUrl(eq.nombre):''}
  }).sort((a,b)=>b.goles-a.goles).slice(0,12)

  DATA.sub21=jugArr.filter(j=>j.equipo_id===DATA.temucoId&&j.sub21)
    .sort((a,b)=>(b.minutos_oficial_temporada||0)-(a.minutos_oficial_temporada||0))

  if(DATA.temucoId){
    const partidos=await get('liga_partidos',`?or=(equipo_local_id.eq.${DATA.temucoId},equipo_visita_id.eq.${DATA.temucoId})&select=jornada,fecha_hora,estadio,equipo_local_id,local:liga_equipos!liga_partidos_equipo_local_id_fkey(nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(nombre),goles_local,goles_visita&order=fecha_hora.desc&limit=1`)
    DATA.ultimo=Array.isArray(partidos)&&partidos[0]?partidos[0]:null
  }
  render()
}

async function verRival(id){
  if(DATA.rivalSel===id){DATA.rivalSel=null;render();return}
  DATA.rivalSel=id;DATA.rivalPartidos=null;render()
  const partidos=await get('liga_partidos',`?or=(equipo_local_id.eq.${id},equipo_visita_id.eq.${id})&select=jornada,fecha_hora,local:liga_equipos!liga_partidos_equipo_local_id_fkey(nombre),visita:liga_equipos!liga_partidos_equipo_visita_id_fkey(nombre),goles_local,goles_visita&order=fecha_hora.desc&limit=5`)
  DATA.rivalPartidos=Array.isArray(partidos)?partidos:[]
  render()
}
function toggleGoleadores(){DATA.golExpand=!DATA.golExpand;render()}

function render(){
  const el=document.getElementById('content')
  const u=DATA.ultimo
  const goleadores=DATA.golExpand?DATA.goleadores:DATA.goleadores.slice(0,5)
  const sub21Total=DATA.sub21.reduce((a,j)=>a+(j.minutos_oficial_temporada||0),0)

  el.innerHTML=`
    ${u?`<div class="hero">
      <div class="hero-split"></div><div class="hero-stripes"></div>
      <div class="hero-inner">
        <div class="hero-top">
          <div>
            <div class="eyebrow" style="color:#ffd7da">Liga de Ascenso Caixun 2026</div>
            <div class="disp hero-fecha">FECHA ${u.jornada||''}</div>
          </div>
          <img src="https://www.campeonatochileno.cl/wp-content/uploads/2025/02/logo-liga-ascenso-caixun-05@2x.png" style="height:28px;filter:brightness(0) invert(1);opacity:.85">
        </div>
        <div class="hero-mid">
          <div class="hero-team">
            <img class="hero-crest" src="${crestUrl(u.local.nombre)}">
            <div class="disp hero-team-name">${u.local.nombre.toUpperCase()}</div>
          </div>
          <div class="disp hero-score">${u.goles_local}&nbsp;–&nbsp;${u.goles_visita}</div>
          <div class="hero-team">
            <img class="hero-crest" src="${crestUrl(u.visita.nombre)}">
            <div class="disp hero-team-name">${u.visita.nombre.toUpperCase()}</div>
          </div>
        </div>
        <div style="display:flex;justify-content:center">
          <div class="hero-meta">${fmtFecha(u.fecha_hora)}${u.estadio?' · '+u.estadio:''} · Tiempo completo</div>
        </div>
      </div>
    </div>`:''}

    <div class="section">
      <div class="section-hdr">
        <div class="disp section-title">Goleadores de la temporada</div>
        <button class="section-link" onclick="toggleGoleadores()">${DATA.golExpand?'Ver menos':'Ver tabla completa →'}</button>
      </div>
      <div class="goleadores-grid">
        ${goleadores.map((g,i)=>`
          <div class="gcard">
            <div class="disp gcard-rank">#${i+1}</div>
            <div class="gcard-av">${iniciales(g.nombre)}</div>
            ${g.crest?`<img class="gcard-crest" src="${g.crest}">`:''}
            <div>
              <div class="gcard-name">${g.nombre}</div>
              <div class="gcard-team">${g.equipo}</div>
            </div>
            <div class="disp gcard-goles">${g.goles}</div>
            <div class="eyebrow gcard-lbl">GOLES</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="sub21">
      <div style="flex-shrink:0">
        <div class="eyebrow" style="color:#8fb3cc">Fiscalización sub-21 · D. Temuco</div>
        <div class="disp sub21-num">${sub21Total.toLocaleString('es-CL')}<small>' acumulados</small></div>
        <div class="sub21-pct">suma de minutos oficiales de los ${DATA.sub21.length} jugadores sub-21 usados esta temporada</div>
      </div>
      <div class="sub21-list">
        <div class="eyebrow" style="color:#8fb3cc">Jugadores con más minutos</div>
        <div class="sub21-cards">
          ${DATA.sub21.slice(0,4).map(j=>`
            <div class="sub21-card">
              <div class="sub21-card-n">${j.nombre} ${j.apellido}</div>
              <div class="sub21-card-b">Nacido ${(j.fecha_nacimiento||'').slice(0,4)||'—'}</div>
              <div class="disp sub21-card-m">${j.minutos_oficial_temporada||0}'</div>
            </div>
          `).join('')||'<div style="color:#8fb3cc;font-size:12px">Sin jugadores sub-21 registrados.</div>'}
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-hdr"><div class="disp section-title">Explora la liga</div></div>
      <div class="teams-row">
        ${[...DATA.equipos].sort((a,b)=>a.id===DATA.temucoId?-1:b.id===DATA.temucoId?1:a.nombre.localeCompare(b.nombre)).map(e=>`
          <div class="team-chip ${DATA.rivalSel===e.id?'on':''} ${e.id===DATA.temucoId?'temuco':''}" onclick="verRival(${e.id})">
            <img src="${crestUrl(e.nombre)}">${e.nombre}
          </div>
        `).join('')}
      </div>
      ${DATA.rivalSel?`<div class="rival-panel">
        <div class="disp" style="font-size:17px;margin-bottom:8px">${(DATA.equipos.find(e=>e.id===DATA.rivalSel)||{}).nombre||''} · últimos partidos</div>
        ${DATA.rivalPartidos===null?'<div style="color:var(--muted);font-size:12px">Cargando…</div>':
          (DATA.rivalPartidos.map(p=>`
            <div class="rival-row">
              <div style="color:var(--muted);width:80px">F${p.jornada||'-'} · ${fmtFecha(p.fecha_hora)}</div>
              <div style="flex:1;text-align:right;font-weight:700">${p.local.nombre}</div>
              <div class="disp rival-score">${p.goles_local}-${p.goles_visita}</div>
              <div style="flex:1;font-weight:700">${p.visita.nombre}</div>
            </div>
          `).join('')||'<div style="color:var(--muted);font-size:12px">Sin partidos registrados.</div>')
        }
      </div>`:''}
    </div>
  `
}

boot()
</script>
</body>
</html>

name: Web Scraper

# Las corridas automáticas están APAGADAS desde el 09-09-2026.
#
# Cloudflare empezó a bloquear por IP a los runners de GitHub: toda request
# a campeonatochileno.cl vuelve 403 con la página de bloqueo del firewall
# (cf-mitigated vacío, o sea que ni siquiera es un desafío que se pueda
# resolver). Cambiar headers no sirve — se probó. Mientras siga así, el
# scraper se corre desde el PC de casa con scraper/actualizar.bat, que sale
# por una IP residencial chilena y pasa sin problema.
#
# El cron quedó comentado en vez de borrado: si alguna vez se levanta el
# bloqueo, se descomenta y vuelve solo. El disparo manual sigue disponible
# acá abajo para probar si ya se puede.
on:
  # schedule:
  #   - cron: '0 13 * * *' # 09:00 en Chile
  #   - cron: '0 1 * * *' # 21:00 en Chile
  workflow_dispatch:
    inputs:
      liga_url:
        description: 'URL de la liga en campeonatochileno.cl'
        required: false
        default: 'https://www.campeonatochileno.cl/ligas/liga-de-ascenso-caixun/'
      limit:
        description: 'Máximo de partidos a procesar (0 = todos)'
        required: false
        default: '0'
      force:
        description: 'Re-scrapear partidos que ya están en la base'
        required: false
        default: false
        type: boolean

# Que no se pisen dos corridas si una manual cae junto a una programada.
concurrency:
  group: scrape-liga
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # En las corridas programadas los inputs vienen vacíos, por eso cada
    # uno tiene su valor por defecto acá: si no, el scraper correría con
    # la URL en blanco.
    env:
      LIGA_URL: ${{ github.event.inputs.liga_url || 'https://www.campeonatochileno.cl/ligas/liga-de-ascenso-caixun/' }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: scraper
        run: npm install

      - name: Scrapear partidos (alineaciones, goles, tarjetas, minutaje)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scrape.mjs \
            --liga "$LIGA_URL" \
            --limit "$LIMIT" \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Scrapear tabla oficial de minutos sub-21
        if: ${{ !cancelled() }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scrapeU21.mjs --liga "$LIGA_URL"

      - name: Vincular plantel propio con liga_jugadores
        if: ${{ !cancelled() }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node link-jugadores.mjs
